<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcf0f2">
<title>Pocket Metropolis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: the city fills the screen edge to edge; the interface floats on top like stickers on glass. */
:root {
  --sky: #dcf0f2;
  --panel: rgba(255, 252, 250, 0.8);
  --panel-edge: rgba(255, 255, 255, 0.95);
  --ink: #4b4468;
  --ink-soft: #8b84a6;
  --press: #ffffff;
  --meter-track: rgba(75, 68, 104, 0.1);
  --meter: #8fd0a5;
  --focus: #9f86d6;
  --shadow: 0 8px 24px rgba(84, 70, 130, 0.16), 0 1px 3px rgba(84, 70, 130, 0.12);
  --tint-house: #ffb5a7;
  --tint-tower: #cdb4db;
  --tint-tree: #a8d5a2;
  --tint-park: #b8e0d2;
  --tint-road: #d6d0c4;
  --tint-water: #7ec8e3;
  --tint-bulldoze: #fcd5ce;
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --sky: #2c2e58;
    --panel: rgba(46, 42, 82, 0.78);
    --panel-edge: rgba(255, 255, 255, 0.14);
    --ink: #f4effc;
    --ink-soft: #b9b1d8;
    --press: rgba(255, 255, 255, 0.16);
    --meter-track: rgba(255, 255, 255, 0.14);
    --focus: #d7c6ff;
    --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --sky: #2c2e58;
  --panel: rgba(46, 42, 82, 0.78);
  --panel-edge: rgba(255, 255, 255, 0.14);
  --ink: #f4effc;
  --ink-soft: #b9b1d8;
  --press: rgba(255, 255, 255, 0.16);
  --meter-track: rgba(255, 255, 255, 0.14);
  --focus: #d7c6ff;
  --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
  color-scheme: dark;
}

html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: fixed;
  inset: 0;
}
#city {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}
#city:active {
  cursor: grabbing;
}

.glass {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  backdrop-filter: blur(14px) saturate(1.3);
}

/* Stats bubble */
.stats {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: grid;
  grid-template-columns: auto auto;
  column-gap: 18px;
  row-gap: 6px;
  padding: 10px 16px 10px 12px;
  border-radius: 22px;
  pointer-events: none;
}
.stat {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-badge {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 12px;
  color: #5a4a62;
}
.stat-badge svg {
  width: 20px;
  height: 20px;
}
.badge-pop {
  background: var(--tint-house);
}
.badge-mood {
  background: var(--tint-park);
}
.stat-text {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
}
.stat-value {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.stat-value small {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-left: 1px;
}
.stat-label {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}
.meter {
  width: 100%;
  height: 4px;
  margin-top: 3px;
  border-radius: 4px;
  background: var(--meter-track);
  overflow: hidden;
}
.meter span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--meter);
  transition: width 0.6s ease;
}
.clock {
  grid-column: 1 / -1;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  padding-left: 2px;
}

/* Corner buttons */
.corner {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  display: flex;
  gap: 8px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 42px;
  padding: 0 16px 0 12px;
  border-radius: 21px;
  color: var(--ink);
  font: 800 13.5px/1 var(--font-body);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.pill svg {
  width: 20px;
  height: 20px;
}
.pill:hover {
  transform: translateY(-1px);
}
.pill:active {
  transform: translateY(1px) scale(0.97);
}
.pill.icon-only {
  width: 42px;
  padding: 0;
  justify-content: center;
}
.dice {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  background: var(--tint-tower);
  color: #4f3f62;
}
.dice svg {
  width: 18px;
  height: 18px;
}

/* Toolbar */
.toolbar {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 26px;
  max-width: calc(100vw - 32px);
}
.tool {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 58px;
  padding: 6px 0 5px;
  border-radius: 20px;
  cursor: pointer;
  font: 800 11px/1 var(--font-body);
  letter-spacing: 0.02em;
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.15s ease;
}
.tool-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 14px;
  color: #4d4360;
  background: var(--tint);
  box-shadow: inset 0 -3px 0 rgba(70, 50, 90, 0.12);
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.tool-icon svg {
  width: 22px;
  height: 22px;
}
.tool-label {
  color: var(--ink-soft);
}
.tool:hover .tool-icon {
  transform: translateY(-2px);
}
.tool[aria-pressed='true'] {
  background: var(--press);
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}
.tool[aria-pressed='true'] .tool-icon {
  transform: scale(1.06);
}
.tool[aria-pressed='true'] .tool-label {
  color: var(--ink);
}
#tool-house { --tint: var(--tint-house); }
#tool-tower { --tint: var(--tint-tower); }
#tool-tree { --tint: var(--tint-tree); }
#tool-park { --tint: var(--tint-park); }
#tool-road { --tint: var(--tint-road); }
#tool-water { --tint: var(--tint-water); }
#tool-bulldoze { --tint: var(--tint-bulldoze); }

button:focus-visible {
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
}

/* Toast */
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 112px);
  transform: translate(-50%, 8px);
  max-width: calc(100vw - 48px);
  padding: 9px 16px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 560px) {
  .stats {
    column-gap: 12px;
    padding: 8px 12px 8px 9px;
  }
  .stat-badge {
    width: 28px;
    height: 28px;
    border-radius: 10px;
  }
  .stat-value {
    font-size: 17px;
  }
  .pill-text {
    display: none;
  }
  .pill {
    width: 42px;
    padding: 0;
    justify-content: center;
  }
  .corner {
    flex-direction: column;
  }
  .toolbar {
    gap: 2px;
    padding: 5px;
  }
  .tool {
    width: 46px;
    font-size: 10px;
  }
  .tool-icon {
    width: 34px;
    height: 34px;
    border-radius: 12px;
  }
  .tool-icon svg {
    width: 20px;
    height: 20px;
  }
  .toast {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  }
}
@media (max-width: 360px) {
  .tool {
    width: 40px;
  }
  .tool-label {
    font-size: 9px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tool,
  .tool-icon,
  .pill,
  .toast,
  .meter span {
    transition: none;
  }
}

</style>
</head>
<body>
<main id="app">
      <canvas id="city" aria-label="Your city. Tap a tile to build, drag to pan, pinch or scroll to zoom."></canvas>

      <section class="stats glass" aria-label="City stats" aria-live="polite">
        <div class="stat">
          <span class="stat-badge badge-pop">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6-.3 4.6 1.6 4.6 4.3"/></svg>
          </span>
          <span class="stat-text">
            <span class="stat-value"><span id="stat-pop">0</span><small id="stat-cap">/0</small></span>
            <span class="stat-label">Population</span>
          </span>
        </div>
        <div class="stat">
          <span class="stat-badge badge-mood">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 9.8h.01M15 9.8h.01" stroke-width="2.6"/><path id="mood-mouth" d="M8.5 14c1.9 2.2 5.1 2.2 7 0"/></svg>
          </span>
          <span class="stat-text">
            <span class="stat-value" id="stat-happy">–</span>
            <span class="stat-label">Happiness</span>
            <span class="meter" aria-hidden="true"><span id="happy-meter"></span></span>
          </span>
        </div>
        <div class="clock" id="stat-clock">Day 1</div>
      </section>

      <div class="corner">
        <button type="button" id="btn-fit" class="pill glass icon-only" aria-label="Recenter the city" title="Recenter">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><path d="m12 8.5 3.5 2v3l-3.5 2-3.5-2v-3z"/></svg>
        </button>
        <button type="button" id="btn-random" class="pill glass" aria-label="Generate a random town">
          <span class="dice"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9h.01M15 9h.01M12 12h.01M9 15h.01M15 15h.01" stroke-width="2.8"/></svg></span>
          <span class="pill-text">Random Town</span>
        </button>
      </div>

      <nav class="toolbar glass" id="toolbar" aria-label="Build tools"></nav>
      <div class="toast glass" id="toast" role="status"></div>
    </main>
<script>
'use strict';
(() => {
// ---- config.js ----
const __mod_config = (() => {
// Static game data. Systems read from here; nothing in this file holds mutable state.

const TILE_W = 64;
const TILE_H = 32;
const DEFAULT_MAP_SIZE = 12;
const SAVE_VERSION = 1;
const DAY_LENGTH_SECONDS = 300; // one full day/night cycle
const SIM_STEP = 0.25; // fixed simulation tick, in seconds

const PALETTE = {
  grass: '#a8d5a2',
  water: '#7ec8e3',
  road: '#d6d0c4',
  peach: '#ffb5a7',
  blush: '#fcd5ce',
  mint: '#b8e0d2',
  lavender: '#cdb4db',
  sidewalk: '#ece7dd',
  sand: '#efe3c8',
  earth: '#d2b89c',
  earthDark: '#b09379',
  leaf: '#93cf98',
  leafLight: '#b9e4ab',
  leafDeep: '#76b585',
  blossom: '#f7c6cf',
  blossomLight: '#fde0e5',
  trunk: '#b99679',
  parkGrass: '#b9e2ad',
  path: '#efe6d6',
  stone: '#f1ece4',
  glass: '#e5eff5',
  windowLit: '#ffe29a',
  pole: '#9d97b6',
  lampOff: '#efe9f6',
  lampOn: '#fff4c9',
  marking: '#fbf8f2',
};

const BUILDING_VARIANTS = {
  peach: { wall: PALETTE.peach, roof: '#e9968c', trim: '#fff1ec' },
  blush: { wall: PALETTE.blush, roof: '#e6a79e', trim: '#fff7f4' },
  mint: { wall: PALETTE.mint, roof: '#8ec3af', trim: '#f2fbf7' },
  lavender: { wall: PALETTE.lavender, roof: '#a991c4', trim: '#f8f2fb' },
};
const VARIANT_KEYS = Object.keys(BUILDING_VARIANTS);

// Structure definitions. `capacity` > 0 makes a structure housing; `greenery` feeds desirability.
// Future per-structure data (jobs, upkeep, power draw, pollution, …) belongs here.
const STRUCTURES = {
  house: { label: 'House', capacity: 4, greenery: 0, height: 27 },
  tower: { label: 'Tower', capacity: 16, greenery: 0, height: 70 },
  tree: { label: 'Tree', capacity: 0, greenery: 1, walkable: true, height: 26 },
  park: { label: 'Park', capacity: 0, greenery: 3, walkable: true, height: 0 },
  road: { label: 'Road', capacity: 0, greenery: 0, walkable: true, road: true, height: 0 },
};

const TOOLS = [
  { id: 'house', label: 'House', key: '1' },
  { id: 'tower', label: 'Tower', key: '2' },
  { id: 'tree', label: 'Tree', key: '3' },
  { id: 'park', label: 'Park', key: '4' },
  { id: 'road', label: 'Road', key: '5' },
  { id: 'water', label: 'Water', key: '6' },
  { id: 'bulldoze', label: 'Bulldoze', key: '7' },
];

const CAR_COLORS = ['#ff9f8f', '#8fd0bd', '#b49ad1', '#ffd98f', '#9cc4ea', '#f7f3ea', '#f6a9c0'];
const SHIRT_COLORS = ['#ff8f7e', '#7fc4ad', '#a98bd0', '#ffcf6e', '#86b5e6', '#f49ab8', '#ffffff'];
const SKIN_TONES = ['#f6d5bd', '#e8b896', '#c98e6a', '#8d5a3f', '#f1c7a5'];

return { TILE_W, TILE_H, DEFAULT_MAP_SIZE, SAVE_VERSION, DAY_LENGTH_SECONDS, SIM_STEP, PALETTE, BUILDING_VARIANTS, VARIANT_KEYS, STRUCTURES, TOOLS, CAR_COLORS, SHIRT_COLORS, SKIN_TONES };
})();

// ---- state.js ----
const __mod_state = (() => {
// City State: the single source of truth. Tiles own their world state; no drawing or timing logic lives here.

const { STRUCTURES, VARIANT_KEYS, DEFAULT_MAP_SIZE } = __mod_config;
// Neighbour directions with the road-connection bit each one sets: N, E, S, W.
const DIRS = [
  { dx: 0, dy: -1, bit: 1 },
  { dx: 1, dy: 0, bit: 2 },
  { dx: 0, dy: 1, bit: 4 },
  { dx: -1, dy: 0, bit: 8 },
];

function createTile(x, y) {
  return {
    x,
    y,
    terrain: 'grass', // 'grass' | 'water'
    structure: null, // { id, type, residents, variant?, floors?, shape? }
    roadMask: 0, // derived: which neighbours are connected road
    desirability: 0, // derived by the simulation
    factors: {}, // derived: per-factor desirability breakdown
    housingTarget: 0, // derived: how many residents this home can attract right now
  };
}

class CityState {
  constructor(width = DEFAULT_MAP_SIZE, height = DEFAULT_MAP_SIZE) {
    this.width = width;
    this.height = height;
    this.tiles = [];
    this.clock = 0.3;
    this.day = 1;
    this.nextId = 1;
    this.stats = { population: 0, capacity: 0, occupancy: 0, happiness: 0, homes: 0 };
    this.systems = {}; // reserved space for future simulation modules (economy, jobs, utilities…)
    this.dirty = true; // derived data needs recomputing
    this._listeners = new Set();
    this._buildTiles();
  }

  _buildTiles() {
    this.tiles = [];
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) this.tiles.push(createTile(x, y));
    }
  }

  on(fn) {
    this._listeners.add(fn);
    return () => this._listeners.delete(fn);
  }

  emit(type, data = {}) {
    const ev = { type, ...data };
    for (const fn of this._listeners) fn(ev);
  }

  inBounds(x, y) {
    return x >= 0 && y >= 0 && x < this.width && y < this.height;
  }

  getTile(x, y) {
    return this.inBounds(x, y) ? this.tiles[y * this.width + x] : null;
  }

  isRoad(x, y) {
    const t = this.getTile(x, y);
    return !!t && t.structure?.type === 'road';
  }

  roadNeighbors(x, y) {
    const out = [];
    for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) out.push({ x: x + d.dx, y: y + d.dy });
    return out;
  }

  isWalkable(x, y) {
    const t = this.getTile(x, y);
    if (!t || t.terrain !== 'grass') return false;
    return !t.structure || !!STRUCTURES[t.structure.type].walkable;
  }

  homes() {
    return this.tiles.filter((t) => t.structure && STRUCTURES[t.structure.type].capacity > 0);
  }

  canApply(tool, x, y) {
    const t = this.getTile(x, y);
    if (!t) return false;
    if (tool === 'bulldoze') return !!t.structure || t.terrain === 'water';
    if (tool === 'water') return t.terrain !== 'water' || !!t.structure;
    if (!STRUCTURES[tool]) return false;
    return t.structure?.type !== tool;
  }

  // The one entry point for player edits. Returns true when the city changed.
  apply(tool, x, y) {
    if (!this.canApply(tool, x, y)) return false;
    const t = this.getTile(x, y);
    const previous = t.structure;
    if (tool === 'bulldoze') {
      if (t.structure) t.structure = null;
      else t.terrain = 'grass';
      this._changed(x, y);
      this.emit('removed', { x, y, previous, wasWater: !previous });
      return true;
    }
    if (tool === 'water') {
      t.structure = null;
      t.terrain = 'water';
      this._changed(x, y);
      this.emit('watered', { x, y, previous });
      return true;
    }
    t.terrain = 'grass';
    t.structure = this.createStructure(tool);
    this._changed(x, y);
    this.emit('placed', { x, y, structure: t.structure, previous });
    return true;
  }

  createStructure(type, rand = Math.random) {
    const s = { id: this.nextId++, type, residents: 0 };
    if (type === 'house' || type === 'tower') s.variant = VARIANT_KEYS[Math.floor(rand() * VARIANT_KEYS.length)];
    if (type === 'tower') s.floors = 4 + Math.floor(rand() * 3);
    if (type === 'tree') s.shape = Math.floor(rand() * 4);
    return s;
  }

  _changed(x, y) {
    this.dirty = true;
    this.updateRoadMask(x, y);
    for (const d of DIRS) this.updateRoadMask(x + d.dx, y + d.dy);
  }

  updateRoadMask(x, y) {
    const t = this.getTile(x, y);
    if (!t) return;
    let m = 0;
    if (t.structure?.type === 'road') for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) m |= d.bit;
    t.roadMask = m;
  }

  refreshAllRoadMasks() {
    for (const t of this.tiles) this.updateRoadMask(t.x, t.y);
  }

  // Wipe every tile but keep time of day.
  reset() {
    this._buildTiles();
    this.dirty = true;
  }

  // Grow or shrink the map, keeping existing tiles anchored at the origin.
  resize(width, height) {
    const old = this;
    const tiles = [];
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) tiles.push(old.getTile(x, y) ?? createTile(x, y));
    }
    this.width = width;
    this.height = height;
    this.tiles = tiles;
    this.refreshAllRoadMasks();
    this.dirty = true;
    this.emit('resized', { width, height });
  }

  toJSON() {
    return {
      width: this.width,
      height: this.height,

  { id: 'pollution', label: 'Pollution', enabled: false, compute: () => 0 },
  { id: 'safety', label: 'Safety', enabled: false, compute: () => 0 },
  { id: 'overcrowding', label: 'Overcrowding', enabled: false, compute: () => 0 },
  { id: 'walkability', label: 'Walkability', enabled: false, compute: () => 0 },

  constructor(city) {

    this.agents = new AgentSystem(city);

  }

      city.day++;

        if (!(m & (1 << i))) continue;
        const p = gridToWorld(...mids[i]);
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(p.x, p.y);
      }
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // Zebra crossing on busy junctions.
    const links = [1, 2, 4, 8].filter((b) => m & b).length;
    if (links >= 3) {
      ctx.fillStyle = litA(PALETTE.marking, 1, L, 0.85);
      for (let k = 0; k < 3; k++) {
        const off = 0.3 + k * 0.2;
        poly(ctx, [
          [x + off - 0.05, y + 0.06],
          [x + off + 0.05, y + 0.06],
          [x + off + 0.05, y + 0.16],
          [x + off - 0.05, y + 0.16],
        ]);
        ctx.fill();
      }
    }
  }

  drawParkGround(ctx, t, L) {
    const { x, y } = t;
    const city = this.city;
    ctx.fillStyle = lit(PALETTE.parkGrass, 1, L);
    tilePoly(ctx, x, y, 0.04);
    ctx.fill();
    // Paths run to the edge where they meet another park or a road.
    const opens = [
      [0, -1],
      [1, 0],
      [0, 1],
      [-1, 0],
    ].map(([dx, dy]) => {
      const n = city.getTile(x + dx, y + dy);
      return !!n && (n.structure?.type === 'park' || n.structure?.type === 'road');
    });
    ctx.fillStyle = lit(PALETTE.path, 1, L);
    const w = 0.07;
    poly(ctx, [
      [x + 0.5 - w, y + (opens[0] ? 0 : 0.2)],
      [x + 0.5 + w, y + (opens[0] ? 0 : 0.2)],
      [x + 0.5 + w, y + (opens[2] ? 1 : 0.8)],
      [x + 0.5 - w, y + (opens[2] ? 1 : 0.8)],
    ]);
    ctx.fill();
    poly(ctx, [
      [x + (opens[3] ? 0 : 0.2), y + 0.5 - w],
      [x + (opens[1] ? 1 : 0.8), y + 0.5 - w],
      [x + (opens[1] ? 1 : 0.8), y + 0.5 + w],
      [x + (opens[3] ? 0 : 0.2), y + 0.5 + w],
    ]);
    ctx.fill();
    gridEllipse(ctx, x + 0.5, y + 0.5, 0, 0.2);
    ctx.fill();
    for (let i = 0; i < 6; i++) {
      const q = i % 4;
      const gx = x + (q === 0 || q === 3 ? 0.22 : 0.78) + (hash2(x, y, 100 + i) - 0.5) * 0.12;
      const gy = y + (q < 2 ? 0.22 : 0.78) + (hash2(x, y, 110 + i) - 0.5) * 0.12;
      const p = gridToWorld(gx, gy);
      ctx.fillStyle = lit(FLOWER_COLORS[(i + x) % FLOWER_COLORS.length], 1, L);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawHover(ctx, hover) {
    const z = this.camera.zoom;
    ctx.lineWidth = 1.6 / z;
    tilePoly(ctx, hover.x, hover.y, 0.02);
    const warn = hover.tool === 'bulldoze' || !hover.valid;
    ctx.fillStyle = warn ? 'rgba(255,143,128,0.22)' : 'rgba(255,255,255,0.28)';
    ctx.strokeStyle = warn ? 'rgba(255,128,112,0.95)' : 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.stroke();
  }

  // ---- Shadows and ambient occlusion ------------------------------------------

  footprint(t) {
    const s = t.structure;
    if (s.type === 'house') return { inset: 0.2, h: 27 };
    if (s.type === 'tower') return { inset: 0.16, h: 6 + (s.floors || 5) * 11 };
    if (s.type === 'tree') return { inset: 0.32, h: 24, round: true };
    return null;
  }

  drawShadow(ctx, t, L) {
    const f = this.footprint(t);
    if (!f) return;
    const b = this.bounceFor(t.x, t.y);
    if (b.hidden) return;
    const { x, y } = t;
    const c = gridToWorld(x + 0.5, y + 0.5);
    // Contact shadow: always present, anchors the object to the ground.
    const r = (1 - f.inset * 2) * HALF_W * 1.25 * b.sx;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(1, 0.5);
    const g = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r);
    g.addColorStop(0, 'rgba(52,44,96,0.26)');
    g.addColorStop(1, 'rgba(52,44,96,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const sh = L.shadow;
    if (sh.alpha < 0.01) return;
    const h = f.h * b.sy;
    ctx.fillStyle = `rgba(64,58,120,${sh.alpha.toFixed(3)})`;
    if (f.round) {
      gridEllipse(ctx, x + 0.5 + sh.dx * h * 0.75, y + 0.5 + sh.dy * h * 0.75, 0, 0.22);
      ctx.fill();
      return;
    }
    const i0 = f.inset;
    const pts = [];
    for (const [gx, gy] of [
      [x + i0, y + i0],
      [x + 1 - i0, y + i0],
      [x + 1 - i0, y + 1 - i0],
      [x + i0, y + 1 - i0],
    ]) {
      pts.push(gridToWorld(gx, gy));
      pts.push(gridToWorld(gx + sh.dx * h, gy + sh.dy * h));
    }
    const hull = convexHull(pts);
    ctx.beginPath();
    hull.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    ctx.fill();
  }

  // ---- Depth-sorted objects -------------------------------------------------------

  drawItem(ctx, it, L) {
    if (it.kind === 'car') return this.drawCar(ctx, it.c, it.pose, L);
    if (it.kind === 'walker') return this.drawWalker(ctx, it.w, L);
    if (it.kind === 'lamp') return this.drawLamp(ctx, it.lamp, L);
    if (it.kind === 'ghost') {
      ctx.save();
      ctx.globalAlpha = 0.5;
      this.drawStructure(ctx, it.ghost.x, it.ghost.y, it.ghost.structure, L, true);
      ctx.restore();
      return;
    }
    const t = it.t;
    const b = this.bounceFor(t.x, t.y);
    if (b.hidden) return;
    const c = gridToWorld(t.x + 0.5, t.y + 0.5);
    ctx.save();
    if (b.sx !== 1 || b.sy !== 1) {
      ctx.translate(c.x, c.y);
      ctx.scale(b.sx, b.sy);
      ctx.translate(-c.x, -c.y);
    }
    this.drawStructure(ctx, t.x, t.y, t.structure, L, false);
    ctx.restore();
  }

  drawStructure(ctx, x, y, s, L, ghost) {
    switch (s.type) {
      case 'house':
        return this.drawHouse(ctx, x, y, s, L, ghost);
      case 'tower':
        return this.drawTower(ctx, x, y, s, L, ghost);
      case 'tree':
        return this.drawTree(ctx, x + 0.5, y + 0.5, s.shape || 0, L, hash2(x, y, 12) * 6.28, 1);
      case 'park':
        return this.drawParkProps(ctx, x, y, L);
      case 'road':
        if (ghost) {
          ctx.fillStyle = lit(PALETTE.road, 1, L);
          tilePoly(ctx, x, y, 0.04);
          ctx.fill();
        }
        return;
    }
  }

  // A box with soft ambient occlusion toward the ground on both visible faces.
  drawBox(ctx, L, x0, y0, x1, y1, z, h, color, top = true) {
    const ao = Math.min(h, 16);
    const face = (pts, shade, baseY) => {
      const g = ctx.createLinearGradient(0, baseY, 0, baseY - ao);
      g.addColorStop(0, lit(color, shade * 0.8, L));
      g.addColorStop(1, lit(color, shade, L));
      ctx.fillStyle = g;
      poly(ctx, pts);
      ctx.fill();
    };
    face(
      [
        [x0, y1, z],
        [x1, y1, z],
        [x1, y1, z + h],
        [x0, y1, z + h],
      ],
      0.92,
      gridToWorld((x0 + x1) / 2, y1, z).y
    );
    face(
      [
        [x1, y1, z],
        [x1, y0, z],
        [x1, y0, z + h],
        [x1, y1, z + h],
      ],
      0.78,
      gridToWorld(x1, (y0 + y1) / 2, z).y
    );
    if (top) {
      ctx.fillStyle = lit(color, 1.05, L);
      poly(ctx, [
        [x0, y0, z + h],
        [x1, y0, z + h],
        [x1, y1, z + h],
        [x0, y1, z + h],
      ]);
      ctx.fill();
    }
    // Soft highlight on the near edges, like light catching a painted model.
    ctx.strokeStyle = `rgba(255,255,255,${(0.18 + 0.22 * L.daylight).toFixed(3)})`;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    const a = gridToWorld(x0, y1, z + h);
    const b = gridToWorld(x1, y1, z + h);
    const c = gridToWorld(x1, y0, z + h);
    const d = gridToWorld(x1, y1, z);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(d.x, d.y);
    ctx.stroke();
  }

  // Quad on the left (+y) or right (+x) face of a box, in face-relative u (0..1) and height v (px).
  faceQuad(face, x0, y0, x1, y1, u0, u1, v0, v1) {
    if (face === 'L') {
      const gx = (u) => x0 + (x1 - x0) * u;
      return [
        [gx(u0), y1, v0],
        [gx(u1), y1, v0],
        [gx(u1), y1, v1],
        [gx(u0), y1, v1],
      ];
    }
    const gy = (u) => y1 - (y1 - y0) * u;
    return [
      [x1, gy(u0), v0],
      [x1, gy(u1), v0],
      [x1, gy(u1), v1],
      [x1, gy(u0), v1],
    ];
  }

  drawWindow(ctx, L, pts, shade, isLit) {
    poly(ctx, pts);
    if (isLit) {
      ctx.fillStyle = PALETTE.windowLit;
      ctx.fill();
      const p = pts[0];
      const q = pts[2];
      const c = gridToWorld((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (p[2] + q[2]) / 2);
      this.glows.push({ x: c.x, y: c.y, r: 7, a: 0.22, rgb: '255,214,140' });
    } else {
      ctx.fillStyle = lit(PALETTE.glass, shade, L);
      ctx.fill();
    }
  }

  isWindowLit(x, y, i, occupancy, L) {
    if (L.windowLit < 0.02 || occupancy <= 0) return false;
    const chance = L.windowLit * clamp(0.25 + occupancy, 0, 1);
    return hash2(x * 7 + i, y * 13 + (this.city.day % 4), 11) < chance;
  }

  drawHouse(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.peach;
    const x0 = x + 0.2;
    const x1 = x + 0.8;
    const y0 = y + 0.22;
    const y1 = y + 0.78;
    const h = 15;
    const rh = 12;
    const o = 0.05;
    const xm = (x0 + x1) / 2;
    const occ = ghost ? 0 : s.residents / STRUCTURES.house.capacity;
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.wall, false);

    ctx.fillStyle = lit(v.roof, 0.72, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0.6, 0.8, 0, 9));
    ctx.fill();
    this.drawWindow(ctx, L, this.faceQuad('L', x0, y0, x1, y1, 0.16, 0.4, 5, 11), 0.92, this.isWindowLit(x, y, 0, occ, L));
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.16, 0.4, 5, 11), 0.8, this.isWindowLit(x, y, 1, occ, L));
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.6, 0.84, 5, 11), 0.8, this.isWindowLit(x, y, 2, occ, L));

    // Gable end, then the two roof slopes with a small overhang.
    ctx.fillStyle = lit(v.wall, 0.92, L);
    poly(ctx, [
      [x0, y1, h],
      [x1, y1, h],
      [xm, y1, h + rh],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 1.05, L);
    poly(ctx, [
      [x0 - o, y0 - o, h],
      [x0 - o, y1 + o, h],
      [xm, y1 + o, h + rh],
      [xm, y0 - o, h + rh],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 0.82, L);
    poly(ctx, [
      [x1 + o, y0 - o, h],
      [x1 + o, y1 + o, h],
      [xm, y1 + o, h + rh],
      [xm, y0 - o, h + rh],
    ]);
    ctx.fill();
    // Chimney sitting on the right slope.
    const cx0 = xm + 0.08;
    const cx1 = xm + 0.16;
    const base = h + rh * (1 - (cx1 - xm) / (x1 + o - xm));
    this.drawBox(ctx, L, cx0, y0 + 0.06, cx1, y0 + 0.14, base - 1, 6 + rh * 0.2, v.trim);
    // Ridge and eave lines.
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = `rgba(255,255,255,${(0.25 + 0.25 * L.daylight).toFixed(3)})`;
    ctx.beginPath();
    const r0 = gridToWorld(xm, y0 - o, h + rh);
    const r1 = gridToWorld(xm, y1 + o, h + rh);
    ctx.moveTo(r0.x, r0.y);
    ctx.lineTo(r1.x, r1.y);
    ctx.stroke();
    ctx.strokeStyle = lit(v.roof, 0.66, L);
    ctx.beginPath();
    const e0 = gridToWorld(x0 - o, y1 + o, h);
    const e1 = gridToWorld(x1 + o, y1 + o, h);
    ctx.moveTo(e0.x, e0.y);
    ctx.lineTo(r1.x, r1.y);
    ctx.lineTo(e1.x, e1.y);
    ctx.stroke();
  }

  drawTower(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.lavender;
    const floors = s.floors || 5;
    const x0 = x + 0.16;
    const x1 = x + 0.84;
    const y0 = y + 0.16;
    const y1 = y + 0.84;
    const fh = 11;
    const h = 6 + floors * fh;
    const occ = ghost ? 0 : s.residents / STRUCTURES.tower.capacity;
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.wall, false);

    // Plinth band.
    ctx.fillStyle = lit(v.roof, 0.85, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0, 1, 0, 4));
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 0.72, L);
    poly(ctx, this.faceQuad('R', x0, y0, x1, y1, 0, 1, 0, 4));
    ctx.fill();

    let wi = 0;
    for (let f = 0; f < floors; f++) {
      const v0 = 8 + f * fh;
      for (const face of ['L', 'R']) {
        for (let k = 0; k < 3; k++) {
          const u0 = 0.1 + k * 0.3;
          if (f === 0 && face === 'L' && k === 1) {
            ctx.fillStyle = lit(v.roof, 0.72, L);
            poly(ctx, this.faceQuad('L', x0, y0, x1, y1, u0, u0 + 0.2, 0, 9));
            ctx.fill();
            continue;
          }
          const pts = this.faceQuad(face, x0, y0, x1, y1, u0, u0 + 0.2, v0, v0 + 6);
          this.drawWindow(ctx, L, pts, face === 'L' ? 0.92 : 0.8, this.isWindowLit(x, y, wi++, occ, L));
        }
      }
    }

    // Roof deck with a parapet rim and a small rooftop unit.
    ctx.fillStyle = lit(v.trim, 1, L);
    poly(ctx, [
      [x0, y0, h],
      [x1, y0, h],
      [x1, y1, h],
      [x0, y1, h],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.wall, 0.95, L);
    poly(ctx, [
      [x0 + 0.05, y0 + 0.05, h],
      [x1 - 0.05, y0 + 0.05, h],
      [x1 - 0.05, y1 - 0.05, h],
      [x0 + 0.05, y1 - 0.05, h],
    ]);
    ctx.fill();
    this.drawBox(ctx, L, x0 + 0.12, y0 + 0.12, x0 + 0.32, y0 + 0.3, h, 5, v.trim);
    if (floors >= 6) {
      const a = gridToWorld(x1 - 0.15, y1 - 0.15, h);
      ctx.strokeStyle = lit(PALETTE.pole, 1, L);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x, a.y - 12);
      ctx.stroke();
      ctx.fillStyle = L.daylight < 0.5 && Math.sin(this.time * 3) > 0 ? '#ff8f8f' : lit('#f3a5a5', 1, L);
      ctx.beginPath();
      ctx.arc(a.x, a.y - 12, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawTree(ctx, gx, gy, shape, L, phase, scale) {
    const p = gridToWorld(gx, gy);
    const sway = this.reduceMotion ? 0 : Math.sin(this.time * 1.2 + phase) * 0.7;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);
    ctx.fillStyle = lit(PALETTE.trunk, 0.9, L);
    ctx.beginPath();
    ctx.roundRect(-1.6, -9, 3.2, 9.5, 1.2);
    ctx.fill();
    const blob = (cx, cy, r, color, shade) => {
      ctx.fillStyle = lit(color, shade, L);
      ctx.beginPath();
      ctx.arc(cx + sway, cy, r, 0, Math.PI * 2);
      ctx.fill();
    };
    if (shape === 1) {
      // Pine: stacked tiers, darker on the shaded right side.
      for (let i = 0; i < 3; i++) {
        const base = -6 - i * 7;
        const w = 9 - i * 2;
        const s = sway * (0.5 + i * 0.25);
        ctx.fillStyle = lit(PALETTE.leafDeep, 1, L);
        ctx.beginPath();
        ctx.moveTo(-w + s * 0.5, base);
        ctx.lineTo(w + s * 0.5, base);
        ctx.lineTo(s, base - 11);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = lit(PALETTE.leaf, 1, L);
        ctx.beginPath();
        ctx.moveTo(-w + s * 0.5, base);
        ctx.lineTo(s * 0.7, base);
        ctx.lineTo(s, base - 11);
        ctx.closePath();
        ctx.fill();
      }
    } else if (shape === 2) {
      ctx.fillStyle = lit(PALETTE.leafDeep, 1, L);
      ctx.beginPath();
      ctx.ellipse(sway + 0.8, -17, 7, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = lit(PALETTE.leaf, 1, L);
      ctx.beginPath();
      ctx.ellipse(sway - 0.6, -18, 5.8, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      blob(-2.5, -22, 2.6, PALETTE.leafLight, 1);
    } else {
      const blossom = shape === 3;
      const deep = blossom ? '#e9aab6' : PALETTE.leafDeep;
      const mid = blossom ? PALETTE.blossom : PALETTE.leaf;
      const light = blossom ? PALETTE.blossomLight : PALETTE.leafLight;
      blob(1, -15, 9, deep, 1);
      blob(-4, -16, 6.5, mid, 1);
      blob(3, -20, 6.5, mid, 1);
      blob(-1, -22, 6, mid, 1.02);
      blob(-3.2, -22.5, 3, light, 1);
    }
    ctx.restore();
  }

  drawParkProps(ctx, x, y, L) {
    this.drawTree(ctx, x + 0.2, y + 0.8, 2, L, hash2(x, y, 13) * 6, 0.62);
    // Fountain.
    const c = gridToWorld(x + 0.5, y + 0.5);
    ctx.fillStyle = lit(PALETTE.stone, 0.82, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.stone, 1, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y - 2.5, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.water, 1.04, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y - 2.7, 7.6, 3.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.stone, 0.95, L);
    ctx.fillRect(c.x - 1, c.y - 8, 2, 6);
    ctx.fillStyle = litA('#ffffff', 1, L, 0.85);
    for (let i = 0; i < 4; i++) {
      const ph = (this.time * 0.9 + i / 4) % 1;
      const side = i % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.arc(c.x + side * ph * 6, c.y - 8 - Math.sin(ph * Math.PI) * 5 + ph * 4, 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    this.drawTree(ctx, x + 0.8, y + 0.2, 0, L, hash2(x, y, 14) * 6, 0.55);
    // Bench.
    const b = gridToWorld(x + 0.78, y + 0.66);
    ctx.fillStyle = lit(PALETTE.trunk, 0.95, L);
    ctx.beginPath();
    ctx.moveTo(b.x - 5, b.y - 3);
    ctx.lineTo(b.x + 2, b.y - 6.5);
    ctx.lineTo(b.x + 2, b.y - 4.5);
    ctx.lineTo(b.x - 5, b.y - 1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.trunk, 0.7, L);
    ctx.fillRect(b.x - 4.5, b.y - 1.5, 1, 2);
    ctx.fillRect(b.x + 1, b.y - 5, 1, 2);
  }

  // Street lamps sit on a sidewalk edge of some road tiles; four-way junctions stay clear.
  lampSpot(t) {
    if (hash2(t.x, t.y, 7) > 0.5) return null;
    for (const i of [3, 0, 1, 2]) {
      if (t.roadMask & (1 << i)) continue;
      const e = EDGES[i];
      return {
        gx: t.x + (e.a[0] + e.b[0]) / 2 + e.n[0] * 0.08,
        gy: t.y + (e.a[1] + e.b[1]) / 2 + e.n[1] * 0.08,
      };
    }
    return null;
  }

  drawLamp(ctx, lamp, L) {
    const base = gridToWorld(lamp.gx, lamp.gy);
    const top = base.y - 20;

    ctx.lineCap = 'round';

    ctx.fillStyle = on ? PALETTE.lampOn : lit(PALETTE.lampOff, 1, L);

    if (c.alpha <= 0) return;

    const ey = alongX ? hw : hl;

    const oy = -pose.dy * back;

      [gx + cx + ox, gy - cy + oy, 9.2],
      [gx + cx + ox, gy + cy + oy, 9.2],
      [gx - cx + ox, gy + cy + oy, 9.2],
    ]);
    ctx.fill();
    ctx.restore();
    if (L.lamps > 0.1) {
      const f = gridToWorld(gx + pose.dx * (hl + 0.08), gy + pose.dy * (hl + 0.08), 3);
      this.glows.push({ x: f.x, y: f.y, r: 12, a: 0.5 * L.lamps * c.alpha, rgb: '255,244,200' });

    ctx.fillStyle = 'rgba(52,44,96,0.22)';

    ctx.fillStyle = lit(w.skin, 1, L);

  // ---- Particles and light ----------------------------------------------------------

  drawParticles(ctx, dt, L) {
    const keep = [];
    for (const p of this.particles) {

      if (p.age >= p.life) continue;
      keep.push(p);
      if (p.age < 0) continue;
      const t = p.age / p.life;
      if (p.kind === 'dust') {
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        ctx.fill();

      grad.addColorStop(0, `rgba(${g.rgb},${g.a.toFixed(3)})`);
      grad.addColorStop(1, `rgba(${g.rgb},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(-g.r, -g.r, g.r * 2, g.r * 2);
      ctx.restore();
    }
    ctx.restore();
  }
}

return { Renderer };
})();

// ---- camera.js ----
const __mod_camera = (() => {
// Camera: smooth pan and zoom. Holds a target the view eases toward; input moves the target.

const { clamp } = __mod_utils;
class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.zoom = 1;
    this.tx = 0;
    this.ty = 0;
    this.tzoom = 1;
    this.minZoom = 0.4;
    this.maxZoom = 3.5;
    this.viewW = 1;
    this.viewH = 1;
    this.bounds = null;
    this.smooth = true;
  }

  setViewport(w, h) {
    this.viewW = w;
    this.viewH = h;
  }

  setBounds(b) {
    this.bounds = b;
    this.clampTarget();
  }

  update(dt) {
    const k = this.smooth ? 1 - Math.exp(-dt * 12) : 1;
    this.x += (this.tx - this.x) * k;
    this.y += (this.ty - this.y) * k;
    this.zoom = Math.exp(Math.log(this.zoom) + (Math.log(this.tzoom) - Math.log(this.zoom)) * k);
  }

  screenToWorld(sx, sy) {
    return {
      x: (sx - this.viewW / 2) / this.zoom + this.x,
      y: (sy - this.viewH / 2) / this.zoom + this.y,
    };
  }

  // Dragging moves the view exactly with the finger; the target follows so nothing snaps back.
  panBy(dx, dy) {
    this.x -= dx / this.zoom;
    this.y -= dy / this.zoom;
    this.tx = this.x;
    this.ty = this.y;
    this.clampTarget();
  }

  fling(vx, vy) {
    this.tx -= (vx * 0.22) / this.zoom;
    this.ty -= (vy * 0.22) / this.zoom;
    this.clampTarget();
  }

  zoomAt(factor, sx, sy, immediate = false) {
    const nz = clamp(this.tzoom * factor, this.minZoom, this.maxZoom);
    const ox = sx - this.viewW / 2;
    const oy = sy - this.viewH / 2;
    const wx = ox / this.tzoom + this.tx;
    const wy = oy / this.tzoom + this.ty;
    this.tzoom = nz;
    this.tx = wx - ox / nz;
    this.ty = wy - oy / nz;
    this.clampTarget();
    if (immediate) {
      this.x = this.tx;
      this.y = this.ty;
      this.zoom = this.tzoom;
    }
  }

  // Frame the whole board inside the area left free by the interface.
  fit(insets = { top: 0, right: 0, bottom: 0, left: 0 }, immediate = false) {
    const b = this.bounds;
    if (!b) return;
    const availW = Math.max(120, this.viewW - insets.left - insets.right);
    const availH = Math.max(120, this.viewH - insets.top - insets.bottom);
    const z = clamp(Math.min(availW / (b.right - b.left), availH / (b.bottom - b.top)) * 0.94, 0.3, 2.2);
    this.minZoom = Math.min(0.4, z * 0.7);
    this.tzoom = z;
    this.tx = (b.left + b.right) / 2 - (insets.left - insets.right) / 2 / z;
    this.ty = (b.top + b.bottom) / 2 - (insets.top - insets.bottom) / 2 / z;
    if (immediate) {
      this.x = this.tx;
      this.y = this.ty;
      this.zoom = z;
    }
  }

  clampTarget() {
    const b = this.bounds;
    if (!b) return;
    this.tx = clamp(this.tx, b.left, b.right);
    this.ty = clamp(this.ty, b.top, b.bottom);
    this.x = clamp(this.x, b.left - 200, b.right + 200);
    this.y = clamp(this.y, b.top - 200, b.bottom + 200);
  }
}

return { Camera };
})();

// ---- input.js ----
const __mod_input = (() => {
// Input: turns mouse, touch and pen gestures into camera moves and tile actions.
// Tap/click builds, right-click or long-press bulldozes, drag pans, wheel or pinch zooms.

const LONG_PRESS_MS = 480;

class InputController {
  constructor(canvas, camera, handlers) {
    this.canvas = canvas;
    this.camera = camera;
    this.handlers = handlers; // { onTap, onBulldoze, onHover, onLongPressStart }
    this.pointers = new Map();
    this.gesture = null;
    this.longTimer = 0;

    canvas.addEventListener('pointerdown', (e) => this.onDown(e));
    canvas.addEventListener('pointermove', (e) => this.onMove(e));
    canvas.addEventListener('pointerup', (e) => this.onUp(e));
    canvas.addEventListener('pointercancel', (e) => this.onUp(e, true));
    canvas.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') this.handlers.onHover(null);
    });
    canvas.addEventListener('wheel', (e) => this.onWheel(e), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  local(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  onDown(e) {
    const p = this.local(e);
    try {
      this.canvas.setPointerCapture(e.pointerId);
    } catch {
      /* capture is a nicety */
    }
    this.pointers.set(e.pointerId, { x: p.x, y: p.y });
    if (this.pointers.size === 1) {
      this.gesture = {
        button: e.button,
        type: e.pointerType,
        startX: p.x,
        startY: p.y,
        moved: false,
        pinched: false,
        longPressed: false,
        vx: 0,
        vy: 0,
        lastT: performance.now(),
      };
      if (e.pointerType !== 'mouse') {
        clearTimeout(this.longTimer);
        this.longTimer = setTimeout(() => {
          const g = this.gesture;
          if (g && !g.moved && !g.pinched && this.pointers.size === 1) {
            g.longPressed = true;
            navigator.vibrate?.(12);
            this.handlers.onBulldoze(g.startX, g.startY);
          }
        }, LONG_PRESS_MS);
      }
    } else if (this.pointers.size === 2 && this.gesture) {
      clearTimeout(this.longTimer);
      this.gesture.pinched = true;
      this.gesture.moved = true;
      this.pinch = this.pinchState();
    }
  }

  pinchState() {
    const [a, b] = [...this.pointers.values()];
    return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }

  onMove(e) {
    const p = this.local(e);
    const ptr = this.pointers.get(e.pointerId);
    if (!ptr) {
      if (e.pointerType === 'mouse') this.handlers.onHover(p.x, p.y);
      return;
    }
    const dx = p.x - ptr.x;
    const dy = p.y - ptr.y;
    ptr.x = p.x;
    ptr.y = p.y;
    const g = this.gesture;
    if (!g) return;

    if (this.pointers.size === 1 && !g.pinched) {
      const threshold = g.type === 'mouse' ? 5 : 10;
      if (!g.moved && Math.hypot(p.x - g.startX, p.y - g.startY) > threshold) {
        g.moved = true;
        clearTimeout(this.longTimer);
      }
      if (g.moved && !g.longPressed) {
        this.camera.panBy(dx, dy);
        const now = performance.now();
        const dtm = Math.max(1, now - g.lastT) / 1000;
        g.vx = g.vx * 0.6 + (dx / dtm) * 0.4;
        g.vy = g.vy * 0.6 + (dy / dtm) * 0.4;
        g.lastT = now;
      }
      if (e.pointerType === 'mouse') this.handlers.onHover(g.moved ? null : p.x, p.y);
    } else if (this.pointers.size === 2 && this.pinch) {
      const next = this.pinchState();
      this.camera.zoomAt(next.dist / this.pinch.dist, next.mx, next.my, true);
      this.camera.panBy(next.mx - this.pinch.mx, next.my - this.pinch.my);
      this.pinch = next;
    }
  }

  onUp(e, cancelled = false) {
    const g = this.gesture;
    const p = this.local(e);
    this.pointers.delete(e.pointerId);
    clearTimeout(this.longTimer);
    if (this.pointers.size === 1) {
      this.pinch = null; // lifting one finger of a pinch never counts as a tap
      return;
    }
    if (this.pointers.size > 0 || !g) return;
    this.gesture = null;
    if (cancelled) return;
    if (!g.moved && !g.longPressed && !g.pinched) {
      if (g.button === 2) this.handlers.onBulldoze(p.x, p.y);
      else if (g.button === 0) this.handlers.onTap(p.x, p.y);
    } else if (g.moved && !g.pinched && performance.now() - g.lastT < 80) {
      this.camera.fling(g.vx, g.vy);
    }
  }

  onWheel(e) {
    e.preventDefault();
    const p = this.local(e);
    const scale = e.deltaMode === 1 ? 0.05 : e.ctrlKey ? 0.01 : 0.0015;
    this.camera.zoomAt(Math.exp(-e.deltaY * scale), p.x, p.y);
  }
}

return { InputController };
})();

// ---- persistence.js ----
const __mod_persistence = (() => {
// Persistence: versioned saves in localStorage. Add a migration whenever SAVE_VERSION goes up.

const { SAVE_VERSION } = __mod_config;
const { CityState } = __mod_state;
const KEY = 'pocket-metropolis:save';

// MIGRATIONS[n] upgrades a save from version n to n + 1.
const MIGRATIONS = {
  // 1: (save) => { save.city.systems.economy = { funds: 1000 }; return save; },
};

function migrate(save) {
  let v = save.version | 0;
  if (v < 1 || v > SAVE_VERSION) throw new Error(`Unsupported save version ${save.version}`);
  while (v < SAVE_VERSION) {
    save = MIGRATIONS[v](save);
    v++;
    save.version = v;
  }
  return save;
}

function saveCity(city) {
  try {
    const save = { version: SAVE_VERSION, savedAt: Date.now(), city: city.toJSON() };
    localStorage.setItem(KEY, JSON.stringify(save));
    return true;
  } catch {
    return false;
  }
}

function loadCity() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return CityState.fromJSON(migrate(JSON.parse(raw)).city);
  } catch {
    return null;
  }
}

// Saves shortly after each edit, every so often while the city lives, and when the page is hidden.
class AutoSaver {
  constructor(city, { delayMs = 800, intervalS = 15 } = {}) {
    this.city = city;
    this.delayMs = delayMs;
    this.intervalS = intervalS;
    this.pending = -1;
    this.since = 0;
    city.on((ev) => {
      if (ev.type === 'placed' || ev.type === 'removed' || ev.type === 'watered' || ev.type === 'reset') {
        this.pending = this.delayMs;
      }
    });
    const flush = () => this.flush();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
    });
    window.addEventListener('pagehide', flush);
  }

  tick(dt) {
    this.since += dt;
    if (this.pending >= 0) {
      this.pending -= dt * 1000;
      if (this.pending < 0) this.flush();
    }
    if (this.since > this.intervalS) this.flush();
  }

  flush() {
    saveCity(this.city);
    this.since = 0;
    this.pending = -1;
  }
}

return { MIGRATIONS, saveCity, loadCity, AutoSaver };
})();

// ---- generator.js ----
const __mod_generator = (() => {
// Random Town: lays out a small, tidy starter city using the same state API the player uses.

const { STRUCTURES } = __mod_config;
const { DIRS } = __mod_state;
const { mulberry32 } = __mod_utils;
function generateTown(city, seed = (Math.random() * 2 ** 32) >>> 0) {
  const rand = mulberry32(seed);
  const W = city.width;
  const H = city.height;
  const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
  city.reset();

  const tile = (x, y) => city.getTile(x, y);
  const place = (x, y, type) => {
    const t = tile(x, y);
    if (!t) return;
    t.terrain = 'grass';
    t.structure = city.createStructure(type, rand);
  };
  const isEmpty = (x, y) => {
    const t = tile(x, y);
    return !!t && t.terrain === 'grass' && !t.structure;
  };

  // Roads: one avenue in each direction plus a side street or two.
  const ax = ri(4, W - 5);
  const ay = ri(4, H - 5);
  for (let i = 0; i < W; i++) place(i, ay, 'road');
  for (let i = 0; i < H; i++) place(ax, i, 'road');
  if (rand() < 0.75) {
    const sy = ay + (ay > H / 2 ? -ri(3, 4) : ri(3, 4));
    const from = ri(0, 2);
    const to = W - 1 - ri(0, 3);
    for (let x = from; x <= to; x++) place(x, sy, 'road');
  }
  if (rand() < 0.5) {
    const sx = ax + (ax > W / 2 ? -ri(3, 4) : ri(3, 4));
    const from = ri(1, 3);
    const to = H - 1 - ri(0, 2);
    for (let y = from; y <= to; y++) place(sx, y, 'road');
  }

  // A pond tucked into the quietest corner.
  const corners = [
    [1, 1],
    [W - 2, 1],
    [1, H - 2],
    [W - 2, H - 2],
  ];
  const [cx, cy] = corners.reduce((best, c) => {
    const d = (p) => Math.abs(p[0] - ax) + Math.abs(p[1] - ay);
    return d(c) > d(best) ? c : best;
  });
  const radius = 1.5 + rand() * 1.1;
  for (const t of city.tiles) {
    if (t.structure) continue;
    const d = Math.hypot(t.x - cx, t.y - cy) + (rand() - 0.5) * 0.9;
    if (d < radius) t.terrain = 'water';
  }

  // Homes line the streets; towers cluster around the main junction.
  const nearRoad = (x, y) => DIRS.some((d) => city.isRoad(x + d.dx, y + d.dy));
  for (const t of city.tiles) {
    if (!isEmpty(t.x, t.y) || !nearRoad(t.x, t.y)) continue;
    const toCentre = Math.abs(t.x - ax) + Math.abs(t.y - ay);
    if (toCentre <= 3 && rand() < 0.5) place(t.x, t.y, 'tower');
    else if (rand() < 0.72) place(t.x, t.y, 'house');
  }

  // Parks where people live.
  const homesAround = (x, y) =>
    city.tiles.filter((n) => n.structure && STRUCTURES[n.structure.type].capacity > 0 && Math.abs(n.x - x) <= 2 && Math.abs(n.y - y) <= 2)
      .length;
  const parkSpots = city.tiles
    .filter((t) => isEmpty(t.x, t.y))
    .map((t) => ({ t, score: homesAround(t.x, t.y) + rand() * 2 }))
    .sort((a, b) => b.score - a.score);
  const parks = ri(2, 3);
  for (let i = 0; i < Math.min(parks, parkSpots.length); i++) place(parkSpots[i].t.x, parkSpots[i].t.y, 'park');

  // Trees along the water, the map edge and in leftover gaps.
  for (const t of city.tiles) {
    if (!isEmpty(t.x, t.y)) continue;
    const byWater = DIRS.some((d) => tile(t.x + d.dx, t.y + d.dy)?.terrain === 'water');
    const edge = t.x === 0 || t.y === 0 || t.x === W - 1 || t.y === H - 1;
    if (rand() < 0.3 + (byWater ? 0.3 : 0) + (edge ? 0.15 : 0)) place(t.x, t.y, 'tree');
  }

  // Some people already live here.
  for (const h of city.homes()) {
    h.structure.residents = Math.floor(STRUCTURES[h.structure.type].capacity * (0.25 + rand() * 0.35));
  }

  city.refreshAllRoadMasks();
  city.dirty = true;
  city.emit('reset', { seed });
}

return { generateTown };
})();

  tree: svg('<circle cx="12" cy="9.5" r="6"/><path d="M12 15.5V21M9 21h6"/>'),
  park: svg('<path d="M4 13.5h16M5.5 13.5v5M18.5 13.5v5"/><path d="M4.5 9.5h15"/><path d="M7 9.5V6.5M17 9.5V6.5"/>'),
  road: svg('<path d="M8.5 3 5 21M15.5 3 19 21"/><path d="M12 4v2.5M12 10.5V13M12 17v3"/>'),
  water: svg('<path d="M12 3.5c3 4 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6 5.5-10Z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>'),
  bulldoze: svg(
    '<rect x="2.5" y="10.5" width="10" height="5" rx="1.2"/><path d="M5 10.5V7h4.5l1.5 3.5"/><path d="M12.5 13h3.5"/><path d="M17 8.5c1.7 2.6 1.7 6.4 0 9h3.5"/><rect x="2.5" y="17" width="10" height="3.5" rx="1.75"/>'
  ),
};

const MOUTHS = {
  happy: 'M8.5 14c1.9 2.2 5.1 2.2 7 0',
  okay: 'M9 15h6',
  sad: 'M8.5 16.5c1.9-2.2 5.1-2.2 7 0',
};

class Interface {
  constructor({ onTool, onRandom, onFit }) {
    this.toolbar = document.getElementById('toolbar');
    this.popEl = document.getElementById('stat-pop');
    this.capEl = document.getElementById('stat-cap');
    this.happyEl = document.getElementById('stat-happy');
    this.moodEl = document.getElementById('mood-mouth');
    this.meterEl = document.getElementById('happy-meter');
    this.clockEl = document.getElementById('stat-clock');
    this.toastEl = document.getElementById('toast');
    this.onTool = onTool;
    this.tool = 'house';
    this._last = {};

    for (const t of TOOLS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tool';
      b.id = `tool-${t.id}`;
      b.dataset.tool = t.id;
      b.title = `${t.label} (${t.key})`;
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = `<span class="tool-icon">${ICONS[t.id]}</span><span class="tool-label">${t.label}</span>`;
      b.addEventListener('click', () => this.setTool(t.id));
      this.toolbar.appendChild(b);
    }
    document.getElementById('btn-random').addEventListener('click', onRandom);
    document.getElementById('btn-fit').addEventListener('click', onFit);
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const t = TOOLS.find((tool) => tool.key === e.key);
      if (t) this.setTool(t.id);
    });
    this.setTool(this.tool);
  }

  setTool(id) {
    this.tool = id;
    for (const b of this.toolbar.querySelectorAll('.tool')) {
      b.setAttribute('aria-pressed', String(b.dataset.tool === id));
    }
    this.onTool(id);
  }

  update(city) {
    const s = city.stats;
    const set = (key, el, value, prop = 'textContent') => {
      if (this._last[key] === value) return;
      this._last[key] = value;
      if (prop === 'd') el.setAttribute('d', value);
      else el[prop] = value;
    };
    set('pop', this.popEl, s.population.toLocaleString());
    set('cap', this.capEl, `/${s.capacity.toLocaleString()}`);
    set('happy', this.happyEl, s.homes ? `${s.happiness}%` : '–');
    set('mood', this.moodEl, MOUTHS[s.happiness >= 60 ? 'happy' : s.happiness >= 40 ? 'okay' : 'sad'], 'd');
    if (this._last.meterW !== s.happiness) {
      this._last.meterW = s.happiness;
      this.meterEl.style.width = `${s.homes ? s.happiness : 0}%`;
    }
    set('clock', this.clockEl, `Day ${city.day} · ${formatClock(city.clock)}`);
  }

  toast(message, ms = 2600) {
    this.toastEl.textContent = message;
    this.toastEl.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.toastEl.classList.remove('show'), ms);
  }
}

return { Interface };
})();

// ---- main.js ----
const __mod_main = (() => {
// Wiring: creates each system, connects input to state, and runs the frame loop.

const { DEFAULT_MAP_SIZE, STRUCTURES } = __mod_config;
const { CityState } = __mod_state;
const { Simulation } = __mod_simulation;
const { Renderer } = __mod_renderer;
const { Camera } = __mod_camera;
const { InputController } = __mod_input;
const { AutoSaver, loadCity } = __mod_persistence;
const { generateTown } = __mod_generator;
const { Interface } = __mod_ui;
const { worldToGrid, mapBounds } = __mod_iso;
function start(hotData = {}) {
  const canvas = document.getElementById('city');
  let city = null;
  try {
    if (hotData.city) city = CityState.fromJSON(hotData.city);
  } catch {
    city = null;
  }
  city = city || loadCity();
  const fresh = !city;
  if (!city) city = new CityState(DEFAULT_MAP_SIZE, DEFAULT_MAP_SIZE);

  const camera = new Camera();
  camera.smooth = !window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const sim = new Simulation(city);
  const renderer = new Renderer(canvas, city, camera, sim.agents);
  const saver = new AutoSaver(city);

  let tool = 'house';
  let hover = null; // { x, y } tile under the mouse
  let fitted = false;

  const tileAt = (sx, sy) => {
    const w = camera.screenToWorld(sx, sy);
    const g = worldToGrid(w.x, w.y);
    const x = Math.floor(g.gx);
    const y = Math.floor(g.gy);
    return city.inBounds(x, y) ? { x, y } : null;
  };

  const ui = new Interface({
    onTool: (id) => {
      tool = id;
    },
    onRandom: () => {
      generateTown(city);
      fitView(false);
      ui.toast('A fresh little town, ready for you');
    },
    onFit: () => fitView(false),
  });

  function uiInsets() {
    const narrow = window.innerWidth < 560;
    return { top: narrow ? 96 : 76, bottom: narrow ? 92 : 100, left: narrow ? 4 : 16, right: narrow ? 4 : 16 };
  }

  function fitView(immediate) {
    camera.setBounds(mapBounds(city.width, city.height));
    camera.fit(uiInsets(), immediate);
  }

  function resize() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    renderer.resize(w, h);
    camera.setViewport(w, h);
    camera.setBounds(mapBounds(city.width, city.height));
    if (!fitted || window.innerWidth < 760) {
      fitView(!fitted);
      fitted = true;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  new InputController(canvas, camera, {
    onTap: (sx, sy) => {
      const t = tileAt(sx, sy);
      if (!t) return;
      if (!city.apply(tool, t.x, t.y)) renderer.nudge(t.x, t.y);
    },
    onBulldoze: (sx, sy) => {
      const t = tileAt(sx, sy);
      if (t && !city.apply('bulldoze', t.x, t.y)) renderer.nudge(t.x, t.y);
    },
    onHover: (sx, sy) => {
      hover = sx == null ? null : tileAt(sx, sy);
    },
  });

  if (fresh) {
    generateTown(city);
    const touch = window.matchMedia?.('(pointer: coarse)').matches;
    ui.toast(touch ? 'Tap to build · long-press to bulldoze' : 'Click to build · right-click to bulldoze', 5200);
  } else {
    city.emit('loaded');
    ui.toast('Welcome back to your town', 2400);
  }

  const hot = window.claude?.hot;
  hot?.snapshot?.(() => ({ city: city.toJSON() }));

  function viewState() {
    if (!hover) return {};
    const t = city.getTile(hover.x, hover.y);
    const valid = city.canApply(tool, hover.x, hover.y);
    const ghost =
      valid && STRUCTURES[tool] && !t.structure && t.terrain === 'grass'
        ? { x: hover.x, y: hover.y, structure: { type: tool, variant: 'blush', floors: 5, shape: 0, residents: 0 } }
        : null;
    return { hover: { ...hover, tool, valid }, ghost };
  }

  let last = performance.now();
  let uiTimer = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    sim.update(dt);
    camera.update(dt);
    renderer.render(dt, viewState());
    saver.tick(dt);
    uiTimer -= dt;
    if (uiTimer <= 0) {
      ui.update(city);
      uiTimer = 0.2;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Handy for poking at the simulation from the console.
  window.pocketMetropolis = { city, sim, camera, renderer };
}

const hot = window.claude?.hot;
if (hot?.ready) hot.ready(start);
else start(hot?.data ?? {});

return {  };
})();

})();
</script>
