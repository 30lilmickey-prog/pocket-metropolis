      [W, 0, -SLAB_DEPTH],
      [W, H, -SLAB_DEPTH],
      [0, H, -SLAB_DEPTH],
      [0, H, 0],
    ]);
    ctx.fill();
    ctx.restore();
  }

  // Animated parts of water that can't live in the cache.
  drawWaterMotion(ctx, t, L) {
    if (this.camera.zoom < 0.5) return;
    const { x, y } = t;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 2; i++) {
      const ph = this.time * (0.7 + hash2(x, y, 70 + i) * 0.6) + hash2(x, y, 80 + i) * 6.28;
      const a = (Math.sin(ph) * 0.5 + 0.5) * (L.daylight > 0.3 ? 0.6 : 0.35);
      const p = gridToWorld(x + 0.25 + hash2(x, y, 90 + i) * 0.5, y + 0.25 + hash2(x, y, 95 + i) * 0.5);
      const drift = Math.sin(ph * 0.5) * 2;
      ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(p.x - 4 + drift, p.y);
      ctx.lineTo(p.x + 4 + drift, p.y);
      ctx.stroke();
    }
  }

  drawSlabShadow(ctx) {
    const W = this.city.width;
    const H = this.city.height;
    const D = SLAB_DEPTH;
    for (const [pad, a] of [
      [0.9, 0.05],
      [0.45, 0.07],
    ]) {
      ctx.fillStyle = `rgba(60,48,110,${a})`;
      poly(ctx, [
        [-pad, -pad, -D - 10],
        [W + pad, -pad, -D - 10],
        [W + pad, H + pad, -D - 10],
        [-pad, H + pad, -D - 10],
      ]);
      ctx.fill();
    }
  }

  drawSlab(ctx, L, withShadow = true) {
    const W = this.city.width;
    const H = this.city.height;
    const D = SLAB_DEPTH;
    // Soft drop shadow so the board floats like a diorama.
    if (withShadow) this.drawSlabShadow(ctx);
    const yTop = gridToWorld(W, H).y;
    const left = ctx.createLinearGradient(0, yTop - (W + H) * HALF_H * 0.5, 0, yTop + D);
    left.addColorStop(0, lit(PALETTE.earth, 0.95, L));
    left.addColorStop(1, lit(PALETTE.earthDark, 0.88, L));
    ctx.fillStyle = left;
    poly(ctx, [
      [0, H, 0],
      [W, H, 0],
      [W, H, -D],
      [0, H, -D],
    ]);
    ctx.fill();
    const right = ctx.createLinearGradient(0, yTop - (W + H) * HALF_H * 0.5, 0, yTop + D);
    right.addColorStop(0, lit(PALETTE.earth, 0.8, L));
    right.addColorStop(1, lit(PALETTE.earthDark, 0.72, L));
    ctx.fillStyle = right;
    poly(ctx, [
      [W, H, 0],
      [W, 0, 0],
      [W, 0, -D],
      [W, H, -D],
    ]);
    ctx.fill();
    // Turf lip along the top edge of the slab.
    ctx.fillStyle = lit(PALETTE.grass, 0.78, L);
    poly(ctx, [
      [0, H, 0],
      [W, H, 0],
      [W, H, -4],
      [0, H, -4],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.grass, 0.66, L);
    poly(ctx, [
      [W, H, 0],
      [W, 0, 0],
      [W, 0, -4],
      [W, H, -4],
    ]);
    ctx.fill();
    // Fill the top under the tiles so antialiased seams show grass, not the sky.
    ctx.fillStyle = lit(PALETTE.grass, 0.97, L);
    poly(ctx, [
      [0, 0],
      [W, 0],
      [W, H],
      [0, H],
    ]);
    ctx.fill();
  }

  drawVignette(ctx, L) {
    const r = Math.max(this.w, this.h);
    const g = ctx.createRadialGradient(this.w / 2, this.h / 2, r * 0.3, this.w / 2, this.h / 2, r * 0.78);
    g.addColorStop(0, 'rgba(70,58,120,0)');
    g.addColorStop(1, `rgba(70,58,120,${(0.1 + 0.12 * (1 - L.daylight)).toFixed(3)})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.w, this.h);
  }

  // ---- Ground layer -------------------------------------------------------------

  drawGround(ctx, t, L) {
    const { x, y } = t;
    if (t.terrain === 'water') return this.drawWater(ctx, t, L);
    const s = t.structure;
    if (s?.type === 'road') return this.drawRoad(ctx, t, L);
    ctx.fillStyle = lit(PALETTE.grass, 0.97 + hash2(x, y, 1) * 0.06, L);
    tilePoly(ctx, x, y);
    ctx.fill();
    if (s?.type === 'park') this.drawParkGround(ctx, t, L);
    else if (!s) this.drawMeadow(ctx, t, L);
  }

  drawMeadow(ctx, t, L) {
    const { x, y } = t;
    ctx.strokeStyle = lit(PALETTE.grass, 0.8, L);
    ctx.lineWidth = 0.9;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      if (hash2(x, y, 20 + i) > 0.55) continue;
      const p = gridToWorld(x + 0.15 + hash2(x, y, 30 + i) * 0.7, y + 0.15 + hash2(x, y, 40 + i) * 0.7);
      ctx.beginPath();
      ctx.moveTo(p.x - 2, p.y - 2.5);
      ctx.lineTo(p.x - 0.5, p.y);
      ctx.lineTo(p.x + 0.5, p.y - 3);
      ctx.lineTo(p.x + 1.5, p.y);
      ctx.lineTo(p.x + 3, p.y - 2);
      ctx.stroke();
    }
    if (hash2(x, y, 3) < 0.3) {
      for (let i = 0; i < 4; i++) {
        const p = gridToWorld(x + 0.15 + hash2(x, y, 50 + i) * 0.7, y + 0.15 + hash2(x, y, 60 + i) * 0.7);
        ctx.fillStyle = lit(FLOWER_COLORS[(i + x + y) % FLOWER_COLORS.length], 1, L);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  drawWater(ctx, t, L) {
    const { x, y } = t;
    const city = this.city;
    ctx.fillStyle = lit(PALETTE.water, 1, L);
    tilePoly(ctx, x, y);
    ctx.fill();
    // Slightly deeper centre where the tile is surrounded by water.
    let wet = 0;
    EDGES.forEach((e, i) => {
      const n = city.getTile(x + [0, 1, 0, -1][i], y + [-1, 0, 1, 0][i]);
      if (!n || n.terrain === 'water') wet++;
    });
    if (wet >= 3) {
      ctx.fillStyle = lit(PALETTE.water, 0.93, L);
      gridEllipse(ctx, x + 0.5, y + 0.5, 0, 0.28);
      ctx.fill();
    }
    // Sandy bank and foam on edges that meet land.
    EDGES.forEach((e, i) => {
      const n = city.getTile(x + [0, 1, 0, -1][i], y + [-1, 0, 1, 0][i]);
      if (!n || n.terrain === 'water') return;
      ctx.fillStyle = lit(PALETTE.sand, 1, L);
      poly(ctx, edgeStrip(x, y, e, 0, 0.09));
      ctx.fill();
      ctx.fillStyle = litA('#ffffff', 1, L, 0.55);
      poly(ctx, edgeStrip(x, y, e, 0.09, this._caching ? 0.13 : 0.13 + Math.sin(this.time * 1.6 + x + y) * 0.02));
      ctx.fill();
    });
    // Shimmer.
    if (this._caching || this.camera.zoom < 0.5) return;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 2; i++) {
      const ph = this.time * (0.7 + hash2(x, y, 70 + i) * 0.6) + hash2(x, y, 80 + i) * 6.28;
      const a = (Math.sin(ph) * 0.5 + 0.5) * (L.daylight > 0.3 ? 0.6 : 0.35);
      const p = gridToWorld(x + 0.25 + hash2(x, y, 90 + i) * 0.5, y + 0.25 + hash2(x, y, 95 + i) * 0.5);
      const drift = Math.sin(ph * 0.5) * 2;
      ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(p.x - 4 + drift, p.y);
      ctx.lineTo(p.x + 4 + drift, p.y);
      ctx.stroke();
    }
  }

  drawRoad(ctx, t, L) {
    const { x, y, roadMask: m } = t;
    ctx.fillStyle = lit(PALETTE.road, 0.98 + hash2(x, y, 2) * 0.03, L);
    tilePoly(ctx, x, y);
    ctx.fill();
    EDGES.forEach((e, i) => {
      if (m & (1 << i)) return;
      ctx.fillStyle = lit(PALETTE.sidewalk, 1.02, L);
      poly(ctx, edgeStrip(x, y, e, 0, 0.15));
      ctx.fill();
      ctx.fillStyle = lit(PALETTE.road, 0.86, L);
      poly(ctx, edgeStrip(x, y, e, 0.15, 0.18));
      ctx.fill();
    });
    // Lane markings follow the connections.
    ctx.strokeStyle = lit(PALETTE.marking, 1, L);
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'butt';
    ctx.setLineDash([3.5, 3.5]);
    const c = gridToWorld(x + 0.5, y + 0.5);
    const mids = [
      [x + 0.5, y],
      [x + 1, y + 0.5],
      [x + 0.5, y + 1],
      [x, y + 0.5],
    ];
    ctx.beginPath();
    if (m === 5 || m === 10) {
      const a = gridToWorld(...mids[m === 5 ? 0 : 3]);
      const b = gridToWorld(...mids[m === 5 ? 2 : 1]);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    } else {
      for (let i = 0; i < 4; i++) {
        if (!(m & (1 << i))) continue;
        const p = gridToWorld(...mids[i]);
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(p.x, p.y);
      }
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // Zebra crossing on busy junctions.
    const links = [1, 2, 4, 8].filter((b) => m & b).length;
    if (links >= 3) {
      ctx.fillStyle = litA(PALETTE.marking, 1, L, 0.85);
      for (let k = 0; k < 3; k++) {
        const off = 0.3 + k * 0.2;
        poly(ctx, [
          [x + off - 0.05, y + 0.06],
          [x + off + 0.05, y + 0.06],
          [x + off + 0.05, y + 0.16],
          [x + off - 0.05, y + 0.16],
        ]);
        ctx.fill();
      }
    }
  }

  drawParkGround(ctx, t, L) {
    const { x, y } = t;
    const city = this.city;
    ctx.fillStyle = lit(PALETTE.parkGrass, 1, L);
    tilePoly(ctx, x, y, 0.04);
    ctx.fill();
    // Paths run to the edge where they meet another park or a road.
    const opens = [
      [0, -1],
      [1, 0],
      [0, 1],
      [-1, 0],
    ].map(([dx, dy]) => {
      const n = city.getTile(x + dx, y + dy);
      return !!n && (n.structure?.type === 'park' || n.structure?.type === 'road');
    });
    ctx.fillStyle = lit(PALETTE.path, 1, L);
    const w = 0.07;
    poly(ctx, [
      [x + 0.5 - w, y + (opens[0] ? 0 : 0.2)],
      [x + 0.5 + w, y + (opens[0] ? 0 : 0.2)],
      [x + 0.5 + w, y + (opens[2] ? 1 : 0.8)],
      [x + 0.5 - w, y + (opens[2] ? 1 : 0.8)],
    ]);
    ctx.fill();
    poly(ctx, [
      [x + (opens[3] ? 0 : 0.2), y + 0.5 - w],
      [x + (opens[1] ? 1 : 0.8), y + 0.5 - w],
      [x + (opens[1] ? 1 : 0.8), y + 0.5 + w],
      [x + (opens[3] ? 0 : 0.2), y + 0.5 + w],
    ]);
    ctx.fill();
    gridEllipse(ctx, x + 0.5, y + 0.5, 0, 0.2);
    ctx.fill();
    for (let i = 0; i < 6; i++) {
      const q = i % 4;
      const gx = x + (q === 0 || q === 3 ? 0.22 : 0.78) + (hash2(x, y, 100 + i) - 0.5) * 0.12;
      const gy = y + (q < 2 ? 0.22 : 0.78) + (hash2(x, y, 110 + i) - 0.5) * 0.12;
      const p = gridToWorld(gx, gy);
      ctx.fillStyle = lit(FLOWER_COLORS[(i + x) % FLOWER_COLORS.length], 1, L);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Data views tint the ground so buildings stay readable on top.
  drawOverlay(ctx, t, overlay) {
    let color = null;
    if (overlay === 'desirability') {
      if (t.terrain === 'water' || t.roadMask || t.structure?.type === 'road') return;
      color = rampColor(t.desirability, 0.62);
    } else if (overlay === 'traffic') {
      if (t.structure?.type !== 'road') {
        color = 'rgba(70,60,110,0.28)';
      } else {
        color = t.congestion < 0.02 ? 'rgba(255,255,255,0.35)' : rampColor(1 - t.congestion, 0.8);
      }
    } else if (overlay === 'services') {
      if (t.terrain === 'water') return;
      const c = t.coverage || {};
      const school = c.school || 0;
      const health = c.health || 0;
      if (school < 0.02 && health < 0.02) color = 'rgba(70,60,110,0.22)';
      else {
        // Schools tint lavender, clinics tint mint; both together read as a soft blue-violet.
        const r = Math.round(200 - 60 * health);
        const g = Math.round(180 + 40 * health - 20 * school);
        const b = Math.round(200 + 40 * school);
        color = `rgba(${r},${g},${b},${(0.25 + 0.45 * Math.max(school, health)).toFixed(3)})`;
      }
    }
    if (!color) return;
    ctx.fillStyle = color;
    tilePoly(ctx, t.x, t.y);
    ctx.fill();
  }

  drawSelected(ctx, sel) {
    const z = this.camera.zoom;
    const pulse = 0.6 + 0.4 * Math.sin(this.time * 4);
    ctx.lineWidth = 2.2 / z;
    ctx.setLineDash([5 / z, 4 / z]);
    ctx.lineDashOffset = -this.time * 12;
    ctx.strokeStyle = `rgba(255,255,255,${pulse.toFixed(3)})`;
    tilePoly(ctx, sel.x, sel.y, -0.02);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawHover(ctx, hover) {
    const z = this.camera.zoom;
    ctx.lineWidth = 1.6 / z;
    tilePoly(ctx, hover.x, hover.y, 0.02);
    const warn = hover.tool === 'bulldoze' || (!hover.valid && hover.tool !== 'inspect');
    ctx.fillStyle = warn ? 'rgba(255,143,128,0.22)' : 'rgba(255,255,255,0.28)';
    ctx.strokeStyle = warn ? 'rgba(255,128,112,0.95)' : 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.stroke();
  }

  // ---- Shadows and ambient occlusion ------------------------------------------

  footprint(t) {
    const s = t.structure;
    if (s.type === 'house') return { inset: 0.2, h: 27 };
    if (s.type === 'tower') return { inset: 0.16, h: 6 + (s.floors || 5) * 11 };
    if (s.type === 'tree') return { inset: 0.32, h: 24, round: true };
    if (s.type === 'shop') return { inset: 0.16, h: 22 };
    if (s.type === 'office') return { inset: 0.14, h: 8 + (s.floors || 4) * 12 };
    if (s.type === 'school') return { inset: 0.12, h: 26 };
    if (s.type === 'clinic') return { inset: 0.15, h: 24 };
    return null;
  }

  drawShadow(ctx, t, L) {
    const f = this.footprint(t);
    if (!f) return;
    const b = this.bounceFor(t.x, t.y);
    if (b.hidden) return;
    const { x, y } = t;
    const g = gridToWorld(x + 0.5, y + 0.5);
    // Contact shadow: always present, anchors the object to the ground.
    const r = (1 - f.inset * 2) * HALF_W * 1.25 * b.sx;
    ctx.drawImage(contactSprite(), g.x - r, g.y - r / 2, r * 2, r);

    const sh = L.shadow;
    if (sh.alpha < 0.01) return;
    const h = f.h * b.sy;
    ctx.fillStyle = `rgba(64,58,120,${sh.alpha.toFixed(3)})`;
    if (f.round) {
      gridEllipse(ctx, x + 0.5 + sh.dx * h * 0.75, y + 0.5 + sh.dy * h * 0.75, 0, 0.22);
      ctx.fill();
      return;
    }
    const i0 = f.inset;
    const pts = [];
    for (const [gx, gy] of [
      [x + i0, y + i0],
      [x + 1 - i0, y + i0],
      [x + 1 - i0, y + 1 - i0],
      [x + i0, y + 1 - i0],
    ]) {
      pts.push(gridToWorld(gx, gy));
      pts.push(gridToWorld(gx + sh.dx * h, gy + sh.dy * h));
    }
    const hull = convexHull(pts);
    ctx.beginPath();
    hull.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    ctx.fill();
  }

  // ---- Depth-sorted objects -------------------------------------------------------

  drawItem(ctx, it, L) {
    if (it.kind === 'car') return this.drawCar(ctx, it.c, it.pose, L);
    if (it.kind === 'walker') return this.drawWalker(ctx, it.w, L);
    if (it.kind === 'lamp') return this.drawLamp(ctx, it.lamp, L);
    if (it.kind === 'ghost') {
      ctx.save();
      ctx.globalAlpha = 0.5;
      this.drawStructure(ctx, it.ghost.x, it.ghost.y, it.ghost.structure, L, true);
      ctx.restore();
      return;
    }
    const t = it.t;
    const b = this.bounceFor(t.x, t.y);
    if (b.hidden) return;
    const c = gridToWorld(t.x + 0.5, t.y + 0.5);
    ctx.save();
    if (b.sx !== 1 || b.sy !== 1) {
      ctx.translate(c.x, c.y);
      ctx.scale(b.sx, b.sy);
      ctx.translate(-c.x, -c.y);
    }
    this.drawStructure(ctx, t.x, t.y, t.structure, L, false);
    ctx.restore();
  }

  drawStructure(ctx, x, y, s, L, ghost) {
    switch (s.type) {
      case 'house':
        return this.drawHouse(ctx, x, y, s, L, ghost);
      case 'tower':
        return this.drawTower(ctx, x, y, s, L, ghost);
      case 'shop':
        return this.drawShop(ctx, x, y, s, L, ghost);
      case 'office':
        return this.drawOffice(ctx, x, y, s, L, ghost);
      case 'school':
        return this.drawSchool(ctx, x, y, s, L, ghost);
      case 'clinic':
        return this.drawClinic(ctx, x, y, s, L, ghost);
      case 'tree':
        return this.drawTree(ctx, x + 0.5, y + 0.5, s.shape || 0, L, hash2(x, y, 12) * 6.28, 1);
      case 'park':
        return this.drawParkProps(ctx, x, y, L);
      case 'road':
        if (ghost) {
          ctx.fillStyle = lit(PALETTE.road, 1, L);
          tilePoly(ctx, x, y, 0.04);
          ctx.fill();
        }
        return;
    }
  }

  // A box with soft ambient occlusion toward the ground on both visible faces.
  drawBox(ctx, L, x0, y0, x1, y1, z, h, color, top = true) {
    const ao = Math.min(h, 16);
    const face = (pts, shade, baseY) => {
      const g = ctx.createLinearGradient(0, baseY, 0, baseY - ao);
      g.addColorStop(0, lit(color, shade * 0.8, L));
      g.addColorStop(1, lit(color, shade, L));
      ctx.fillStyle = g;
      poly(ctx, pts);
      ctx.fill();
    };
    face(
      [
        [x0, y1, z],
        [x1, y1, z],
        [x1, y1, z + h],
        [x0, y1, z + h],
      ],
      0.92,
      gridToWorld((x0 + x1) / 2, y1, z).y
    );
    face(
      [
        [x1, y1, z],
        [x1, y0, z],
        [x1, y0, z + h],
        [x1, y1, z + h],
      ],
      0.78,
      gridToWorld(x1, (y0 + y1) / 2, z).y
    );
    if (top) {
      ctx.fillStyle = lit(color, 1.05, L);
      poly(ctx, [
        [x0, y0, z + h],
        [x1, y0, z + h],
        [x1, y1, z + h],
        [x0, y1, z + h],
      ]);
      ctx.fill();
    }
    // Soft highlight on the near edges, like light catching a painted model.
    ctx.strokeStyle = `rgba(255,255,255,${(0.18 + 0.22 * L.daylight).toFixed(3)})`;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    const a = gridToWorld(x0, y1, z + h);
    const b = gridToWorld(x1, y1, z + h);
    const c = gridToWorld(x1, y0, z + h);
    const d = gridToWorld(x1, y1, z);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(d.x, d.y);
    ctx.stroke();
  }

  // Quad on the left (+y) or right (+x) face of a box, in face-relative u (0..1) and height v (px).
  faceQuad(face, x0, y0, x1, y1, u0, u1, v0, v1) {
    if (face === 'L') {
      const gx = (u) => x0 + (x1 - x0) * u;
      return [
        [gx(u0), y1, v0],
        [gx(u1), y1, v0],
        [gx(u1), y1, v1],
        [gx(u0), y1, v1],
      ];
    }
    const gy = (u) => y1 - (y1 - y0) * u;
    return [
      [x1, gy(u0), v0],
      [x1, gy(u1), v0],
      [x1, gy(u1), v1],
      [x1, gy(u0), v1],
    ];
  }

  drawWindow(ctx, L, pts, shade, isLit) {
    poly(ctx, pts);
    if (isLit) {
      ctx.fillStyle = PALETTE.windowLit;
      ctx.fill();
      const p = pts[0];
      const q = pts[2];
      const c = gridToWorld((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (p[2] + q[2]) / 2);
      this.glows.push({ x: c.x, y: c.y, r: 7, a: 0.22, rgb: '255,214,140' });
    } else {
      ctx.fillStyle = lit(PALETTE.glass, shade, L);
      ctx.fill();
    }
  }

  isWindowLit(x, y, i, occupancy, L) {
    if (L.windowLit < 0.02 || occupancy <= 0) return false;
    const chance = L.windowLit * clamp(0.25 + occupancy, 0, 1);
    return hash2(x * 7 + i, y * 13 + (this.city.day % 4), 11) < chance;
  }

  drawHouse(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.peach;
    const x0 = x + 0.2;
    const x1 = x + 0.8;
    const y0 = y + 0.22;
    const y1 = y + 0.78;
    const h = 15;
    const rh = 12;
    const o = 0.05;
    const xm = (x0 + x1) / 2;
    const occ = ghost ? 0 : s.residents / STRUCTURES.house.capacity;
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.wall, false);

    ctx.fillStyle = lit(v.roof, 0.72, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0.6, 0.8, 0, 9));
    ctx.fill();
    this.drawWindow(ctx, L, this.faceQuad('L', x0, y0, x1, y1, 0.16, 0.4, 5, 11), 0.92, this.isWindowLit(x, y, 0, occ, L));
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.16, 0.4, 5, 11), 0.8, this.isWindowLit(x, y, 1, occ, L));
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.6, 0.84, 5, 11), 0.8, this.isWindowLit(x, y, 2, occ, L));

    // Gable end, then the two roof slopes with a small overhang.
    ctx.fillStyle = lit(v.wall, 0.92, L);
    poly(ctx, [
      [x0, y1, h],
      [x1, y1, h],
      [xm, y1, h + rh],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 1.05, L);
    poly(ctx, [
      [x0 - o, y0 - o, h],
      [x0 - o, y1 + o, h],
      [xm, y1 + o, h + rh],
      [xm, y0 - o, h + rh],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 0.82, L);
    poly(ctx, [
      [x1 + o, y0 - o, h],
      [x1 + o, y1 + o, h],
      [xm, y1 + o, h + rh],
      [xm, y0 - o, h + rh],
    ]);
    ctx.fill();
    // Chimney sitting on the right slope.
    const cx0 = xm + 0.08;
    const cx1 = xm + 0.16;
    const base = h + rh * (1 - (cx1 - xm) / (x1 + o - xm));
    this.drawBox(ctx, L, cx0, y0 + 0.06, cx1, y0 + 0.14, base - 1, 6 + rh * 0.2, v.trim);
    // Ridge and eave lines.
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = `rgba(255,255,255,${(0.25 + 0.25 * L.daylight).toFixed(3)})`;
    ctx.beginPath();
    const r0 = gridToWorld(xm, y0 - o, h + rh);
    const r1 = gridToWorld(xm, y1 + o, h + rh);
    ctx.moveTo(r0.x, r0.y);
    ctx.lineTo(r1.x, r1.y);
    ctx.stroke();
    ctx.strokeStyle = lit(v.roof, 0.66, L);
    ctx.beginPath();
    const e0 = gridToWorld(x0 - o, y1 + o, h);
    const e1 = gridToWorld(x1 + o, y1 + o, h);
    ctx.moveTo(e0.x, e0.y);
    ctx.lineTo(r1.x, r1.y);
    ctx.lineTo(e1.x, e1.y);
    ctx.stroke();
  }

  drawTower(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.lavender;
    const floors = s.floors || 5;
    const x0 = x + 0.16;
    const x1 = x + 0.84;
    const y0 = y + 0.16;
    const y1 = y + 0.84;
    const fh = 11;
    const h = 6 + floors * fh;
    const occ = ghost ? 0 : s.residents / STRUCTURES.tower.capacity;
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.wall, false);

    // Plinth band.
    ctx.fillStyle = lit(v.roof, 0.85, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0, 1, 0, 4));
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 0.72, L);
    poly(ctx, this.faceQuad('R', x0, y0, x1, y1, 0, 1, 0, 4));
    ctx.fill();

    let wi = 0;
    for (let f = 0; f < floors; f++) {
      const v0 = 8 + f * fh;
      for (const face of ['L', 'R']) {
        for (let k = 0; k < 3; k++) {
          const u0 = 0.1 + k * 0.3;
          if (f === 0 && face === 'L' && k === 1) {
            ctx.fillStyle = lit(v.roof, 0.72, L);
            poly(ctx, this.faceQuad('L', x0, y0, x1, y1, u0, u0 + 0.2, 0, 9));
            ctx.fill();
            continue;
          }
          const pts = this.faceQuad(face, x0, y0, x1, y1, u0, u0 + 0.2, v0, v0 + 6);
          this.drawWindow(ctx, L, pts, face === 'L' ? 0.92 : 0.8, this.isWindowLit(x, y, wi++, occ, L));
        }
      }
    }

    // Roof deck with a parapet rim and a small rooftop unit.
    ctx.fillStyle = lit(v.trim, 1, L);
    poly(ctx, [
      [x0, y0, h],
      [x1, y0, h],
      [x1, y1, h],
      [x0, y1, h],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.wall, 0.95, L);
    poly(ctx, [
      [x0 + 0.05, y0 + 0.05, h],
      [x1 - 0.05, y0 + 0.05, h],
      [x1 - 0.05, y1 - 0.05, h],
      [x0 + 0.05, y1 - 0.05, h],
    ]);
    ctx.fill();
    this.drawBox(ctx, L, x0 + 0.12, y0 + 0.12, x0 + 0.32, y0 + 0.3, h, 5, v.trim);
    if (floors >= 6) {
      const a = gridToWorld(x1 - 0.15, y1 - 0.15, h);
      ctx.strokeStyle = lit(PALETTE.pole, 1, L);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x, a.y - 12);
      ctx.stroke();
      ctx.fillStyle = L.daylight < 0.5 && Math.sin(this.time * 3) > 0 ? '#ff8f8f' : lit('#f3a5a5', 1, L);
      ctx.beginPath();
      ctx.arc(a.x, a.y - 12, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  workFill(x, y, s, ghost) {
    if (ghost) return 0;
    const t = this.city.getTile(x, y);
    return t ? t.workersFilled / STRUCTURES[s.type].jobs : 0;
  }

  // Shops stay lit through the evening and close late at night.
  shopOpen(L) {
    const c = L.clock;
    return c > 0.29 && c < 0.92;
  }

  drawShop(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.mint;
    const x0 = x + 0.16;
    const x1 = x + 0.84;
    const y0 = y + 0.2;
    const y1 = y + 0.8;
    const h = 16;
    const fill = this.workFill(x, y, s, ghost);
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.wall);
    // Shop window: warm when open after dark.
    const open = !ghost && fill > 0 && this.shopOpen(L) && L.windowLit > 0.05;
    this.drawWindow(ctx, L, this.faceQuad('L', x0, y0, x1, y1, 0.08, 0.62, 2.5, 9.5), 0.92, open);
    ctx.fillStyle = lit(v.roof, 0.72, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0.7, 0.9, 0, 9.5));
    ctx.fill();
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.2, 0.8, 4, 10), 0.8, open && hash2(x, y, 31) < 0.7);
    // Striped awning over the storefront.
    const segs = 5;
    for (let i = 0; i < segs; i++) {
      const a = x0 + ((x1 - x0) * i) / segs;
      const b = x0 + ((x1 - x0) * (i + 1)) / segs;
      ctx.fillStyle = lit(i % 2 ? v.trim : v.roof, i % 2 ? 1 : 0.95, L);
      poly(ctx, [
        [a, y1, 12],
        [b, y1, 12],
        [b, y1 + 0.12, 8.5],
        [a, y1 + 0.12, 8.5],
      ]);
      ctx.fill();
    }
    // Rooftop sign.
    this.drawBox(ctx, L, x0 + 0.12, y1 - 0.1, x1 - 0.12, y1 - 0.04, h, 6, v.trim);
    ctx.fillStyle = lit(v.roof, 0.85, L);
    poly(ctx, this.faceQuad('L', x0 + 0.12, y1 - 0.1, x1 - 0.12, y1 - 0.04, 0.12, 0.88, h + 1.6, h + 4.4));
    ctx.fill();
  }

  drawOffice(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.lavender;
    const floors = s.floors || 4;
    const x0 = x + 0.14;
    const x1 = x + 0.86;
    const y0 = y + 0.14;
    const y1 = y + 0.86;
    const fh = 12;
    const h = 8 + floors * fh;
    const fill = this.workFill(x, y, s, ghost);
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.trim, false);
    // Glass ribbon windows; offices light up in the early evening while people work late.
    const evening = L.clock > 0.7 && L.clock < 0.86 ? 1 : 0.25;
    let wi = 0;
    for (let f = 0; f < floors; f++) {
      const v0 = 9 + f * fh;
      for (const face of ['L', 'R']) {
        for (let k = 0; k < 3; k++) {
          const u0 = 0.06 + k * 0.3;
          const isLit = !ghost && L.windowLit > 0.05 && hash2(x * 5 + wi, y * 11, 17) < fill * evening;
          wi++;
          this.drawWindow(ctx, L, this.faceQuad(face, x0, y0, x1, y1, u0, u0 + 0.28, v0, v0 + 7), face === 'L' ? 0.95 : 0.84, isLit);
        }
      }
    }
    // Lobby band and entrance.
    ctx.fillStyle = lit(v.wall, 0.85, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0, 1, 0, 6));
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.glass, 0.85, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0.38, 0.62, 0, 6));
    ctx.fill();
    ctx.fillStyle = lit(v.wall, 0.7, L);
    poly(ctx, this.faceQuad('R', x0, y0, x1, y1, 0, 1, 0, 6));
    ctx.fill();
    // Roof deck in the accent colour with a small plant room.
    ctx.fillStyle = lit(v.wall, 1.02, L);
    poly(ctx, [
      [x0, y0, h],
      [x1, y0, h],
      [x1, y1, h],
      [x0, y1, h],
    ]);
    ctx.fill();
    this.drawBox(ctx, L, x0 + 0.38, y0 + 0.08, x1 - 0.08, y0 + 0.3, h, 6, v.trim);
  }

  drawSchool(ctx, x, y, s, L, ghost) {
    const wall = PALETTE.peach;
    const roof = '#e9968c';
    const x0 = x + 0.1;
    const x1 = x + 0.9;
    const y0 = y + 0.2;
    const y1 = y + 0.8;
    const h = 16;
    const fill = this.workFill(x, y, s, ghost);
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, wall);
    for (let k = 0; k < 4; k++) {
      if (k === 2) continue;
      const u0 = 0.06 + k * 0.23;
      this.drawWindow(ctx, L, this.faceQuad('L', x0, y0, x1, y1, u0, u0 + 0.15, 5, 11), 0.92, this.isWindowLit(x, y, k, fill * 0.4, L));
    }
    ctx.fillStyle = lit(roof, 0.72, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0.52, 0.66, 0, 10));
    ctx.fill();
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.15, 0.45, 5, 11), 0.8, false);
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.55, 0.85, 5, 11), 0.8, false);
    // Bell tower with a pitched cap and a little clock.
    const bx0 = x + 0.42;
    const bx1 = x + 0.58;
    const by0 = y + 0.38;
    const by1 = y + 0.54;
    this.drawBox(ctx, L, bx0, by0, bx1, by1, h, 10, PALETTE.blush);
    const bm = (by0 + by1) / 2;
    ctx.fillStyle = lit(roof, 1.04, L);
    poly(ctx, [
      [bx0 - 0.03, by0 - 0.03, h + 10],
      [bx0 - 0.03, by1 + 0.03, h + 10],
      [(bx0 + bx1) / 2, by1 + 0.03, h + 17],
      [(bx0 + bx1) / 2, by0 - 0.03, h + 17],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(roof, 0.82, L);
    poly(ctx, [
      [bx1 + 0.03, by0 - 0.03, h + 10],
      [bx1 + 0.03, by1 + 0.03, h + 10],
      [(bx0 + bx1) / 2, by1 + 0.03, h + 17],
      [(bx0 + bx1) / 2, by0 - 0.03, h + 17],
    ]);
    ctx.fill();
    const c = gridToWorld((bx0 + bx1) / 2, by1, h + 5.5);
    ctx.fillStyle = lit('#fffaf2', 1, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 2.3, 2.3, 0, 0, Math.PI * 2);
    ctx.fill();
    // Flag.
    const f = gridToWorld(x0 + 0.06, y0 + 0.06, h);
    ctx.strokeStyle = lit(PALETTE.pole, 1, L);
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x, f.y - 14);
    ctx.stroke();
    const wave = this.reduceMotion ? 0 : Math.sin(this.time * 3 + x) * 1.2;
    ctx.fillStyle = lit(PALETTE.lavender, 0.9, L);
    ctx.beginPath();
    ctx.moveTo(f.x, f.y - 14);
    ctx.quadraticCurveTo(f.x + 4, f.y - 14 + wave, f.x + 7, f.y - 13);
    ctx.lineTo(f.x + 7, f.y - 9.5);
    ctx.quadraticCurveTo(f.x + 4, f.y - 10.5 + wave, f.x, f.y - 10.5);
    ctx.closePath();
    ctx.fill();
  }

  drawClinic(ctx, x, y, s, L, ghost) {
    const wall = '#fff6f2';
    const accent = PALETTE.mint;
    const x0 = x + 0.15;
    const x1 = x + 0.85;
    const y0 = y + 0.15;
    const y1 = y + 0.85;
    const h = 20;
    const fill = this.workFill(x, y, s, ghost);
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, wall);
    // Mint band and windows.
    ctx.fillStyle = lit(accent, 0.92, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0, 1, 12.5, 14.5));
    ctx.fill();
    ctx.fillStyle = lit(accent, 0.78, L);
    poly(ctx, this.faceQuad('R', x0, y0, x1, y1, 0, 1, 12.5, 14.5));
    ctx.fill();
    // Clinics keep a few lights on all night.
    const night = Math.max(0.35, fill);
    for (let k = 0; k < 3; k++) {
      const u0 = 0.08 + k * 0.3;
      this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, u0, u0 + 0.22, 5, 10.5), 0.8, this.isWindowLit(x, y, k, night, L));
      if (k !== 1) this.drawWindow(ctx, L, this.faceQuad('L', x0, y0, x1, y1, u0, u0 + 0.22, 5, 10.5), 0.92, this.isWindowLit(x, y, k + 3, night, L));
    }
    ctx.fillStyle = lit(PALETTE.glass, 0.8, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0.4, 0.6, 0, 9));
    ctx.fill();
    // Rooftop cross.
    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;
    const a = 0.06;
    const b = 0.19;
    ctx.fillStyle = lit('#ff9a9a', 1, L);
    poly(ctx, [
      [cx - a, cy - b, h],
      [cx + a, cy - b, h],
      [cx + a, cy + b, h],
      [cx - a, cy + b, h],
    ]);
    ctx.fill();
    poly(ctx, [
      [cx - b, cy - a, h],
      [cx + b, cy - a, h],
      [cx + b, cy + a, h],
      [cx - b, cy + a, h],
    ]);
    ctx.fill();
    if (L.lamps > 0.1) {
      const p = gridToWorld(cx, cy, h);
      this.glows.push({ x: p.x, y: p.y, r: 14, a: 0.3 * L.lamps, rgb: '255,150,150', flat: true });
    }
  }

  drawTree(ctx, gx, gy, shape, L, phase, scale) {
    const p = gridToWorld(gx, gy);
    const sway = this.reduceMotion ? 0 : Math.sin(this.time * 1.2 + phase) * 0.7;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);
    ctx.fillStyle = lit(PALETTE.trunk, 0.9, L);
    ctx.beginPath();
    ctx.roundRect(-1.6, -9, 3.2, 9.5, 1.2);
    ctx.fill();
    const blob = (cx, cy, r, color, shade) => {
      ctx.fillStyle = lit(color, shade, L);
      ctx.beginPath();
      ctx.arc(cx + sway, cy, r, 0, Math.PI * 2);
      ctx.fill();
    };
    if (shape === 1) {
      // Pine: stacked tiers, darker on the shaded right side.
      for (let i = 0; i < 3; i++) {
        const base = -6 - i * 7;
        const w = 9 - i * 2;
        const s = sway * (0.5 + i * 0.25);
        ctx.fillStyle = lit(PALETTE.leafDeep, 1, L);
        ctx.beginPath();
        ctx.moveTo(-w + s * 0.5, base);
        ctx.lineTo(w + s * 0.5, base);
        ctx.lineTo(s, base - 11);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = lit(PALETTE.leaf, 1, L);
        ctx.beginPath();
        ctx.moveTo(-w + s * 0.5, base);
        ctx.lineTo(s * 0.7, base);
        ctx.lineTo(s, base - 11);
        ctx.closePath();
        ctx.fill();
      }
    } else if (shape === 2) {
      ctx.fillStyle = lit(PALETTE.leafDeep, 1, L);
      ctx.beginPath();
      ctx.ellipse(sway + 0.8, -17, 7, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = lit(PALETTE.leaf, 1, L);
      ctx.beginPath();
      ctx.ellipse(sway - 0.6, -18, 5.8, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      blob(-2.5, -22, 2.6, PALETTE.leafLight, 1);
    } else {
      const blossom = shape === 3;
      const deep = blossom ? '#e9aab6' : PALETTE.leafDeep;
      const mid = blossom ? PALETTE.blossom : PALETTE.leaf;
      const light = blossom ? PALETTE.blossomLight : PALETTE.leafLight;
      blob(1, -15, 9, deep, 1);
      blob(-4, -16, 6.5, mid, 1);
      blob(3, -20, 6.5, mid, 1);
      blob(-1, -22, 6, mid, 1.02);
      blob(-3.2, -22.5, 3, light, 1);
    }
    ctx.restore();
  }

  drawParkProps(ctx, x, y, L) {
    this.drawTree(ctx, x + 0.2, y + 0.8, 2, L, hash2(x, y, 13) * 6, 0.62);
    // Fountain.
    const c = gridToWorld(x + 0.5, y + 0.5);
    ctx.fillStyle = lit(PALETTE.stone, 0.82, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.stone, 1, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y - 2.5, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.water, 1.04, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y - 2.7, 7.6, 3.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.stone, 0.95, L);
    ctx.fillRect(c.x - 1, c.y - 8, 2, 6);
    ctx.fillStyle = litA('#ffffff', 1, L, 0.85);
    for (let i = 0; i < 4; i++) {
      const ph = (this.time * 0.9 + i / 4) % 1;
      const side = i % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.arc(c.x + side * ph * 6, c.y - 8 - Math.sin(ph * Math.PI) * 5 + ph * 4, 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    this.drawTree(ctx, x + 0.8, y + 0.2, 0, L, hash2(x, y, 14) * 6, 0.55);
    // Bench.
    const b = gridToWorld(x + 0.78, y + 0.66);
    ctx.fillStyle = lit(PALETTE.trunk, 0.95, L);
    ctx.beginPath();
    ctx.moveTo(b.x - 5, b.y - 3);
    ctx.lineTo(b.x + 2, b.y - 6.5);
    ctx.lineTo(b.x + 2, b.y - 4.5);
    ctx.lineTo(b.x - 5, b.y - 1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.trunk, 0.7, L);
    ctx.fillRect(b.x - 4.5, b.y - 1.5, 1, 2);
    ctx.fillRect(b.x + 1, b.y - 5, 1, 2);
  }

  // Street lamps sit on a sidewalk edge of some road tiles; four-way junctions stay clear.
  lampSpot(t) {
    if (hash2(t.x, t.y, 7) > 0.5) return null;
    for (const i of [3, 0, 1, 2]) {
      if (t.roadMask & (1 << i)) continue;
      const e = EDGES[i];
      return {
        gx: t.x + (e.a[0] + e.b[0]) / 2 + e.n[0] * 0.08,
        gy: t.y + (e.a[1] + e.b[1]) / 2 + e.n[1] * 0.08,
      };
    }
    return null;
  }

  drawLamp(ctx, lamp, L) {
    const base = gridToWorld(lamp.gx, lamp.gy);
    const top = base.y - 20;
    ctx.strokeStyle = lit(PALETTE.pole, 1, L);
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(base.x, base.y);

const __mod_camera = (() => {
// Camera: smooth pan and zoom. Holds a target the view eases toward; input moves the target.

  constructor() {

    this.y = 0;

    this.tx = 0;
    this.ty = 0;

    this.minZoom = 0.2;
    this.maxZoom = 3.5;
    this.viewW = 1;
    this.viewH = 1;
    this.bounds = null;
    this.smooth = true;
  }

  setViewport(w, h) {
    this.viewW = w;
    this.viewH = h;
  }

  setBounds(b) {
    this.bounds = b;
    this.clampTarget();
  }

  update(dt) {
    const k = this.smooth ? 1 - Math.exp(-dt * 12) : 1;
    this.x += (this.tx - this.x) * k;
    this.y += (this.ty - this.y) * k;
    this.zoom = Math.exp(Math.log(this.zoom) + (Math.log(this.tzoom) - Math.log(this.zoom)) * k);
  }

  screenToWorld(sx, sy) {
    return {
      x: (sx - this.viewW / 2) / this.zoom + this.x,
      y: (sy - this.viewH / 2) / this.zoom + this.y,
    };
  }

  // Dragging moves the view exactly with the finger; the target follows so nothing snaps back.
  panBy(dx, dy) {
    this.x -= dx / this.zoom;
    this.y -= dy / this.zoom;
    this.tx = this.x;
    this.ty = this.y;
    this.clampTarget();
  }

  fling(vx, vy) {
    this.tx -= (vx * 0.22) / this.zoom;
    this.ty -= (vy * 0.22) / this.zoom;
    this.clampTarget();
  }

  zoomAt(factor, sx, sy, immediate = false) {
    const nz = clamp(this.tzoom * factor, this.minZoom, this.maxZoom);
    const ox = sx - this.viewW / 2;
    const oy = sy - this.viewH / 2;
    const wx = ox / this.tzoom + this.tx;
    const wy = oy / this.tzoom + this.ty;
    this.tzoom = nz;
    this.tx = wx - ox / nz;
    this.ty = wy - oy / nz;
    this.clampTarget();
    if (immediate) {
      this.x = this.tx;
      this.y = this.ty;
      this.zoom = this.tzoom;
    }
  }

  // Frame a world-space rectangle (the whole board by default) inside the area left free by the interface.

    const b = rect;
    if (!b) return;
    const availW = Math.max(120, this.viewW - insets.left - insets.right);
    const availH = Math.max(120, this.viewH - insets.top - insets.bottom);
    const z = clamp(Math.min(availW / (b.right - b.left), availH / (b.bottom - b.top)) * 0.94, 0.15, 2.2);

    this.tx = (b.left + b.right) / 2 - (insets.left - insets.right) / 2 / z;
    this.ty = (b.top + b.bottom) / 2 - (insets.top - insets.bottom) / 2 / z;
    if (immediate) {
      this.x = this.tx;
      this.y = this.ty;
      this.zoom = z;
    }
  }

  clampTarget() {
    const b = this.bounds;
    if (!b) return;
    this.tx = clamp(this.tx, b.left, b.right);
    this.ty = clamp(this.ty, b.top, b.bottom);
    this.x = clamp(this.x, b.left - 200, b.right + 200);

})();

  constructor(canvas, camera, handlers) {

const __mod_persistence = (() => {
// Persistence: versioned saves in localStorage. Add a migration whenever SAVE_VERSION goes up.

const { SAVE_VERSION } = __mod_config;
const { CityState } = __mod_state;
const KEY = 'pocket-metropolis:save';

// MIGRATIONS[n] upgrades a save from version n to n + 1.
const MIGRATIONS = {
  // v1 → v2: maps grew from 12×12 to 32×32. Old towns keep every tile and move to the middle.
  1: (save) => {
    const c = save.city;
    const size = Math.max(32, c.width | 0, c.height | 0);
    const ox = Math.floor((size - c.width) / 2);
    const oy = Math.floor((size - c.height) / 2);
    const tiles = Array.from({ length: size * size }, () => ({ terrain: 'grass', structure: null }));
    c.tiles.forEach((t, i) => {
      const x = i % c.width;
      const y = Math.floor(i / c.width);
      tiles[(y + oy) * size + x + ox] = t;
    });
    save.city = { ...c, width: size, height: size, tiles };
    return save;
  },
};

function migrate(save) {
  let v = save.version | 0;
  if (v < 1 || v > SAVE_VERSION) throw new Error(`Unsupported save version ${save.version}`);
  while (v < SAVE_VERSION) {
    save = MIGRATIONS[v](save);
    v++;
    save.version = v;
  }
  return save;
}

function saveCity(city) {
  try {
    const save = { version: SAVE_VERSION, savedAt: Date.now(), city: city.toJSON() };
    localStorage.setItem(KEY, JSON.stringify(save));
    return true;
  } catch {
    return false;
  }
}

function loadCity() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return CityState.fromJSON(migrate(JSON.parse(raw)).city);
  } catch {
    return null;
  }
}

// Saves shortly after each edit, every so often while the city lives, and when the page is hidden.
class AutoSaver {
  constructor(city, { delayMs = 800, intervalS = 15 } = {}) {
    this.city = city;
    this.delayMs = delayMs;
    this.intervalS = intervalS;
    this.pending = -1;
    this.since = 0;
    city.on((ev) => {
      if (['placed', 'removed', 'watered', 'reset', 'lifeChanged', 'lifeEvent'].includes(ev.type)) {
        this.pending = this.delayMs;
      }
    });
    const flush = () => this.flush();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
    });
    window.addEventListener('pagehide', flush);
  }

  tick(dt) {
    this.since += dt;
    if (this.pending >= 0) {
      this.pending -= dt * 1000;
      if (this.pending < 0) this.flush();
    }
    if (this.since > this.intervalS) this.flush();
  }

  flush() {
    saveCity(this.city);
    this.since = 0;
    this.pending = -1;
  }
}

return { MIGRATIONS, saveCity, loadCity, AutoSaver };

    const py = vertical ? ri(4, H - 5) : pos < H / 2 ? H - 4 : 3;
    const r = 1.5 + rand();
    for (const t of city.tiles) if (Math.hypot(t.x - px, t.y - py) + (rand() - 0.5) * 0.8 < r && !inTown(t.x, t.y)) t.terrain = 'water';
  }

  // Streets: two avenues cross downtown and run to the map edge; a grid fills the town.
  for (let i = 0; i < W; i++) place(i, cy, 'road');
  for (let i = 0; i < H; i++) place(cx, i, 'road');
  const step = W >= 24 ? 5 : 4;
  for (let o = step; o <= half; o += step) {
    for (const s of [-1, 1]) {
      const ry = cy + s * o;
      const rx = cx + s * o;
      if (rand() < 0.85) for (let x = cx - half + ri(0, 2); x <= cx + half - ri(0, 2); x++) if (tile(x, ry)) place(x, ry, 'road');
      if (rand() < 0.85) for (let y = cy - half + ri(0, 2); y <= cy + half - ri(0, 2); y++) if (tile(rx, y)) place(rx, y, 'road');
    }
  }

  // Lots along streets. Downtown is dense and busy; the edges of town are leafy houses.
  const nearRoad = (x, y) => DIRS.some((d) => city.isRoad(x + d.dx, y + d.dy));
  const ring = (x, y) => Math.max(Math.abs(x - cx), Math.abs(y - cy));
  const lots = city.tiles.filter((t) => isEmpty(t.x, t.y) && nearRoad(t.x, t.y) && inTown(t.x, t.y));
  for (const t of lots) {
    const d = ring(t.x, t.y);
    const onAvenue = t.x === cx + 1 || t.x === cx - 1 || t.y === cy + 1 || t.y === cy - 1;
    const r = rand();
    if (d <= 3) {
      if (r < 0.32) place(t.x, t.y, 'tower');
      else if (r < 0.6) place(t.x, t.y, 'office');
      else if (r < 0.86) place(t.x, t.y, 'shop');
    } else if (d <= 7) {
      if (onAvenue && r < 0.25) place(t.x, t.y, 'shop');
      else if (r < 0.12) place(t.x, t.y, 'tower');
      else if (r < 0.2) place(t.x, t.y, 'office');
      else if (r < 0.82) place(t.x, t.y, 'house');
    } else if (r < (onAvenue ? 0.12 : 0.03)) place(t.x, t.y, 'shop');
    else if (r < 0.74) place(t.x, t.y, 'house');
  }

  // A school and a clinic on opposite sides of downtown.
  const serviceSpot = (sx, sy) => {
    const spots = lots
      .filter((t) => {
        const s = tile(t.x, t.y).structure?.type;
        return (!s || s === 'house') && ring(t.x, t.y) >= 3 && ring(t.x, t.y) <= 8 && Math.sign(t.x - cx) === sx && Math.sign(t.y - cy) === sy;
      })
      .sort(() => rand() - 0.5);
    return spots[0];
  };
  const corner = rand() < 0.5 ? 1 : -1;
  const school = serviceSpot(corner, corner);
  if (school) place(school.x, school.y, 'school');
  const clinic = serviceSpot(-corner, -corner);
  if (clinic) place(clinic.x, clinic.y, 'clinic');

  // Parks where people live.
  const homesAround = (x, y) => {
    let n = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const s = tile(x + dx, y + dy)?.structure;
      if (s && STRUCTURES[s.type].capacity > 0) n++;
    }
    return n;
  };
  const parkSpots = city.tiles
    .filter((t) => isEmpty(t.x, t.y) && inTown(t.x, t.y))
    .map((t) => ({ t, score: homesAround(t.x, t.y) + rand() * 3 }))
    .sort((a, b) => b.score - a.score);
  const parks = Math.max(2, Math.round((half * half) / 18));
  for (let i = 0; i < Math.min(parks, parkSpots.length); i++) place(parkSpots[i].t.x, parkSpots[i].t.y, 'park');

  // Trees: scattered in town, thick woods in the countryside.
  const forests = Array.from({ length: Math.max(2, Math.round(W / 6)) }, () => ({ x: ri(0, W - 1), y: ri(0, H - 1), r: 2 + rand() * 4 }));
  for (const t of city.tiles) {
    if (!isEmpty(t.x, t.y)) continue;
    const byWater = DIRS.some((d) => tile(t.x + d.dx, t.y + d.dy)?.terrain === 'water');
    let p = inTown(t.x, t.y) ? 0.28 : 0.1;
    if (byWater) p += 0.25;
    for (const f of forests) if (Math.hypot(t.x - f.x, t.y - f.y) < f.r) p += 0.55;
    if (rand() < p) place(t.x, t.y, 'tree');
  }

  // Some people already live here.
  for (const h of city.homes()) {
    h.structure.residents = Math.floor(STRUCTURES[h.structure.type].capacity * (0.3 + rand() * 0.35));
  }

  city.refreshAllRoadMasks();
  city.dirty = true;
  city.emit('reset', { seed, focus: { x: cx, y: cy, radius: half } });
}

return { generateTown };
})();

const MOUTHS = {

const pct = (v) => `${Math.round(v * 100)}%`;

class Interface {
  constructor({ onTool, onRandom, onFit, onSpeed, onView, onCloseInspect }) {
    this.toolbar = document.getElementById('toolbar');
    this.tray = document.getElementById('tray');
    this.popEl = document.getElementById('stat-pop');

    this.clockEl = document.getElementById('stat-clock');
    this.toastEl = document.getElementById('toast');
    this.inspectEl = document.getElementById('inspector');
    this.legendEl = document.getElementById('legend');
    this.speedBtn = document.getElementById('btn-speed');
    this.moreBtn = document.getElementById('btn-more');
    this.moreSheet = document.getElementById('more-sheet');
    this.onRandom = onRandom;
    this.onFit = onFit;
    this.viewBtn = document.getElementById('btn-view');
    this.onTool = onTool;
    this.onSpeed = onSpeed;
    this.onView = onView;
    this.tool = 'house';
    this.groupChoice = Object.fromEntries(TOOL_GROUPS.map((g) => [g.id, g.tools[0].id]));
    this.speed = 1;
    this.view = 'none';
    this._last = {};

    for (const g of TOOL_GROUPS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tool';
      b.id = `group-${g.id}`;
      b.dataset.group = g.id;
      b.setAttribute('aria-pressed', 'false');
      if (g.tools.length > 1) b.setAttribute('aria-haspopup', 'true');

      this.toolbar.appendChild(b);

    document.getElementById('btn-random').addEventListener('click', onRandom);
    document.getElementById('btn-fit').addEventListener('click', onFit);
    this.speedBtn.addEventListener('click', () => this.setSpeed(this.speed === 0 ? this._resume || 1 : this.speed >= 3 ? 0 : this.speed + 1));
    this.viewBtn.addEventListener('click', () => {
      const i = VIEWS.findIndex((v) => v.id === this.view);
      this.setView(VIEWS[(i + 1) % VIEWS.length].id);
    });
    this.inspectEl.addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) onCloseInspect();
    });
    this.moreBtn.addEventListener('click', () => this.toggleMore());
    this.moreSheet.addEventListener('click', (e) => this.onMoreClick(e));
    document.addEventListener('pointerdown', (e) => {
      if (!this.tray.hidden && !e.target.closest('#tray') && !e.target.closest('.tool')) this.closeTray();
      if (!this.moreSheet.hidden && !e.target.closest('#more-sheet') && !e.target.closest('#btn-more')) this.toggleMore(false);
    });
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === ' ') {
        e.preventDefault();
        this.speedBtn.click();
        return;
      }
      if (e.key === 'v') return this.viewBtn.click();
      if (e.key === 'Escape') {

  groupOf(toolId) {

  }

  pressGroup(groupId) {
    const g = TOOL_GROUPS.find((x) => x.id === groupId);
    if (g.tools.length > 1) {
      if (!this.tray.hidden && this.trayGroup === groupId) return this.closeTray();
      this.setTool(this.groupChoice[groupId]);
      this.openTray(g);
      return;
    }
    this.closeTray();
    this.setTool(this.groupChoice[groupId]);
  }

  openTray(g) {
    this.trayGroup = g.id;
    this.tray.innerHTML = g.tools
      .map(
        (t) =>
          `<button type="button" class="tray-item" data-tool="${t.id}" aria-pressed="${t.id === this.tool}">` +
          `<span class="tool-icon tint-${t.id}">${ICONS[t.id]}</span><span>${t.label}</span><kbd>${t.key.toUpperCase()}</kbd></button>`
      )
      .join('');
    for (const b of this.tray.querySelectorAll('.tray-item')) {
      b.addEventListener('click', () => {
        this.setTool(b.dataset.tool);
        this.closeTray();
      });
    }
    const anchor = document.getElementById(`group-${g.id}`).getBoundingClientRect();
    this.toastEl.classList.remove('show');
    this.tray.hidden = false;
    const w = this.tray.offsetWidth;
    const left = Math.max(12, Math.min(window.innerWidth - w - 12, anchor.left + anchor.width / 2 - w / 2));
    this.tray.style.left = `${left}px`;
  }

  closeTray() {
    this.tray.hidden = true;
  }

  setTool(id) {
    this.tool = id;
    const group = this.groupOf(id);
    this.groupChoice[group.id] = id;
    for (const b of this.toolbar.querySelectorAll('.tool')) {
      const g = TOOL_GROUPS.find((x) => x.id === b.dataset.group);
      const choice = TOOLS.find((t) => t.id === this.groupChoice[g.id]);
      b.setAttribute('aria-pressed', String(g.id === group.id));
      b.title = g.tools.length > 1 ? `${g.label}: ${choice.label} (${choice.key.toUpperCase()})` : `${choice.label} (${choice.key.toUpperCase()})`;
      b.innerHTML =
        `<span class="tool-icon tint-${choice.id}">${ICONS[choice.id]}</span>` +
        `<span class="tool-label">${g.tools.length > 1 ? choice.label : g.label}</span>` +
        (g.tools.length > 1 ? '<span class="more" aria-hidden="true"></span>' : '');
    }
    if (!this.tray.hidden) for (const b of this.tray.querySelectorAll('.tray-item')) b.setAttribute('aria-pressed', String(b.dataset.tool === id));
    this.onTool(id);
  }

  // ---- City controls sheet (phones and short screens) ------------------------

  toggleMore(force) {
    const open = force ?? this.moreSheet.hidden;
    this._confirmRandom = false;
    this.moreSheet.hidden = !open;
    this.moreBtn.setAttribute('aria-expanded', String(open));
    this.moreBtn.classList.toggle('is-on', open);
    if (open) {
      this.closeTray();
      this.renderMore();
    }
  }

  renderMore() {
    if (this.moreSheet.hidden) return;
    const speeds = [
      [0, 'Pause'],
      [1, '1×'],
      [2, '2×'],
      [3, '3×'],
    ];
    this.moreSheet.innerHTML =
      `<header><h2>City controls</h2><button type="button" class="insp-close" data-more="close" aria-label="Close">${ICONS.close}</button></header>` +
      `<span class="sheet-label">Speed</span><div class="seg big">${speeds
        .map(([v, l]) => `<button type="button" data-speed="${v}" aria-pressed="${this.speed === v}">${l}</button>`)
        .join('')}</div>` +
      `<span class="sheet-label">Map view</span><div class="seg big views">${VIEWS.map(
        (v) => `<button type="button" data-view="${v.id}" aria-pressed="${this.view === v.id}">${v.label}</button>`
      ).join('')}</div>` +
      `<div class="sheet-actions"><button type="button" class="ghost-btn" data-more="fit">Recenter</button>` +
      `<button type="button" class="${this._confirmRandom ? 'primary-btn danger' : 'ghost-btn'}" data-more="random">${this._confirmRandom ? 'Tap again to replace your city' : 'Random Town'}</button></div>`;
  }

  onMoreClick(e) {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.speed != null) this.setSpeed(Number(t.dataset.speed));
    else if (t.dataset.view) this.setView(t.dataset.view);
    else if (t.dataset.more === 'close') return this.toggleMore(false);
    else if (t.dataset.more === 'fit') {
      this.onFit();
      return this.toggleMore(false);
    } else if (t.dataset.more === 'random') {
      // Replacing the city can't be undone, so it takes a second tap.
      if (!this._confirmRandom) {
        this._confirmRandom = true;
        clearTimeout(this._confirmTimer);
        this._confirmTimer = setTimeout(() => {
          this._confirmRandom = false;
          this.renderMore();
        }, 3500);
      } else {
        this._confirmRandom = false;
        this.onRandom();
        return this.toggleMore(false);
      }
    }
    this.renderMore();
  }

  setSpeed(speed) {
    if (speed > 0) this._resume = speed;
    this.speed = speed;
    this.renderSpeed();
    this.onSpeed(speed);
  }

  renderSpeed() {
    const paused = this.speed === 0;
    this.speedBtn.innerHTML = `${paused ? ICONS.play : ICONS.pause}<span class="pill-text">${paused ? 'Paused' : `${this.speed}×`}</span>`;
    this.speedBtn.setAttribute('aria-label', paused ? 'Resume time' : `Speed ${this.speed}×, change speed`);
    this.speedBtn.classList.toggle('is-paused', paused);
    this.moreBtn?.classList.toggle('is-paused', paused);
  }

  setView(id) {
    this.view = id;
    this.renderView();
    this.onView(id);
  }

  renderView() {
    const v = VIEWS.find((x) => x.id === this.view);
    this.viewBtn.innerHTML = `${ICONS.layers}<span class="pill-text">${v.label}</span>`;
    this.viewBtn.setAttribute('aria-label', `Map view: ${v.label}. Switch view`);
    this.viewBtn.classList.toggle('is-on', this.view !== 'none');
    const legend = LEGENDS[this.view];
    this.legendEl.hidden = !legend;
    if (legend) {
      this.legendEl.innerHTML = `<span class="legend-title">${v.label}</span><span class="legend-sub">${legend[0]}</span><span class="legend-bar ${legend[3]}"></span><span class="legend-ends"><span>${legend[1]}</span><span>${legend[2]}</span></span>`;
    }
  }

  update(city) {
    const s = city.stats;
    const set = (key, el, value, prop = 'textContent') => {
      if (this._last[key] === value) return;
      this._last[key] = value;
      if (prop === 'd') el.setAttribute('d', value);
      else el[prop] = value;
    };
    set('pop', this.popEl, s.population.toLocaleString());
    set('cap', this.capEl, `/${s.capacity.toLocaleString()}`);
    set('happy', this.happyEl, s.homes ? `${s.happiness}%` : '–');
    set('mood', this.moodEl, MOUTHS[s.happiness >= 60 ? 'happy' : s.happiness >= 40 ? 'okay' : 'sad'], 'd');
    if (this._last.meterW !== s.happiness) {
      this._last.meterW = s.happiness;
      this.meterEl.style.width = `${s.homes ? s.happiness : 0}%`;
    }
    const work = s.jobs ? ` · ${pct(s.employment ?? 1)} employed` : '';
    set('clock', this.clockEl, `Day ${city.day} · ${formatClock(city.clock)}${work}`);
  }

  // Inspector: what is on a tile and why people do or don't want to live there.
  inspect(city, sel) {
    if (!sel) {
      this.inspectEl.hidden = true;
      this._inspectKey = null;
      return;
    }
    const t = city.getTile(sel.x, sel.y);
    if (!t) return;
    const s = t.structure;
    const def = s && STRUCTURES[s.type];
    let title = t.terrain === 'water' ? 'Water' : s ? def.label : 'Open land';
    const facts = [];
    if (def?.capacity) {
      facts.push(['Residents', `${s.residents} of ${def.capacity}`]);
      const workers = workersIn(t);
      if (workers) facts.push(['Working', `${Math.round(t.employment * workers)} of ${workers}`]);
    }
    if (def?.jobs) facts.push(['Jobs filled', `${t.workersFilled} of ${def.jobs}`]);
    if (def?.service) facts.push(['Covers', `${def.radius} tiles around it`]);
    if (s?.type === 'road') facts.push(['Traffic', t.congestion < 0.02 ? 'Clear' : `${pct(t.congestion)} busy`]);
    if (!city.accessRoad(t.x, t.y) && def && !def.walkable) facts.push(['Road access', 'None nearby']);
    const showFactors = t.terrain !== 'water' && s?.type !== 'road';
    const factors = showFactors
      ? FACTORS.filter((f) => f.enabled).map((f) => ({ label: f.label, v: t.factors[f.id] || 0 }))
      : [];
    const coverage = SERVICES.map((sv) => `${sv.label.replace(/s$/, '')} ${pct(t.coverage?.[sv.id] || 0)}`).join(' · ');
    const key = JSON.stringify([title, facts, factors.map((f) => f.v.toFixed(3)), t.desirability.toFixed(3), coverage]);
    if (key === this._inspectKey) return;
    this._inspectKey = key;
    this.inspectEl.hidden = false;
    this.inspectEl.innerHTML =
      `<header><div><span class="insp-kicker">Tile ${t.x}, ${t.y}</span><h2>${title}</h2></div>` +
      `<button type="button" class="insp-close" data-close aria-label="Close inspector">${ICONS.close}</button></header>` +
      (facts.length ? `<dl>${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : '') +
      (showFactors
        ? `<div class="insp-score"><span>Desirability</span><strong>${pct(t.desirability)}</strong></div>` +
          `<ul class="factors">${factors
            .map(
              (f) =>
                `<li><span>${f.label}</span><span class="fbar"><span class="${f.v < 0 ? 'neg' : 'pos'}" style="width:${Math.min(100, (Math.abs(f.v) / 0.35) * 100).toFixed(0)}%"></span></span><span class="fval">${f.v >= 0 ? '+' : '−'}${Math.round(Math.abs(f.v) * 100)}</span></li>`
            )
            .join('')}</ul><p class="insp-note">${coverage}</p>`
        : '');
  }

  toast(message, ms = 2600) {
    this.toastEl.textContent = message;
    this.toastEl.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.toastEl.classList.remove('show'), ms);
  }
}

return { Interface };
})();
