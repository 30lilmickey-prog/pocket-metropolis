<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcf0f2">
<title>Pocket Metropolis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: the city fills the screen edge to edge; the interface floats on top like stickers on glass. */
:root {
  --sky: #dcf0f2;
  --panel: rgba(255, 252, 250, 0.8);
  --panel-edge: rgba(255, 255, 255, 0.95);
  --ink: #4b4468;
  --ink-soft: #8b84a6;
  --press: #ffffff;
  --meter-track: rgba(75, 68, 104, 0.1);
  --meter: #8fd0a5;
  --focus: #9f86d6;
  --shadow: 0 8px 24px rgba(84, 70, 130, 0.16), 0 1px 3px rgba(84, 70, 130, 0.12);
  --tint-house: #ffb5a7;
  --tint-tower: #cdb4db;
  --tint-tree: #a8d5a2;
  --tint-park: #b8e0d2;
  --tint-road: #d6d0c4;
  --tint-water: #7ec8e3;
  --tint-bulldoze: #fcd5ce;
  --avatar-bg: #fdeee8;
  --bubble: #ffffff;
  --stat-happiness: #ffcf6e;
  --stat-health: #8fd0a5;
  --stat-smarts: #b49ad1;
  --stat-looks: #f5a3b5;
  --stat-rel: #ff9f8f;
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --sky: #2c2e58;
    --panel: rgba(46, 42, 82, 0.78);
    --panel-edge: rgba(255, 255, 255, 0.14);
    --avatar-bg: #3e3a6b;
    --bubble: rgba(255, 255, 255, 0.1);
    --ink: #f4effc;
    --ink-soft: #b9b1d8;
    --press: rgba(255, 255, 255, 0.16);
    --meter-track: rgba(255, 255, 255, 0.14);
    --focus: #d7c6ff;
    --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --sky: #2c2e58;
  --panel: rgba(46, 42, 82, 0.78);
  --panel-edge: rgba(255, 255, 255, 0.14);
  --ink: #f4effc;
  --ink-soft: #b9b1d8;
  --press: rgba(255, 255, 255, 0.16);
  --meter-track: rgba(255, 255, 255, 0.14);
  --focus: #d7c6ff;
  --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: fixed;
  inset: 0;
}
#city {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}
#city:active {
  cursor: grabbing;
}

.glass {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  backdrop-filter: blur(14px) saturate(1.3);
}

/* Stats bubble */
.stats {
  box-sizing: border-box;
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: grid;
  grid-template-columns: auto auto;
  column-gap: 18px;
  row-gap: 6px;
  padding: 10px 16px 10px 12px;
  border-radius: 22px;
  pointer-events: none;
}
.stat {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-badge {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 12px;
  color: #5a4a62;
}
.stat-badge svg {
  width: 20px;
  height: 20px;
}
.badge-pop {
  background: var(--tint-house);
}
.badge-mood {
  background: var(--tint-park);
}
.stat-text {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
}
.stat-value {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.stat-value small {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-left: 1px;
}
.stat-label {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}
.meter {
  width: 100%;
  height: 4px;
  margin-top: 3px;
  border-radius: 4px;
  background: var(--meter-track);
  overflow: hidden;
}
.meter span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--meter);
  transition: width 0.6s ease;
}
.clock {
  grid-column: 1 / -1;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  padding-left: 2px;
}

/* Corner buttons */
.corner {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  display: flex;
  gap: 8px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 42px;
  padding: 0 16px 0 12px;
  border-radius: 21px;
  color: var(--ink);
  font: 800 13.5px/1 var(--font-body);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.pill svg {
  width: 20px;
  height: 20px;
}
.pill:hover {
  transform: translateY(-1px);
}
.pill:active {
  transform: translateY(1px) scale(0.97);
}
.pill.icon-only {
  width: 42px;
  padding: 0;
  justify-content: center;
}
.dice {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  background: var(--tint-tower);
  color: #4f3f62;
}
.dice svg {
  width: 18px;
  height: 18px;
}

/* Toolbar */
.toolbar {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 26px;
  max-width: calc(100vw - 32px);
}
.tool {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 58px;
  padding: 6px 0 5px;
  border-radius: 20px;
  cursor: pointer;
  font: 800 11px/1 var(--font-body);
  letter-spacing: 0.02em;
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.15s ease;
}
.tool-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 14px;
  color: #4d4360;
  background: var(--tint);
  box-shadow: inset 0 -3px 0 rgba(70, 50, 90, 0.12);
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.tool-icon svg {
  width: 22px;
  height: 22px;
}
.tool-label {
  color: var(--ink-soft);
}
.tool:hover .tool-icon {
  transform: translateY(-2px);
}
.tool[aria-pressed='true'] {
  background: var(--press);
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}
.tool[aria-pressed='true'] .tool-icon {
  transform: scale(1.06);
}
.tool[aria-pressed='true'] .tool-label {
  color: var(--ink);
}
.tint-inspect { --tint: #e8e4f4; }
.tint-house { --tint: var(--tint-house); }
.tint-tower { --tint: var(--tint-tower); }
.tint-shop { --tint: #ffd9a8; }
.tint-office { --tint: #c9dcf2; }
.tint-school { --tint: #ffc9b9; }
.tint-clinic { --tint: #c4ead9; }
.tint-tree { --tint: var(--tint-tree); }
.tint-park { --tint: var(--tint-park); }
.tint-road { --tint: var(--tint-road); }
.tint-water { --tint: var(--tint-water); }
.tint-bulldoze { --tint: var(--tint-bulldoze); }

.tool {
  position: relative;
}
.more {
  position: absolute;
  top: 5px;
  right: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-soft);
  opacity: 0.55;
}

/* Tool tray: sub-tools for a group, floating above the toolbar */
.tray {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 22px;
  z-index: 3;
}
.tray-item {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 64px;
  padding: 6px 0;
  border-radius: 16px;
  cursor: pointer;
  font: 800 11px/1 var(--font-body);
}
.tray-item[aria-pressed='true'] {
  background: var(--press);
  box-shadow: var(--shadow);
}
.tray-item kbd {
  font: 700 9.5px/1 var(--font-body);
  color: var(--ink-soft);
  border: 1px solid var(--meter-track);
  border-radius: 5px;
  padding: 2px 4px;
}

/* Speed and view pills */
#btn-speed.is-paused,
#btn-view.is-on {
  background: var(--press);
  outline: 2px solid var(--tint-tower);
}

/* Legend for data views */
.legend {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 112px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: grid;
  gap: 4px;
  width: 210px;
  padding: 10px 14px;
  border-radius: 18px;
  pointer-events: none;
}
.legend-title {
  font: 600 15px/1.1 var(--font-display);
}
.legend-sub {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.legend-bar {
  height: 8px;
  border-radius: 4px;
  margin-top: 2px;
}
.legend-bar.ramp {
  background: linear-gradient(90deg, #f68c8c, #ffd678, #6ec896);
}
.legend-bar.ramp-rev {
  background: linear-gradient(90deg, #6ec896, #ffd678, #f68c8c);
}
.legend-bar.service {
  background: linear-gradient(90deg, rgba(70, 60, 110, 0.25), #c8b4ec, #8cdcc0);
}
.legend-ends {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
}

/* Inspector card */
.inspector {
  position: absolute;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  width: 290px;
  max-height: calc(100% - 260px);
  overflow-y: auto;
  padding: 14px 16px 12px;
  border-radius: 22px;
  display: grid;
  gap: 10px;
  z-index: 2;
}
.inspector header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.insp-kicker {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.inspector h2 {
  margin: 2px 0 0;
  font: 600 20px/1.1 var(--font-display);
}
.insp-close {
  appearance: none;
  border: 0;
  background: var(--meter-track);
  color: var(--ink);
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.insp-close svg {
  width: 16px;
  height: 16px;
}
.inspector dl {
  margin: 0;
  display: grid;
  gap: 4px;
}
.inspector dl div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
}
.inspector dt {
  color: var(--ink-soft);
  font-weight: 700;
}
.inspector dd {
  margin: 0;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.insp-score {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 8px;
  border-top: 1px solid var(--meter-track);
  font-weight: 800;
  font-size: 13px;
}
.insp-score strong {
  font: 600 22px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.factors {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
}
.factors li {
  display: grid;
  grid-template-columns: 1fr 70px 30px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
}
.fbar {
  height: 6px;
  border-radius: 3px;
  background: var(--meter-track);
  overflow: hidden;
}
.fbar span {
  display: block;
  height: 100%;
  border-radius: inherit;
}
.fbar .pos {
  background: var(--meter);
}
.fbar .neg {
  background: #f39a9a;
}
.fval {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
}
.insp-note {
  margin: 0;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}

button {
  touch-action: manipulation;
}
#btn-more {
  display: none;
}
#btn-more.is-on,
#btn-more.is-paused {
  background: var(--press);
  outline: 2px solid var(--tint-tower);
}

/* City controls sheet: speed, map view, recenter and Random Town on phones */
.more-sheet {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  width: min(440px, calc(100vw - 24px));
  max-height: calc(100% - 120px);
  overflow-y: auto;
  padding: 14px 16px 16px;
  border-radius: 24px;
  z-index: 7;
  display: grid;
  gap: 8px;
  animation: card-in 0.3s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.more-sheet header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.more-sheet h2 {
  margin: 0;
  font: 600 19px/1.1 var(--font-display);
}
.sheet-label {
  margin-top: 4px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.seg.big button {
  padding: 12px 4px;
  font-size: 13.5px;
  font-weight: 800;
  min-height: 44px;
}
.seg.views {
  flex-wrap: wrap;
}
.seg.views button {
  flex: 1 1 40%;
}
.sheet-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 6px;
}
.sheet-actions button {
  min-height: 46px;
}
.primary-btn.danger {
  background: #f6a3a3;
  color: #5a2323;
}

button:focus-visible {
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
}

/* Toast */
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 112px);
  transform: translate(-50%, 8px);
  max-width: calc(100vw - 48px);
  padding: 9px 16px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Life Story */
#btn-life {
  position: relative;
}
#btn-life.is-on {
  background: var(--press);
  outline: 2px solid var(--stat-rel);
}
.badge {
  position: absolute;
  top: 5px;
  right: 6px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #ff7a6b;
  border: 2px solid var(--panel-edge);
  animation: badge-pop 1.6s ease-in-out infinite;
}
@keyframes badge-pop {
  50% {
    transform: scale(1.25);
  }
}
.life-panel {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  width: 360px;
  overflow-y: auto;
  padding: 16px;
  border-radius: 24px;
  z-index: 4;
  display: grid;
  align-content: start;
  gap: 12px;
  user-select: text;
  -webkit-user-select: text;
}
.life-panel h3 {
  margin: 6px 0 0;
  font: 600 15px/1.2 var(--font-display);
}
.life-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}
.life-create .life-head {
  grid-template-columns: auto 1fr;
}
.avatar {
  display: grid;
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(84, 70, 130, 0.18);
}
.avatar.gone {
  filter: grayscale(0.7);
  opacity: 0.8;
}
.life-kicker {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.life-head h2 {
  margin: 1px 0 0;
  font: 600 22px/1.1 var(--font-display);
  text-wrap: balance;
}
.life-sub {
  margin: 3px 0 0;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.year-bar {
  margin-top: 6px;
  height: 5px;
  border-radius: 3px;
  background: var(--meter-track);
  overflow: hidden;
}
.year-bar span {
  display: block;
  height: 100%;
  background: var(--stat-rel);
  border-radius: inherit;
}
.icon-btn {
  appearance: none;
  border: 0;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--meter-track);
  color: var(--ink);
  cursor: pointer;
  align-self: start;
}
.icon-btn svg {
  width: 18px;
  height: 18px;
}
.life-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.primary-btn,
.ghost-btn {
  appearance: none;
  border: 0;
  border-radius: 14px;
  padding: 11px 16px;
  font: 800 13.5px/1 var(--font-body);
  cursor: pointer;
  transition: transform 0.15s ease;
}
.primary-btn {
  flex: 1;
  background: var(--stat-rel);
  color: #4a2a28;
  box-shadow: inset 0 -3px 0 rgba(120, 50, 40, 0.18);
}
.primary-btn:disabled {
  background: var(--meter-track);
  color: var(--ink-soft);
  box-shadow: none;
  cursor: default;
}
.ghost-btn {
  background: var(--meter-track);
  color: var(--ink);
}
.ghost-btn:disabled {
  opacity: 0.5;
}
.primary-btn:not(:disabled):active,
.ghost-btn:active {
  transform: scale(0.97);
}
.life-hint {
  margin: -4px 0 0;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.stat-bars,
.people,
.life-log {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.stat-bars li {
  display: grid;
  grid-template-columns: 74px 1fr 52px;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  font-weight: 700;
}
.stat-bars b {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.sbar {
  height: 8px;
  border-radius: 4px;
  background: var(--meter-track);
  overflow: hidden;
}
.sbar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  transition: width 0.5s ease;
}
.s-happiness { background: var(--stat-happiness); }
.s-health { background: var(--stat-health); }
.s-smarts { background: var(--stat-smarts); }
.s-looks { background: var(--stat-looks); }
.s-rel { background: var(--stat-rel); }
.life-facts {
  margin: 0;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--meter-track);
}
.life-facts div {
  display: grid;
  grid-template-columns: 74px 1fr;
  gap: 10px;
  font-size: 12.5px;
}
.life-facts dt {
  font-weight: 700;
  color: var(--ink-soft);
}
.life-facts dd {
  margin: 0;
  font-weight: 700;
  min-width: 0;
}
.people li {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 10px;
  align-items: center;
  font-size: 12.5px;
}
.people li span:first-child {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.people small {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.people li.gone {

}
.life-log li {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 8px;
  font-size: 12.5px;
  line-height: 1.4;
}
.log-age {

  min-width: 24px;

  border-radius: 9px;

  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

/* Character creation */
.life-create {
  display: grid;
  gap: 12px;
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  align-items: end;
}
.field {
  display: grid;
  gap: 5px;
  margin: 0;
  padding: 0;
  border: 0;
  min-width: 0;
}
.field > span,
.field legend {
  padding: 0;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.field legend small {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 700;
}
.field input {
  width: 100%;

  font: 700 14px/1 var(--font-body);
  color: var(--ink);
  background: var(--press);
  border: 1.5px solid var(--meter-track);
  border-radius: 11px;
  padding: 9px 10px;
}
.field input:focus {
  outline: 2px solid var(--focus);
  border-color: transparent;
}
.seg {
  display: flex;
  gap: 4px;
  padding: 3px;
  border-radius: 12px;
  background: var(--meter-track);
}
.seg button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  border-radius: 9px;
  padding: 7px 4px;
  font: 700 12px/1 var(--font-body);
  cursor: pointer;
}
.seg button[aria-pressed='true'] {
  background: var(--press);
  box-shadow: var(--shadow);
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.swatch {
  appearance: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--panel-edge);
  background: var(--c);
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(60, 40, 90, 0.2);
}
.swatch[aria-pressed='true'] {
  outline: 3px solid var(--focus);
  outline-offset: 1px;
}
.chips {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.chip {
  appearance: none;
  border: 1.5px solid var(--meter-track);
  background: transparent;
  color: var(--ink);
  border-radius: 12px;
  padding: 8px 10px;
  text-align: left;
  font: 800 13px/1.2 var(--font-body);
  cursor: pointer;
  display: grid;
  gap: 2px;
}
.chip small {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.chip[aria-pressed='true'] {
  background: var(--press);
  border-color: var(--stat-rel);
  box-shadow: var(--shadow);
}

/* Event card */
.life-card {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
  transform: translateX(-50%);
  width: min(430px, calc(100vw - 32px));
  max-height: calc(100% - 210px);
  overflow-y: auto;
  padding: 14px 16px 16px;
  border-radius: 24px;
  z-index: 6;
  display: grid;
  gap: 10px;
  animation: card-in 0.35s cubic-bezier(0.3, 1.4, 0.5, 1);
}
@keyframes card-in {
  from {
    transform: translate(-50%, 16px) scale(0.96);
    opacity: 0;
  }
}
.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-soft);
}
.card-head svg {
  border-radius: 50%;
  flex: none;
}
.later {
  margin-left: auto;
  appearance: none;
  border: 0;
  background: var(--meter-track);
  color: var(--ink);
  border-radius: 10px;
  padding: 6px 10px;
  font: 800 11.5px/1 var(--font-body);
  cursor: pointer;
}
.life-card h3 {
  margin: 0;
  font: 600 18px/1.2 var(--font-display);
}
.bubble {
  margin: 0;
  padding: 12px 14px;
  border-radius: 6px 18px 18px 18px;
  background: var(--bubble);
  box-shadow: 0 1px 3px rgba(84, 70, 130, 0.12);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.45;
}
.bubble.reply {
  border-radius: 18px 6px 18px 18px;
  background: var(--avatar-bg);
}
.choices {
  display: grid;
  gap: 6px;
}
.choice {
  appearance: none;
  border: 1.5px solid var(--meter-track);
  background: var(--press);
  color: var(--ink);
  border-radius: 14px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: center;
  text-align: left;
  font: 800 13.5px/1.3 var(--font-body);
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.choice:hover {
  border-color: var(--stat-rel);
  transform: translateX(2px);
}
.choice kbd {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--meter-track);
  font: 800 11px/1 var(--font-body);
  color: var(--ink-soft);
}
.deltas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.delta {
  padding: 5px 9px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.delta.up {
  background: rgba(143, 208, 165, 0.35);
}
.delta.down {
  background: rgba(243, 154, 154, 0.35);
}

@media (max-width: 560px) {
  .stats {
    column-gap: 12px;
    padding: 8px 12px 8px 9px;
  }

    width: 28px;

  }

    font-size: 17px;

  }

  }
  .field-row {
    grid-template-columns: 1fr 1fr auto;
  }
  .toolbar {
    gap: 2px;
    padding: 5px;
  }
  .tool {
    width: 46px;
    font-size: 10px;
  }
  .tool-icon {
    width: 34px;
    height: 34px;
    border-radius: 12px;
  }
  .tool-icon svg {
    width: 20px;
    height: 20px;
  }
  .toast {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  }
}
/* Phones (portrait or landscape) and short windows: two buttons up top, everything else in the sheet */
@media (max-width: 760px), (max-height: 520px) {

  #btn-view,
  #btn-fit,
  #btn-random {

  }

    display: inline-flex;
  }
  .corner {

    top: calc(env(safe-area-inset-top, 0px) + 12px);

    column-gap: 10px;
    padding: 8px 12px 8px 9px;
  }
  .stat-badge {
    width: 28px;
    height: 28px;
    border-radius: 10px;
  }
  .stat-badge svg {
    width: 17px;
    height: 17px;
  }
  .stat-value {
    font-size: 17px;
  }
  .stat-label {
    font-size: 9.5px;
  }
  .clock {
    font-size: 10.5px;
  }
}
@media (max-width: 400px) {
  .stat-value small {
    display: none;
  }
  .stat-label {
    letter-spacing: 0.02em;
    font-size: 9px;
  }
  .stat {
    gap: 6px;
  }
}
@media (max-width: 340px) {
  .stat-label {
    display: none;
  }
  .stats {

    padding: 6px 10px 6px 7px;
  }
  .stat-badge {
    width: 24px;
    height: 24px;
    border-radius: 8px;
  }
  .stat-value {
    font-size: 15px;
  }
}

/* Landscape phones: slim toolbar, panels fit between the top bar and the toolbar */
@media (max-height: 520px) {

    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    gap: 2px;
    padding: 4px;
    border-radius: 20px;
  }

    width: 46px;
    padding: 4px 0;
    border-radius: 16px;
  }

    width: min(400px, calc(100vw - 24px));

  }
  .more-sheet h2 {

  }
  .seg.big button {

  }
  .legend {
    top: auto;

  }
  .inspector,
  .life-panel {

  .inspector {
    left: calc(env(safe-area-inset-left, 0px) + 12px);

  .life-panel {

    right: calc(env(safe-area-inset-right, 0px) + 12px);

  }
  .life-card {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
    max-height: calc(100% - 76px);

}

@media (max-width: 360px) {
  .tool {
    width: 40px;
  }
  .tool-label {
    font-size: 9px;

}
@media (pointer: coarse) {

@media (prefers-reduced-motion: reduce) {

    transition: none;
  }

  .life-card {
    animation: none;
  }
}

(() => {
// ---- config.js ----
const __mod_config = (() => {

// ---- state.js ----
const __mod_state = (() => {
// City State: the single source of truth. Tiles own their world state; no drawing or timing logic lives here.

const { STRUCTURES, VARIANT_KEYS, DEFAULT_MAP_SIZE } = __mod_config;
// Neighbour directions with the road-connection bit each one sets: N, E, S, W.
const DIRS = [
  { dx: 0, dy: -1, bit: 1 },
  { dx: 1, dy: 0, bit: 2 },
  { dx: 0, dy: 1, bit: 4 },
  { dx: -1, dy: 0, bit: 8 },
];

function createTile(x, y) {
  return {
    x,
    y,
    terrain: 'grass', // 'grass' | 'water'
    structure: null, // { id, type, residents, variant?, floors?, shape? }
    roadMask: 0, // derived: which neighbours are connected road
    desirability: 0, // derived by the simulation
    factors: {}, // derived: per-factor desirability breakdown
    housingTarget: 0, // derived: how many residents this home can attract right now
    employment: 0, // derived: share of this home's workers who have a job (0..1)
    workersFilled: 0, // derived: jobs filled at this workplace
    congestion: 0, // derived: road load (0..1)
    coverage: {}, // derived: service id → coverage (0..1)
  };
}

class CityState {
  constructor(width = DEFAULT_MAP_SIZE, height = DEFAULT_MAP_SIZE) {
    this.width = width;
    this.height = height;
    this.tiles = [];
    this.clock = 0.3;
    this.day = 1;
    this.nextId = 1;
    this.stats = { population: 0, capacity: 0, occupancy: 0, happiness: 0, homes: 0 };
    this.systems = {}; // saved per-system data for future modules (economy, utilities…)
    this.derived = {}; // recomputed every few ticks and never saved (labor market, flows…)
    this.dirty = true; // derived data needs recomputing
    this.revision = 0; // bumps on every tile change, so caches know when to redraw
    this._listeners = new Set();
    this._buildTiles();
  }

  _buildTiles() {
    this.tiles = [];
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) this.tiles.push(createTile(x, y));
    }
  }

  on(fn) {
    this._listeners.add(fn);
    return () => this._listeners.delete(fn);
  }

  emit(type, data = {}) {
    const ev = { type, ...data };
    for (const fn of this._listeners) fn(ev);
  }

  inBounds(x, y) {
    return x >= 0 && y >= 0 && x < this.width && y < this.height;
  }

  getTile(x, y) {
    return this.inBounds(x, y) ? this.tiles[y * this.width + x] : null;
  }

  isRoad(x, y) {
    const t = this.getTile(x, y);
    return !!t && t.structure?.type === 'road';
  }

  roadNeighbors(x, y) {
    const out = [];
    for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) out.push({ x: x + d.dx, y: y + d.dy });
    return out;
  }

  isWalkable(x, y) {
    const t = this.getTile(x, y);
    if (!t || t.terrain !== 'grass') return false;
    return !t.structure || !!STRUCTURES[t.structure.type].walkable;
  }

  homes() {
    return this.tiles.filter((t) => t.structure && STRUCTURES[t.structure.type].capacity > 0);
  }

  workplaces() {
    return this.tiles.filter((t) => t.structure && STRUCTURES[t.structure.type].jobs > 0);
  }

  // The road tile a building uses to reach the network: an adjacent road, if any.
  accessRoad(x, y) {
    for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) return this.getTile(x + d.dx, y + d.dy);
    return null;
  }

  canApply(tool, x, y) {
    const t = this.getTile(x, y);
    if (!t) return false;
    if (tool === 'bulldoze') return !!t.structure || t.terrain === 'water';
    if (tool === 'water') return t.terrain !== 'water' || !!t.structure;
    if (!STRUCTURES[tool]) return false;
    return t.structure?.type !== tool;
  }

  // The one entry point for player edits. Returns true when the city changed.
  apply(tool, x, y) {
    if (!this.canApply(tool, x, y)) return false;
    const t = this.getTile(x, y);
    const previous = t.structure;
    if (tool === 'bulldoze') {
      if (t.structure) t.structure = null;
      else t.terrain = 'grass';
      this._changed(x, y);
      this.emit('removed', { x, y, previous, wasWater: !previous });
      return true;
    }
    if (tool === 'water') {
      t.structure = null;
      t.terrain = 'water';
      this._changed(x, y);
      this.emit('watered', { x, y, previous });
      return true;
    }
    t.terrain = 'grass';
    t.structure = this.createStructure(tool);
    this._changed(x, y);
    this.emit('placed', { x, y, structure: t.structure, previous });
    return true;
  }

  createStructure(type, rand = Math.random) {
    const s = { id: this.nextId++, type, residents: 0 };
    if (type === 'house' || type === 'tower' || type === 'shop' || type === 'office') s.variant = VARIANT_KEYS[Math.floor(rand() * VARIANT_KEYS.length)];
    if (type === 'tower') s.floors = 4 + Math.floor(rand() * 3);
    if (type === 'office') s.floors = 3 + Math.floor(rand() * 3);
    if (type === 'tree') s.shape = Math.floor(rand() * 4);
    return s;
  }

  _changed(x, y) {
    this.dirty = true;
    this.revision++;
    this.updateRoadMask(x, y);
    for (const d of DIRS) this.updateRoadMask(x + d.dx, y + d.dy);
  }

  updateRoadMask(x, y) {
    const t = this.getTile(x, y);
    if (!t) return;
    let m = 0;
    if (t.structure?.type === 'road') for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) m |= d.bit;
    t.roadMask = m;
  }

  refreshAllRoadMasks() {
    this.revision++;
    for (const t of this.tiles) this.updateRoadMask(t.x, t.y);
  }

  // Wipe every tile but keep time of day.
  reset() {
    this._buildTiles();
    this.dirty = true;
    this.revision++;
  }

  // Grow or shrink the map. Existing tiles move by (offsetX, offsetY), so a town can be re-centred.
  resize(width, height, offsetX = 0, offsetY = 0) {
    const tiles = [];
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const old = this.getTile(x - offsetX, y - offsetY);
        tiles.push(old ? Object.assign(old, { x, y }) : createTile(x, y));
      }
    }
    this.width = width;
    this.height = height;
    this.tiles = tiles;
    this.refreshAllRoadMasks();
    this.dirty = true;
    this.emit('resized', { width, height });
  }

  toJSON() {
    return {
      width: this.width,
      height: this.height,
      clock: this.clock,
      day: this.day,
      nextId: this.nextId,
      systems: this.systems,
      tiles: this.tiles.map((t) => ({ terrain: t.terrain, structure: t.structure ? { ...t.structure } : null })),
    };
  }

  static fromJSON(d) {
    const city = new CityState(d.width | 0 || DEFAULT_MAP_SIZE, d.height | 0 || DEFAULT_MAP_SIZE);
    city.clock = Number.isFinite(d.clock) ? d.clock : 0.3;
    city.day = d.day | 0 || 1;
    city.nextId = d.nextId | 0 || 1;

      const t = city.tiles[i];

      t.terrain = src.terrain === 'water' ? 'water' : 'grass';
      const s = src.structure;
      if (s && STRUCTURES[s.type]) {
        const cap = STRUCTURES[s.type].capacity;
        t.structure = { ...s, id: s.id || city.nextId++, residents: Math.max(0, Math.min(cap, s.residents | 0)) };
      }
    });
    city.refreshAllRoadMasks();
    return city;
  }
}

return { DIRS, CityState };
})();

// ---- utils.js ----
const __mod_utils = (() => {
// Small pure helpers shared by every system.

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

// Deterministic 0..1 noise per tile, so decoration stays put between frames and reloads.
function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function rand() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pickWeighted(items, weightOf, rand = Math.random) {
  let total = 0;
  for (const it of items) total += Math.max(0, weightOf(it));
  if (total <= 0) return null;
  let r = rand() * total;
  for (const it of items) {
    r -= Math.max(0, weightOf(it));
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function pick(items, rand = Math.random) {
  return items[Math.floor(rand() * items.length)];
}

return { clamp, lerp, smoothstep, hash2, mulberry32, pickWeighted, pick };
})();

// ---- desirability.js ----
const __mod_desirability = (() => {
// Desirability: how much people want to live on a tile. Each factor is an independent, pluggable function.
// To add a system later (services, jobs, pollution…), implement its `compute` and flip `enabled`.

const { STRUCTURES, SERVICES } = __mod_config;
const { clamp } = __mod_utils;
const BASE = 0.28;

function sumAround(city, tile, radius, valueOf) {
  let sum = 0;
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (!dx && !dy) continue;
      const n = city.getTile(tile.x + dx, tile.y + dy);
      if (!n) continue;
      const dist = Math.hypot(dx, dy);
      if (dist > radius + 0.5) continue;
      sum += valueOf(n) * (1 - dist / (radius + 1.5));
    }
  }
  return sum;
}

const FACTORS = [
  {
    id: 'greenery',
    label: 'Parks & trees',
    enabled: true,
    compute: (city, tile) =>
      Math.min(0.35, sumAround(city, tile, 3, (n) => (n.structure ? STRUCTURES[n.structure.type].greenery * 0.06 : 0))),
  },
  {
    id: 'waterfront',
    label: 'Water views',
    enabled: true,
    compute: (city, tile) => Math.min(0.08, sumAround(city, tile, 2, (n) => (n.terrain === 'water' ? 0.04 : 0))),
  },
  {
    id: 'access',
    label: 'Road access',
    enabled: true,
    compute: (city, tile) => {
      let best = 9;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          if (city.isRoad(tile.x + dx, tile.y + dy)) best = Math.min(best, Math.abs(dx) + Math.abs(dy));
        }
      }
      return best <= 1 ? 0.1 : best <= 2 ? 0.04 : -0.08;
    },
  },
  {
    id: 'services',
    label: 'Schools & clinics',
    enabled: true,
    compute: (city, tile) => {
      let sum = 0;
      for (const s of SERVICES) sum += tile.coverage[s.id] || 0;
      return 0.16 * (sum / SERVICES.length);
    },
  },
  {
    id: 'employment',
    label: 'Jobs',
    enabled: true,
    // Homes rate their own residents' job prospects; empty lots rate jobs within reach.
    compute: (city, tile) => {
      if (tile.structure && STRUCTURES[tile.structure.type].capacity > 0 && tile.structure.residents > 0) {
        return 0.16 * tile.employment;
      }
      const jobs = city.derived.labor;
      if (!jobs || !jobs.jobs) return 0;
      return 0.16 * Math.min(1, (jobs.jobs - jobs.employed) / Math.max(4, jobs.employed * 0.15));
    },
  },
  {
    id: 'traffic',
    label: 'Traffic',
    enabled: true,
    compute: (city, tile) => {
      let worst = 0;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const n = city.getTile(tile.x + dx, tile.y + dy);
          if (!n || !n.roadMask) continue;
          const d = Math.max(Math.abs(dx), Math.abs(dy));
          worst = Math.max(worst, n.congestion * (1 - d / 3));
        }
      }
      return -0.14 * worst;
    },
  },
  { id: 'pollution', label: 'Pollution', enabled: false, compute: () => 0 },
  { id: 'safety', label: 'Safety', enabled: false, compute: () => 0 },
  { id: 'overcrowding', label: 'Overcrowding', enabled: false, compute: () => 0 },
  { id: 'walkability', label: 'Walkability', enabled: false, compute: () => 0 },
  { id: 'utilities', label: 'Utilities', enabled: false, compute: () => 0 },
  { id: 'entertainment', label: 'Entertainment', enabled: false, compute: () => 0 },

function recomputeDesirability(city) {
  for (const tile of city.tiles) {
    let d = BASE;

      factors[f.id] = v;

})();

// ---- labor.js ----
const __mod_labor = (() => {
// Labor market and traffic. Residents look for the nearest jobs they can reach by road; each
// commute then loads the road tiles along its route. Adapted from Cimulity's aggregate
// nearest-with-overflow matching (MIT, github.com/zeikar/cimulity).

const { STRUCTURES, WORKER_SHARE, ROAD_CAPACITY } = __mod_config;
function workersIn(home) {
  return Math.round(home.structure.residents * WORKER_SHARE);
}

// Returns { flows, employed, unemployed, jobs } and writes per-tile employment, workersFilled
// and congestion. Each flow is { from, to, count, path } where path lists road tiles.
function computeLaborMarket(city) {
  const W = city.width;
  const size = W * city.height;
  const homes = city.homes();
  const workplaces = city.workplaces();

  // Remaining capacity per access road (several workplaces can share one).
  const capacity = new Map();
  const destinations = new Map(); // access road index → workplace tiles
  let jobs = 0;
  for (const w of workplaces) {
    const cap = STRUCTURES[w.structure.type].jobs;
    jobs += cap;
    w.workersFilled = 0;
    const road = city.accessRoad(w.x, w.y);
    if (!road) continue;
    const k = road.y * W + road.x;
    capacity.set(k, (capacity.get(k) || 0) + cap);
    if (!destinations.has(k)) destinations.set(k, []);
    destinations.get(k).push(w);
  }

  const load = new Float32Array(size);
  const flows = [];
  let employed = 0;
  let unemployed = 0;
  const prev = new Int32Array(size);
  const seen = new Uint32Array(size);
  let stamp = 0;

  // Process homes in a stable order so results don't jitter between ticks.
  const origins = homes
    .map((h) => ({ h, workers: workersIn(h), road: city.accessRoad(h.x, h.y) }))
    .sort((a, b) => a.h.y * W + a.h.x - (b.h.y * W + b.h.x));

  for (const o of origins) {
    o.h.employment = 0;
    if (o.workers <= 0) continue;
    if (!o.road) {
      unemployed += o.workers;
      continue;
    }
    let left = o.workers;
    stamp++;
    const start = o.road.y * W + o.road.x;
    const queue = [start];
    seen[start] = stamp;
    prev[start] = -1;
    for (let qi = 0; qi < queue.length && left > 0; qi++) {
      const k = queue[qi];
      const cap = capacity.get(k);
      if (cap > 0) {
        const take = Math.min(cap, left);
        capacity.set(k, cap - take);
        left -= take;
        const path = [];
        for (let p = k; p !== -1; p = prev[p]) {
          path.push(p);
          load[p] += take;
        }
        path.reverse();
        flows.push({ from: start, to: k, count: take, path });
        let remaining = take;
        for (const w of destinations.get(k)) {
          const room = STRUCTURES[w.structure.type].jobs - w.workersFilled;
          const add = Math.min(room, remaining);
          w.workersFilled += add;
          remaining -= add;
          if (!remaining) break;
        }
      }
      const x = k % W;
      const y = (k - x) / W;
      for (const [dx, dy] of [
        [0, -1],
        [1, 0],
        [0, 1],
        [-1, 0],
      ]) {
        if (!city.isRoad(x + dx, y + dy)) continue;
        const n = (y + dy) * W + x + dx;
        if (seen[n] === stamp) continue;
        seen[n] = stamp;
        prev[n] = k;
        queue.push(n);
      }
    }
    employed += o.workers - left;
    unemployed += left;
    o.h.employment = (o.workers - left) / o.workers;
  }

  for (let i = 0; i < size; i++) city.tiles[i].congestion = Math.min(1, load[i] / ROAD_CAPACITY);
  return { flows, employed, unemployed, jobs };
}

return { workersIn, computeLaborMarket };
})();

// ---- coverage.js ----
const __mod_coverage = (() => {
// Service coverage: each school or clinic covers the tiles around it, strongest nearby.

const { STRUCTURES, SERVICES } = __mod_config;
function computeCoverage(city) {
  for (const t of city.tiles) {
    const c = {};
    for (const s of SERVICES) c[s.id] = 0;
    t.coverage = c;
  }
  for (const src of city.tiles) {
    const def = src.structure && STRUCTURES[src.structure.type];
    if (!def?.service) continue;
    const r = def.radius;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const t = city.getTile(src.x + dx, src.y + dy);
        if (!t) continue;
        const d = Math.hypot(dx, dy);
        if (d > r) continue;
        const v = 1 - (d / (r + 1)) ** 2;
        if (v > t.coverage[def.service]) t.coverage[def.service] = v;
      }
    }
  }
}

return { computeCoverage };
})();

// ---- agents.js ----
const __mod_agents = (() => {
// Agents: cars and pedestrians that make the simulation visible. They read the city and are never
// directly controlled. Positions are in grid units; the renderer decides how they look.

const { CAR_COLORS, SHIRT_COLORS, SKIN_TONES } = __mod_config;
const { DIRS } = __mod_state;
const { pick, pickWeighted } = __mod_utils;
const MAX_CARS = 70;
const MAX_WALKERS = 60;

// How busy commuting is at this time of day: morning and evening rush hours, quiet nights.
function commuteActivity(clock) {
  const peak = (c, w) => Math.exp(-(((clock - c) / w) ** 2));
  return Math.min(1, 0.12 + 0.88 * peak(0.33, 0.05) + 0.88 * peak(0.73, 0.05) + 0.3 * peak(0.52, 0.12));
}

class AgentSystem {
  constructor(city) {
    this.city = city;
    this.cars = [];
    this.walkers = [];
    this.time = 0;
    this._carTimer = 0;
    this._walkTimer = 0;
    city.on((ev) => {
      if (ev.type === 'reset' || ev.type === 'loaded') this.clear();
    });
  }

  clear() {
    this.cars.length = 0;
    this.walkers.length = 0;
  }

  update(dt, daylight) {
    this.time += dt;
    this._carTimer -= dt;
    this._walkTimer -= dt;
    this.updateCars(dt, daylight);
    this.updateWalkers(dt, daylight);
  }

  get commuters() {
    return this.cars.filter((c) => c.route && !c.leaving).length;
  }

  // ---- Cars -------------------------------------------------------------

  // Cruising cars scale with the road network; commuters follow the labor market's routes.
  desiredCars(daylight) {
    let roads = 0;
    for (const t of this.city.tiles) if (t.roadMask) roads++;
    if (roads < 2) return { cruising: 0, commuting: 0 };
    const cruising = Math.round(
      Math.min(Math.floor(roads / 6), 2 + Math.floor(this.city.stats.population / 25), 20) * (0.35 + 0.65 * daylight)
    );
    const employed = this.city.derived.labor?.employed || 0;
    const commuting = Math.round(Math.min(MAX_CARS - 20, employed / 5) * commuteActivity(this.city.clock));
    return { cruising, commuting };
  }

  updateCars(dt, daylight) {
    const want = this.desiredCars(daylight);
    const active = this.cars.filter((c) => !c.leaving);
    const commuting = active.filter((c) => c.route).length;
    const cruising = active.length - commuting;
    if (this._carTimer <= 0) {
      if (commuting < want.commuting && this.spawnCommuter()) this._carTimer = 0.18;
      else if (cruising < want.cruising) {
        this.spawnCar();
        this._carTimer = 0.4;
      } else if (cruising > want.cruising) {
        active.find((c) => !c.route).leaving = true;
        this._carTimer = 0.6;
      }
    }
    for (const c of this.cars) this.stepCar(c, dt);
    this.cars = this.cars.filter((c) => !c.dead);
  }

  // Pick a commute weighted by how many people make it. Mornings head to work, evenings home.
  spawnCommuter() {
    const flows = this.city.derived.labor?.flows;
    if (!flows || !flows.length) return false;
    const flow = pickWeighted(flows, (f) => (f.path.length > 1 ? f.count : 0));
    if (!flow) return false;
    const W = this.city.width;
    const homeward = this.city.clock > 0.55 || (this.city.clock > 0.42 && Math.random() < 0.5);
    const route = (homeward ? flow.path.slice().reverse() : flow.path).map((k) => ({ x: k % W, y: Math.floor(k / W) }));
    const [a, b] = route;
    this.cars.push({
      x: a.x,
      y: a.y,
      px: a.x,
      py: a.y,
      nx: b.x,
      ny: b.y,
      route,
      ri: 1,
      t: 0,
      speed: 1.1 + Math.random() * 0.5,
      color: pick(CAR_COLORS),
      alpha: 0,
      leaving: false,
      dead: false,
    });
    return true;
  }

  spawnCar() {
    const roads = this.city.tiles.filter((t) => t.roadMask);
    if (!roads.length) return;
    const start = pick(roads);
    const next = pick(this.city.roadNeighbors(start.x, start.y));
    this.cars.push({
      x: start.x,
      y: start.y,
      px: start.x,
      py: start.y,
      nx: next.x,
      ny: next.y,
      t: Math.random() * 0.5,
      speed: 0.9 + Math.random() * 0.5,
      color: pick(CAR_COLORS),
      alpha: 0,
      leaving: false,
      dead: false,
    });
  }

  stepCar(c, dt) {
    const city = this.city;
    if (!city.isRoad(c.x, c.y) || !city.isRoad(c.nx, c.ny)) c.leaving = true; // road was bulldozed under it
    c.alpha = c.leaving ? c.alpha - dt * 2.5 : Math.min(1, c.alpha + dt * 2);
    if (c.leaving && c.alpha <= 0) {
      c.dead = true;
      return;
    }
    if (!city.isRoad(c.nx, c.ny)) return;
    // Busy roads slow everyone down.
    const jam = city.getTile(c.x, c.y)?.congestion || 0;
    c.t += c.speed * (1 - 0.55 * jam) * dt;
    while (c.t >= 1) {
      c.t -= 1;
      c.px = c.x;
      c.py = c.y;
      c.x = c.nx;
      c.y = c.ny;
      if (c.route) {
        const next = c.route[++c.ri];
        if (!next || !city.isRoad(next.x, next.y)) {
          c.leaving = true; // arrived
          c.t = 0;
          c.nx = c.x + (c.x - c.px);
          c.ny = c.y + (c.y - c.py);
          if (!city.isRoad(c.nx, c.ny)) {
            c.nx = c.x;
            c.ny = c.y;
          }
          break;
        }
        c.nx = next.x;
        c.ny = next.y;
        continue;
      }
      const options = city.roadNeighbors(c.x, c.y).filter((n) => !(n.x === c.px && n.y === c.py));
      const next = options.length ? pick(options) : { x: c.px, y: c.py };
      if (!city.isRoad(next.x, next.y)) {
        c.leaving = true;
        c.t = 0;
        break;
      }
      c.nx = next.x;
      c.ny = next.y;
    }
  }

  // Grid-space pose of a car, keeping to the right-hand lane.
  carPose(c) {
    const dx = c.nx - c.x;
    const dy = c.ny - c.y;
    const lane = 0.16;
    return {
      gx: c.x + dx * c.t + 0.5 - dy * lane,
      gy: c.y + dy * c.t + 0.5 + dx * lane,
      dx,
      dy,
    };
  }

  // ---- Pedestrians -----------------------------------------------------

  desiredWalkers(daylight) {
    const pop = this.city.stats.population;
    return Math.round(Math.min(MAX_WALKERS, pop / 4) * (0.15 + 0.85 * daylight));
  }

  updateWalkers(dt, daylight) {
    const active = this.walkers.filter((w) => !w.leaving).length;
    if (active < this.desiredWalkers(daylight) && this._walkTimer <= 0) {
      this.spawnWalker();
      this._walkTimer = 0.45;
    }
    for (const w of this.walkers) this.stepWalker(w, dt);
    this.walkers = this.walkers.filter((w) => !w.dead);
  }

  spawnWalker() {
    const homes = this.city.homes().filter((h) => h.structure.residents > 0);
    const home = pickWeighted(homes, (h) => h.structure.residents);
    if (!home) return;
    const path = this.findOuting(home);
    if (!path) return;
    this.walkers.push({
      home: { x: home.x, y: home.y },
      path,
      i: 0,
      t: 0,
      state: 'out',
      wait: 0,
      speed: 0.5 + Math.random() * 0.3,
      ox: (Math.random() - 0.5) * 0.44,
      oy: (Math.random() - 0.5) * 0.44,
      shirt: pick(SHIRT_COLORS),
      skin: pick(SKIN_TONES),
      phase: Math.random() * Math.PI * 2,
      alpha: 0,
      gx: home.x + 0.5,
      gy: home.y + 0.5,
      moving: true,
      leaving: false,
      dead: false,
    });
  }

  // Residents prefer parks, then trees, then any open ground within a short stroll.
  findOuting(home) {
    const city = this.city;
    const key = (x, y) => y * city.width + x;
    const prev = new Map([[key(home.x, home.y), null]]);
    const queue = [{ x: home.x, y: home.y, d: 0 }];
    const reachable = [];
    while (queue.length) {
      const cur = queue.shift();
      if (cur.d >= 9) continue;
      for (const dir of DIRS) {
        const nx = cur.x + dir.dx;
        const ny = cur.y + dir.dy;
        const k = key(nx, ny);
        if (prev.has(k) || !city.isWalkable(nx, ny)) continue;
        prev.set(k, cur);
        const n = { x: nx, y: ny, d: cur.d + 1 };
        queue.push(n);
        reachable.push(n);
      }
    }
    const dest = pickWeighted(reachable, (n) => {
      const type = city.getTile(n.x, n.y).structure?.type;
      if (type === 'park') return 8;
      if (type === 'tree') return 2;
      if (type === 'road') return 0.15;
      return 0.4;
    });
    if (!dest) return null;
    const path = [];
    for (let n = dest; n; n = prev.get(key(n.x, n.y))) path.unshift({ x: n.x, y: n.y });
    return path;
  }

  stepWalker(w, dt) {
    const city = this.city;
    w.alpha = w.leaving ? w.alpha - dt * 2 : Math.min(1, w.alpha + dt * 2);
    if (w.leaving && w.alpha <= 0) {
      w.dead = true;
      return;
    }
    if (w.state === 'linger') {
      w.moving = false;
      w.wait -= dt;
      const end = w.path[w.path.length - 1];
      if (!city.isWalkable(end.x, end.y)) w.leaving = true; // something was built where they stood
      const drift = this.time * 0.35 + w.phase;
      w.gx = end.x + 0.5 + w.ox + Math.sin(drift) * 0.12;
      w.gy = end.y + 0.5 + w.oy + Math.cos(drift * 0.8) * 0.12;
      w.moving = Math.abs(Math.cos(drift)) > 0.4;
      if (w.wait <= 0) {
        w.state = 'back';
        w.path = w.path.slice().reverse();
        w.i = 0;
        w.t = 0;
      }
      return;
    }
    const a = w.path[w.i];
    const b = w.path[w.i + 1];
    if (!b) {
      if (w.state === 'out') {
        const type = city.getTile(a.x, a.y)?.structure?.type;
        w.state = 'linger';
        w.wait = type === 'park' ? 5 + Math.random() * 8 : 2 + Math.random() * 3;
      } else {
        w.leaving = true; // home again
      }
      return;
    }
    const isHome = b.x === w.home.x && b.y === w.home.y;
    if (!isHome && !city.isWalkable(b.x, b.y)) {
      w.leaving = true;
      return;
    }
    w.moving = true;
    w.t += w.speed * dt;
    if (w.t >= 1) {
      w.t -= 1;
      w.i++;
    }
    const p = w.path[w.i];
    const q = w.path[w.i + 1] || p;
    // Fade the personal offset in and out so walkers leave and enter through the middle of a home.
    const atHomeEnd = (n) => n.x === w.home.x && n.y === w.home.y;
    const offsetScale = Math.min(1, (atHomeEnd(p) ? w.t : 1) * (atHomeEnd(q) ? 1 - w.t : 1) * 3);
    w.gx = p.x + (q.x - p.x) * w.t + 0.5 + w.ox * offsetScale;
    w.gy = p.y + (q.y - p.y) * w.t + 0.5 + w.oy * offsetScale;
  }
}


return { commuteActivity, AgentSystem };
})();

// ---- lifeEngine.js ----
const __mod_lifeEngine = (() => {
// Life event engine: decides which events can happen, fills in their text, rolls outcomes and
// applies their effects. Events themselves are data in lifeEvents.js.

const { stageFor } = __mod_lifeData;
const { pickWeighted } = __mod_utils;
const STAT_KEYS = ['happiness', 'health', 'smarts', 'looks'];
const STAT_LABELS = { happiness: 'Happiness', health: 'Health', smarts: 'Smarts', looks: 'Looks', money: 'Money' };
const DEFAULT_COOLDOWN = 4; // years before a repeatable event can return

function isEligible(ev, ctx) {
  const c = ctx.char;
  if (ev.stages && !ev.stages.includes(stageFor(c.age).id)) return false;
  if (ev.minAge != null && c.age < ev.minAge) return false;
  if (ev.maxAge != null && c.age > ev.maxAge) return false;
  const last = c.seen[ev.id];
  if (last != null) {
    if (ev.once) return false;
    if (c.age - last < (ev.cooldown ?? DEFAULT_COOLDOWN)) return false;
  }
  if (ev.when && !ev.when(ctx)) return false;
  if (ev.choices && typeof ev.choices === 'function' && !ev.choices(ctx).length) return false;
  return true;
}

function pickEvent(events, ctx, rng = Math.random) {
  const pool = events.filter((ev) => isEligible(ev, ctx));
  return pickWeighted(pool, (ev) => (typeof ev.weight === 'function' ? ev.weight(ctx) : ev.weight ?? 1), rng);
}

// Replace {name}, {they}, {friend}… with values; {They} capitalises.
function fill(text, vars) {
  return text.replace(/\{(\w+)\}/g, (m, key) => {
    const lower = key[0].toLowerCase() + key.slice(1);
    const v = vars[key] ?? vars[lower];
    if (v == null) return m;
    return key[0] === key[0].toUpperCase() && key !== lower ? String(v)[0].toUpperCase() + String(v).slice(1) : String(v);
  });
}

function choicesFor(ev, ctx) {
  const list = typeof ev.choices === 'function' ? ev.choices(ctx) : ev.choices;
  return list.map((ch, i) => ({ label: ch.label, data: ch.data ?? null, index: i }));
}

// Pick an outcome for a choice. Outcome weights may depend on traits and stats.
function rollOutcome(ev, choiceIndex, data, ctx, rng = Math.random) {
  if (ev.outcome) return ev.outcome(ctx, data, rng);
  const choice = ev.choices[choiceIndex];
  return pickWeighted(choice.outcomes, (o) => (typeof o.weight === 'function' ? o.weight(ctx) : o.weight ?? 1), rng);
}

function clampStat(v) {
  return Math.max(0, Math.min(100, Math.round(v)));
}

// Apply an outcome's effects. Returns the visible changes for the outcome card.
function applyEffects(effects = {}, ctx) {
  const c = ctx.char;
  const changes = [];
  for (const k of STAT_KEYS) {
    if (!effects[k]) continue;
    const before = c.stats[k];
    c.stats[k] = clampStat(before + effects[k]);
    if (c.stats[k] !== before) changes.push({ key: k, delta: c.stats[k] - before });
  }
  if (effects.money) {
    const before = c.money;
    c.money = Math.max(0, Math.round(c.money + effects.money));
    if (c.money !== before) changes.push({ key: 'money', delta: c.money - before });
  }
  if (effects.rel) {
    for (const [who, d] of Object.entries(effects.rel)) {
      const person = ctx.person(who);
      if (!person) continue;
      person.closeness = clampStat(person.closeness + d);
      changes.push({ key: 'rel', who: person.name, delta: d });
    }
  }
  for (const f of effects.set || []) c.flags[f] = true;
  for (const f of effects.unset || []) delete c.flags[f];
  return changes;
}

return { STAT_KEYS, STAT_LABELS, isEligible, pickEvent, fill, choicesFor, rollOutcome, applyEffects };
})();

  {

  {
    id: 'job_hunt',
    stages: ['young', 'adult'],
    minAge: 18,
    maxAge: 62,
    weight: 4,
    cooldown: 1,
    when: (ctx) => !ctx.char.job,
    title: 'Looking for work',
    text: '{name} is looking for a job. These workplaces in the city are hiring:',
    choices: (ctx) => {
      const jobs = ctx.openJobs();
      const seenTypes = new Set();
      const picks = [];
      for (const t of jobs) {
        if (seenTypes.has(t.structure.type)) continue;
        seenTypes.add(t.structure.type);
        const career = CAREERS[t.structure.type];
        picks.push({ label: `${career.titles[0]} at ${place(t)} · $${career.pay[0].toLocaleString()}/yr`, data: { x: t.x, y: t.y } });
        if (picks.length === 3) break;
      }
      return [...picks, { label: picks.length ? 'Keep looking' : 'Nothing is hiring. Wait and see', data: null }];
    },
    outcome: (ctx, data, rng) => {
      if (!data) {
        return ctx.openJobs().length
          ? o('{name} decided to hold out for something better.', { happiness: -2 })
          : o('No one in town is hiring. (Shops, offices, schools and clinics create jobs.)', { happiness: -5 });
      }
      const t = ctx.city.getTile(data.x, data.y);
      const career = t?.structure && CAREERS[t.structure.type];
      if (!career) return o('That workplace closed before the interview.', { happiness: -3 });
      const need = career.smarts;
      const odds = Math.min(0.95, 0.35 + (ctx.char.stats.smarts - need) / 50 + (ctx.char.flags.graduated ? 0.15 : 0));
      if (rng() < odds) return o(`{name} got the job as ${career.titles[0].toLowerCase()} at ${place(t)}!`, { happiness: 8 }, { do: (c) => c.takeJob(t) });
      return o(`The ${STRUCTURES[t.structure.type].label.toLowerCase()} went with someone else. ${need ? 'More Smarts would help.' : ''}`, { happiness: -4 });
    },
  },

  },
  {
    id: 'checkup',
    stages: ['adult', 'senior'],
    minAge: 50,
    cooldown: 3,
    text: 'It\'s time for {name}\'s yearly check-up.',
    choices: [
      {
        label: 'Go to the clinic',
        outcomes: [
          o('The clinic nearby caught a problem early.', { health: 8 }, { weight: (c) => (c.facts.clinicCoverage > 0.25 ? 4 : 0) }),

  {

  {

  update(dt) {

    const step = Math.min(dt, 0.25) * this.speed;
    if (!step) return;
    city.clock += step / DAY_LENGTH_SECONDS;
    if (city.clock >= 1) {
      city.clock -= 1;
      city.day++;

    this._acc += step;
    while (this._acc >= SIM_STEP) {
      this._acc -= SIM_STEP;
      this.tick();
    }
    this.agents.update(step, daylightAt(city.clock));
    this.life.update(step);
  }

  tick() {
    const city = this.city;
    this._marketTimer -= SIM_STEP;
    // Jobs, traffic and desirability feed each other, so refresh them together about once a second.
    if (city.dirty || this._marketTimer <= 0) {
      if (city.dirty) computeCoverage(city);
      city.derived.labor = computeLaborMarket(city);
      recomputeDesirability(city);
      this._marketTimer = 1;
    }
    this.updateHousing();
    this.updateStats();
  }

    computeCoverage(this.city);
    this.city.derived.labor = computeLaborMarket(this.city);
    recomputeDesirability(this.city);
    this.updateStats();
  }

    const homes = city.homes();
    for (const h of homes) h.housingTarget = this.targetResidents(h);

    // Residents drift away from homes that are less appealing than they used to be.
    for (const h of homes) {
      const s = h.structure;
      if (s.residents > h.housingTarget && Math.random() < 0.1) {
        s.residents--;
        city.emit('movedOut', { x: h.x, y: h.y });

    // Newcomers choose among vacancies, favouring the most desirable homes.
    const open = homes.filter((h) => h.structure.residents < h.housingTarget);
    if (!open.length) return;
    const attempts = 1 + Math.floor(open.length / 8);
    for (let i = 0; i < attempts; i++) {
      if (Math.random() > 0.3) continue;
      const h = pickWeighted(open, (c) => (c.housingTarget - c.structure.residents) * c.desirability ** 2);
      if (!h || h.structure.residents >= h.housingTarget) continue;
      h.structure.residents++;

    let capacity = 0;

      capacity,
      homes: homes.length,

      employed: labor.employed,
      employment: workers ? labor.employed / workers : 1,
