<title>Pocket Metropolis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: the city fills the screen edge to edge; the interface floats on top like stickers on glass. */
:root {
  --sky: #dcf0f2;
  --panel: rgba(255, 252, 250, 0.8);
  --panel-edge: rgba(255, 255, 255, 0.95);
  --ink: #4b4468;
  --ink-soft: #8b84a6;
  --press: #ffffff;
  --meter-track: rgba(75, 68, 104, 0.1);
  --meter: #8fd0a5;
  --focus: #9f86d6;
  --shadow: 0 8px 24px rgba(84, 70, 130, 0.16), 0 1px 3px rgba(84, 70, 130, 0.12);
  --tint-house: #ffb5a7;
  --tint-tower: #cdb4db;
  --tint-tree: #a8d5a2;
  --tint-park: #b8e0d2;
  --tint-road: #d6d0c4;
  --tint-water: #7ec8e3;
  --tint-bulldoze: #fcd5ce;
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --sky: #2c2e58;
    --panel: rgba(46, 42, 82, 0.78);
    --panel-edge: rgba(255, 255, 255, 0.14);
    --ink: #f4effc;
    --ink-soft: #b9b1d8;
    --press: rgba(255, 255, 255, 0.16);
    --meter-track: rgba(255, 255, 255, 0.14);
    --focus: #d7c6ff;
    --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --sky: #2c2e58;
  --panel: rgba(46, 42, 82, 0.78);
  --panel-edge: rgba(255, 255, 255, 0.14);
  --ink: #f4effc;
  --ink-soft: #b9b1d8;
  --press: rgba(255, 255, 255, 0.16);
  --meter-track: rgba(255, 255, 255, 0.14);
  --focus: #d7c6ff;
  --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: fixed;
  inset: 0;
}
#city {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}
#city:active {
  cursor: grabbing;
}

.glass {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  backdrop-filter: blur(14px) saturate(1.3);
}

/* Stats bubble */
.stats {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: grid;
  grid-template-columns: auto auto;
  column-gap: 18px;
  row-gap: 6px;
  padding: 10px 16px 10px 12px;
  border-radius: 22px;
  pointer-events: none;
}
.stat {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-badge {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 12px;
  color: #5a4a62;
}
.stat-badge svg {
  width: 20px;
  height: 20px;
}
.badge-pop {
  background: var(--tint-house);
}
.badge-mood {
  background: var(--tint-park);
}
.stat-text {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
}
.stat-value {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.stat-value small {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-left: 1px;
}
.stat-label {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}
.meter {
  width: 100%;
  height: 4px;
  margin-top: 3px;
  border-radius: 4px;
  background: var(--meter-track);
  overflow: hidden;
}
.meter span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--meter);
  transition: width 0.6s ease;
}
.clock {
  grid-column: 1 / -1;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  padding-left: 2px;
}

/* Corner buttons */
.corner {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  display: flex;
  gap: 8px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 42px;
  padding: 0 16px 0 12px;
  border-radius: 21px;
  color: var(--ink);
  font: 800 13.5px/1 var(--font-body);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.pill svg {
  width: 20px;
  height: 20px;
}
.pill:hover {
  transform: translateY(-1px);
}
.pill:active {
  transform: translateY(1px) scale(0.97);
}
.pill.icon-only {
  width: 42px;
  padding: 0;
  justify-content: center;
}
.dice {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  background: var(--tint-tower);
  color: #4f3f62;
}
.dice svg {
  width: 18px;
  height: 18px;
}

/* Toolbar */
.toolbar {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 26px;
  max-width: calc(100vw - 32px);
}
.tool {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 58px;
  padding: 6px 0 5px;
  border-radius: 20px;
  cursor: pointer;
  font: 800 11px/1 var(--font-body);
  letter-spacing: 0.02em;
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.15s ease;
}
.tool-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 14px;
  color: #4d4360;
  background: var(--tint);
  box-shadow: inset 0 -3px 0 rgba(70, 50, 90, 0.12);
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.tool-icon svg {
  width: 22px;
  height: 22px;
}
.tool-label {
  color: var(--ink-soft);
}
.tool:hover .tool-icon {
  transform: translateY(-2px);
}
.tool[aria-pressed='true'] {
  background: var(--press);
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}
.tool[aria-pressed='true'] .tool-icon {
  transform: scale(1.06);
}
.tool[aria-pressed='true'] .tool-label {
  color: var(--ink);
}
.tint-inspect { --tint: #e8e4f4; }
.tint-house { --tint: var(--tint-house); }
.tint-tower { --tint: var(--tint-tower); }
.tint-shop { --tint: #ffd9a8; }
.tint-office { --tint: #c9dcf2; }
.tint-school { --tint: #ffc9b9; }
.tint-clinic { --tint: #c4ead9; }
.tint-tree { --tint: var(--tint-tree); }
.tint-park { --tint: var(--tint-park); }
.tint-road { --tint: var(--tint-road); }
.tint-water { --tint: var(--tint-water); }
.tint-bulldoze { --tint: var(--tint-bulldoze); }

.tool {
  position: relative;
}
.more {
  position: absolute;
  top: 5px;
  right: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-soft);
  opacity: 0.55;
}

/* Tool tray: sub-tools for a group, floating above the toolbar */
.tray {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 22px;
  z-index: 3;
}
.tray-item {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 64px;
  padding: 6px 0;
  border-radius: 16px;
  cursor: pointer;
  font: 800 11px/1 var(--font-body);
}
.tray-item[aria-pressed='true'] {
  background: var(--press);
  box-shadow: var(--shadow);
}
.tray-item kbd {
  font: 700 9.5px/1 var(--font-body);
  color: var(--ink-soft);
  border: 1px solid var(--meter-track);
  border-radius: 5px;
  padding: 2px 4px;
}

/* Speed and view pills */
#btn-speed.is-paused,
#btn-view.is-on {
  background: var(--press);
  outline: 2px solid var(--tint-tower);
}

/* Legend for data views */
.legend {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 112px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: grid;
  gap: 4px;
  width: 210px;
  padding: 10px 14px;
  border-radius: 18px;
  pointer-events: none;
}
.legend-title {
  font: 600 15px/1.1 var(--font-display);
}
.legend-sub {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.legend-bar {
  height: 8px;
  border-radius: 4px;
  margin-top: 2px;
}
.legend-bar.ramp {
  background: linear-gradient(90deg, #f68c8c, #ffd678, #6ec896);
}
.legend-bar.ramp-rev {
  background: linear-gradient(90deg, #6ec896, #ffd678, #f68c8c);
}
.legend-bar.service {
  background: linear-gradient(90deg, rgba(70, 60, 110, 0.25), #c8b4ec, #8cdcc0);
}
.legend-ends {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
}

/* Inspector card */
.inspector {
  position: absolute;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  width: 290px;
  max-height: calc(100% - 260px);
  overflow-y: auto;
  padding: 14px 16px 12px;
  border-radius: 22px;
  display: grid;
  gap: 10px;
  z-index: 2;
}
.inspector header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.insp-kicker {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.inspector h2 {
  margin: 2px 0 0;
  font: 600 20px/1.1 var(--font-display);
}
.insp-close {
  appearance: none;
  border: 0;
  background: var(--meter-track);
  color: var(--ink);
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.insp-close svg {
  width: 16px;
  height: 16px;
}
.inspector dl {
  margin: 0;
  display: grid;
  gap: 4px;
}
.inspector dl div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
}
.inspector dt {
  color: var(--ink-soft);
  font-weight: 700;
}
.inspector dd {
  margin: 0;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.insp-score {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 8px;
  border-top: 1px solid var(--meter-track);
  font-weight: 800;
  font-size: 13px;
}
.insp-score strong {
  font: 600 22px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.factors {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
}
.factors li {
  display: grid;
  grid-template-columns: 1fr 70px 30px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
}
.fbar {
  height: 6px;
  border-radius: 3px;
  background: var(--meter-track);
  overflow: hidden;
}
.fbar span {
  display: block;
  height: 100%;
  border-radius: inherit;
}
.fbar .pos {
  background: var(--meter);
}
.fbar .neg {
  background: #f39a9a;
}
.fval {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
}
.insp-note {
  margin: 0;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}

button:focus-visible {
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
}

/* Toast */
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 112px);
  transform: translate(-50%, 8px);
  max-width: calc(100vw - 48px);
  padding: 9px 16px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 560px) {
  .stats {
    column-gap: 12px;
    padding: 8px 12px 8px 9px;
  }
  .stat-badge {
    width: 28px;
    height: 28px;
    border-radius: 10px;
  }
  .stat-value {
    font-size: 17px;
  }
  .pill-text {
    display: none;
  }
  .pill {
    width: 42px;
    padding: 0;
    justify-content: center;
  }
  .corner {
    flex-direction: column;
  }
  .legend {
    top: calc(env(safe-area-inset-top, 0px) + 100px);
    width: 180px;
  }
  .inspector {
    left: 12px;
    right: 12px;
    width: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    max-height: 46%;
  }
  .tray {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
  }
  .tray-item {
    width: 58px;
  }
  .toolbar {
    gap: 2px;
    padding: 5px;
  }
  .tool {
    width: 46px;
    font-size: 10px;
  }
  .tool-icon {
    width: 34px;
    height: 34px;
    border-radius: 12px;
  }
  .tool-icon svg {
    width: 20px;
    height: 20px;
  }
  .toast {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  }
}
@media (max-width: 360px) {
  .tool {
    width: 40px;
  }
  .tool-label {
    font-size: 9px;
  }
}
@media (pointer: coarse) {
  .tray-item kbd {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tool,
  .tool-icon,
  .pill,
  .toast,
  .meter span {
    transition: none;
  }
}

</style>

<script>
'use strict';
(() => {
// ---- config.js ----
const __mod_config = (() => {
// Static game data. Systems read from here; nothing in this file holds mutable state.

const TILE_W = 64;
const TILE_H = 32;
const DEFAULT_MAP_SIZE = 32;
const SAVE_VERSION = 2;
const DAY_LENGTH_SECONDS = 300; // one full day/night cycle
const SIM_STEP = 0.25; // fixed simulation tick, in seconds

const PALETTE = {
  grass: '#a8d5a2',
  water: '#7ec8e3',
  road: '#d6d0c4',
  peach: '#ffb5a7',
  blush: '#fcd5ce',
  mint: '#b8e0d2',
  lavender: '#cdb4db',
  sidewalk: '#ece7dd',
  sand: '#efe3c8',
  earth: '#d2b89c',
  earthDark: '#b09379',
  leaf: '#93cf98',
  leafLight: '#b9e4ab',
  leafDeep: '#76b585',
  blossom: '#f7c6cf',
  blossomLight: '#fde0e5',
  trunk: '#b99679',
  parkGrass: '#b9e2ad',
  path: '#efe6d6',
  stone: '#f1ece4',
  glass: '#e5eff5',
  windowLit: '#ffe29a',
  pole: '#9d97b6',
  lampOff: '#efe9f6',
  lampOn: '#fff4c9',
  marking: '#fbf8f2',
};

const BUILDING_VARIANTS = {
  peach: { wall: PALETTE.peach, roof: '#e9968c', trim: '#fff1ec' },
  blush: { wall: PALETTE.blush, roof: '#e6a79e', trim: '#fff7f4' },
  mint: { wall: PALETTE.mint, roof: '#8ec3af', trim: '#f2fbf7' },
  lavender: { wall: PALETTE.lavender, roof: '#a991c4', trim: '#f8f2fb' },
};
const VARIANT_KEYS = Object.keys(BUILDING_VARIANTS);

// Structure definitions. `capacity` > 0 makes a structure housing; `jobs` > 0 makes it a workplace;
// `service` names the coverage it provides; `greenery` feeds desirability.
// Future per-structure data (upkeep, power draw, pollution, …) belongs here.
const STRUCTURES = {
  house: { label: 'House', capacity: 4, jobs: 0, greenery: 0, height: 27 },
  tower: { label: 'Tower', capacity: 16, jobs: 0, greenery: 0, height: 70 },

const __mod_state = (() => {
// City State: the single source of truth. Tiles own their world state; no drawing or timing logic lives here.

const { STRUCTURES, VARIANT_KEYS, DEFAULT_MAP_SIZE } = __mod_config;
// Neighbour directions with the road-connection bit each one sets: N, E, S, W.
const DIRS = [
  { dx: 0, dy: -1, bit: 1 },
  { dx: 1, dy: 0, bit: 2 },
  { dx: 0, dy: 1, bit: 4 },
  { dx: -1, dy: 0, bit: 8 },
];

function createTile(x, y) {
  return {
    x,
    y,
    terrain: 'grass', // 'grass' | 'water'
    structure: null, // { id, type, residents, variant?, floors?, shape? }
    roadMask: 0, // derived: which neighbours are connected road
    desirability: 0, // derived by the simulation
    factors: {}, // derived: per-factor desirability breakdown
    housingTarget: 0, // derived: how many residents this home can attract right now
    employment: 0, // derived: share of this home's workers who have a job (0..1)
    workersFilled: 0, // derived: jobs filled at this workplace
    congestion: 0, // derived: road load (0..1)
    coverage: {}, // derived: service id → coverage (0..1)
  };
}

class CityState {
  constructor(width = DEFAULT_MAP_SIZE, height = DEFAULT_MAP_SIZE) {
    this.width = width;
    this.height = height;
    this.tiles = [];
    this.clock = 0.3;
    this.day = 1;
    this.nextId = 1;
    this.stats = { population: 0, capacity: 0, occupancy: 0, happiness: 0, homes: 0 };
    this.systems = {}; // saved per-system data for future modules (economy, utilities…)
    this.derived = {}; // recomputed every few ticks and never saved (labor market, flows…)
    this.dirty = true; // derived data needs recomputing
    this.revision = 0; // bumps on every tile change, so caches know when to redraw
    this._listeners = new Set();
    this._buildTiles();
  }

  _buildTiles() {
    this.tiles = [];
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) this.tiles.push(createTile(x, y));
    }
  }

  on(fn) {
    this._listeners.add(fn);
    return () => this._listeners.delete(fn);
  }

  emit(type, data = {}) {
    const ev = { type, ...data };
    for (const fn of this._listeners) fn(ev);
  }

  inBounds(x, y) {
    return x >= 0 && y >= 0 && x < this.width && y < this.height;
  }

  getTile(x, y) {
    return this.inBounds(x, y) ? this.tiles[y * this.width + x] : null;
  }

  isRoad(x, y) {
    const t = this.getTile(x, y);
    return !!t && t.structure?.type === 'road';
  }

  roadNeighbors(x, y) {
    const out = [];
    for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) out.push({ x: x + d.dx, y: y + d.dy });
    return out;
  }

  isWalkable(x, y) {
    const t = this.getTile(x, y);
    if (!t || t.terrain !== 'grass') return false;
    return !t.structure || !!STRUCTURES[t.structure.type].walkable;
  }

  homes() {
    return this.tiles.filter((t) => t.structure && STRUCTURES[t.structure.type].capacity > 0);
  }

  workplaces() {
    return this.tiles.filter((t) => t.structure && STRUCTURES[t.structure.type].jobs > 0);
  }

  // The road tile a building uses to reach the network: an adjacent road, if any.
  accessRoad(x, y) {
    for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) return this.getTile(x + d.dx, y + d.dy);
    return null;
  }

  canApply(tool, x, y) {
    const t = this.getTile(x, y);
    if (!t) return false;
    if (tool === 'bulldoze') return !!t.structure || t.terrain === 'water';
    if (tool === 'water') return t.terrain !== 'water' || !!t.structure;
    if (!STRUCTURES[tool]) return false;
    return t.structure?.type !== tool;
  }

  // The one entry point for player edits. Returns true when the city changed.
  apply(tool, x, y) {
    if (!this.canApply(tool, x, y)) return false;
    const t = this.getTile(x, y);
    const previous = t.structure;
    if (tool === 'bulldoze') {
      if (t.structure) t.structure = null;
      else t.terrain = 'grass';
      this._changed(x, y);
      this.emit('removed', { x, y, previous, wasWater: !previous });
      return true;
    }
    if (tool === 'water') {
      t.structure = null;
      t.terrain = 'water';
      this._changed(x, y);
      this.emit('watered', { x, y, previous });
      return true;
    }
    t.terrain = 'grass';
    t.structure = this.createStructure(tool);
    this._changed(x, y);
    this.emit('placed', { x, y, structure: t.structure, previous });
    return true;
  }

  createStructure(type, rand = Math.random) {
    const s = { id: this.nextId++, type, residents: 0 };
    if (type === 'house' || type === 'tower' || type === 'shop' || type === 'office') s.variant = VARIANT_KEYS[Math.floor(rand() * VARIANT_KEYS.length)];
    if (type === 'tower') s.floors = 4 + Math.floor(rand() * 3);
    if (type === 'office') s.floors = 3 + Math.floor(rand() * 3);
    if (type === 'tree') s.shape = Math.floor(rand() * 4);
    return s;
  }

  _changed(x, y) {
    this.dirty = true;
    this.revision++;
    this.updateRoadMask(x, y);
    for (const d of DIRS) this.updateRoadMask(x + d.dx, y + d.dy);
  }

  updateRoadMask(x, y) {
    const t = this.getTile(x, y);
    if (!t) return;
    let m = 0;
    if (t.structure?.type === 'road') for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) m |= d.bit;
    t.roadMask = m;
  }

  refreshAllRoadMasks() {
    this.revision++;
    for (const t of this.tiles) this.updateRoadMask(t.x, t.y);
  }

  // Wipe every tile but keep time of day.
  reset() {
    this._buildTiles();
    this.dirty = true;
    this.revision++;
  }

  // Grow or shrink the map. Existing tiles move by (offsetX, offsetY), so a town can be re-centred.
  resize(width, height, offsetX = 0, offsetY = 0) {
    const tiles = [];
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const old = this.getTile(x - offsetX, y - offsetY);
        tiles.push(old ? Object.assign(old, { x, y }) : createTile(x, y));
      }
    }
    this.width = width;
    this.height = height;
    this.tiles = tiles;
    this.refreshAllRoadMasks();
    this.dirty = true;
    this.emit('resized', { width, height });
  }

  toJSON() {
    return {
      width: this.width,
      height: this.height,
      clock: this.clock,
      day: this.day,
      nextId: this.nextId,
      systems: this.systems,
      tiles: this.tiles.map((t) => ({ terrain: t.terrain, structure: t.structure ? { ...t.structure } : null })),
    };
  }

  static fromJSON(d) {
    const city = new CityState(d.width | 0 || DEFAULT_MAP_SIZE, d.height | 0 || DEFAULT_MAP_SIZE);
    city.clock = Number.isFinite(d.clock) ? d.clock : 0.3;

      const t = city.tiles[i];

      const s = src.structure;
      if (s && STRUCTURES[s.type]) {
        const cap = STRUCTURES[s.type].capacity;

      }
    });

    return city;
  }
}

return { DIRS, CityState };
})();

// ---- utils.js ----
const __mod_utils = (() => {
// Small pure helpers shared by every system.

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

// Deterministic 0..1 noise per tile, so decoration stays put between frames and reloads.
function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function rand() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pickWeighted(items, weightOf, rand = Math.random) {
  let total = 0;
  for (const it of items) total += Math.max(0, weightOf(it));
  if (total <= 0) return null;
  let r = rand() * total;
  for (const it of items) {
    r -= Math.max(0, weightOf(it));
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function pick(items, rand = Math.random) {
  return items[Math.floor(rand() * items.length)];
}

return { clamp, lerp, smoothstep, hash2, mulberry32, pickWeighted, pick };
})();

// ---- desirability.js ----
const __mod_desirability = (() => {
// Desirability: how much people want to live on a tile. Each factor is an independent, pluggable function.
// To add a system later (services, jobs, pollution…), implement its `compute` and flip `enabled`.

const { STRUCTURES, SERVICES } = __mod_config;
const { clamp } = __mod_utils;
const BASE = 0.28;

function sumAround(city, tile, radius, valueOf) {
  let sum = 0;
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (!dx && !dy) continue;
      const n = city.getTile(tile.x + dx, tile.y + dy);
      if (!n) continue;
      const dist = Math.hypot(dx, dy);
      if (dist > radius + 0.5) continue;
      sum += valueOf(n) * (1 - dist / (radius + 1.5));
    }
  }
  return sum;
}

const FACTORS = [
  {
    id: 'greenery',
    label: 'Parks & trees',
    enabled: true,
    compute: (city, tile) =>
      Math.min(0.35, sumAround(city, tile, 3, (n) => (n.structure ? STRUCTURES[n.structure.type].greenery * 0.06 : 0))),
  },
  {
    id: 'waterfront',
    label: 'Water views',
    enabled: true,
    compute: (city, tile) => Math.min(0.08, sumAround(city, tile, 2, (n) => (n.terrain === 'water' ? 0.04 : 0))),
  },
  {
    id: 'access',
    label: 'Road access',
    enabled: true,
    compute: (city, tile) => {
      let best = 9;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          if (city.isRoad(tile.x + dx, tile.y + dy)) best = Math.min(best, Math.abs(dx) + Math.abs(dy));
        }
      }
      return best <= 1 ? 0.1 : best <= 2 ? 0.04 : -0.08;
    },
  },
  {
    id: 'services',
    label: 'Schools & clinics',
    enabled: true,
    compute: (city, tile) => {
      let sum = 0;
      for (const s of SERVICES) sum += tile.coverage[s.id] || 0;
      return 0.16 * (sum / SERVICES.length);
    },
  },
  {
    id: 'employment',
    label: 'Jobs',
    enabled: true,
    // Homes rate their own residents' job prospects; empty lots rate jobs within reach.
    compute: (city, tile) => {
      if (tile.structure && STRUCTURES[tile.structure.type].capacity > 0 && tile.structure.residents > 0) {
        return 0.16 * tile.employment;
      }
      const jobs = city.derived.labor;
      if (!jobs || !jobs.jobs) return 0;
      return 0.16 * Math.min(1, (jobs.jobs - jobs.employed) / Math.max(4, jobs.employed * 0.15));
    },
  },
  {
    id: 'traffic',
    label: 'Traffic',
    enabled: true,
    compute: (city, tile) => {
      let worst = 0;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const n = city.getTile(tile.x + dx, tile.y + dy);
          if (!n || !n.roadMask) continue;
          const d = Math.max(Math.abs(dx), Math.abs(dy));
          worst = Math.max(worst, n.congestion * (1 - d / 3));
        }
      }
      return -0.14 * worst;
    },
  },
  { id: 'pollution', label: 'Pollution', enabled: false, compute: () => 0 },
  { id: 'safety', label: 'Safety', enabled: false, compute: () => 0 },
  { id: 'overcrowding', label: 'Overcrowding', enabled: false, compute: () => 0 },
  { id: 'walkability', label: 'Walkability', enabled: false, compute: () => 0 },
  { id: 'utilities', label: 'Utilities', enabled: false, compute: () => 0 },
  { id: 'entertainment', label: 'Entertainment', enabled: false, compute: () => 0 },

  for (const tile of city.tiles) {
    let d = BASE;

    tile.factors = factors;

})();

// ---- labor.js ----
const __mod_labor = (() => {
// Labor market and traffic. Residents look for the nearest jobs they can reach by road; each
// commute then loads the road tiles along its route. Adapted from Cimulity's aggregate
// nearest-with-overflow matching (MIT, github.com/zeikar/cimulity).

const { STRUCTURES, WORKER_SHARE, ROAD_CAPACITY } = __mod_config;
function workersIn(home) {
  return Math.round(home.structure.residents * WORKER_SHARE);
}

// Returns { flows, employed, unemployed, jobs } and writes per-tile employment, workersFilled
// and congestion. Each flow is { from, to, count, path } where path lists road tiles.
function computeLaborMarket(city) {
  const W = city.width;
  const size = W * city.height;
  const homes = city.homes();
  const workplaces = city.workplaces();

  // Remaining capacity per access road (several workplaces can share one).
  const capacity = new Map();
  const destinations = new Map(); // access road index → workplace tiles
  let jobs = 0;
  for (const w of workplaces) {
    const cap = STRUCTURES[w.structure.type].jobs;
    jobs += cap;
    w.workersFilled = 0;
    const road = city.accessRoad(w.x, w.y);
    if (!road) continue;
    const k = road.y * W + road.x;
    capacity.set(k, (capacity.get(k) || 0) + cap);
    if (!destinations.has(k)) destinations.set(k, []);
    destinations.get(k).push(w);
  }

  const load = new Float32Array(size);
  const flows = [];
  let employed = 0;
  let unemployed = 0;
  const prev = new Int32Array(size);
  const seen = new Uint32Array(size);
  let stamp = 0;

  // Process homes in a stable order so results don't jitter between ticks.
  const origins = homes
    .map((h) => ({ h, workers: workersIn(h), road: city.accessRoad(h.x, h.y) }))
    .sort((a, b) => a.h.y * W + a.h.x - (b.h.y * W + b.h.x));

  for (const o of origins) {
    o.h.employment = 0;
    if (o.workers <= 0) continue;
    if (!o.road) {
      unemployed += o.workers;
      continue;
    }
    let left = o.workers;
    stamp++;
    const start = o.road.y * W + o.road.x;
    const queue = [start];
    seen[start] = stamp;
    prev[start] = -1;
    for (let qi = 0; qi < queue.length && left > 0; qi++) {
      const k = queue[qi];
      const cap = capacity.get(k);
      if (cap > 0) {
        const take = Math.min(cap, left);
        capacity.set(k, cap - take);
        left -= take;
        const path = [];
        for (let p = k; p !== -1; p = prev[p]) {
          path.push(p);
          load[p] += take;
        }
        path.reverse();
        flows.push({ from: start, to: k, count: take, path });
        let remaining = take;
        for (const w of destinations.get(k)) {
          const room = STRUCTURES[w.structure.type].jobs - w.workersFilled;
          const add = Math.min(room, remaining);
          w.workersFilled += add;
          remaining -= add;
          if (!remaining) break;
        }
      }
      const x = k % W;
      const y = (k - x) / W;
      for (const [dx, dy] of [
        [0, -1],
        [1, 0],
        [0, 1],
        [-1, 0],
      ]) {
        if (!city.isRoad(x + dx, y + dy)) continue;
        const n = (y + dy) * W + x + dx;
        if (seen[n] === stamp) continue;
        seen[n] = stamp;
        prev[n] = k;
        queue.push(n);
      }
    }
    employed += o.workers - left;
    unemployed += left;
    o.h.employment = (o.workers - left) / o.workers;
  }

  for (let i = 0; i < size; i++) city.tiles[i].congestion = Math.min(1, load[i] / ROAD_CAPACITY);
  return { flows, employed, unemployed, jobs };
}

return { workersIn, computeLaborMarket };
})();

// ---- coverage.js ----
const __mod_coverage = (() => {
// Service coverage: each school or clinic covers the tiles around it, strongest nearby.

const { STRUCTURES, SERVICES } = __mod_config;
function computeCoverage(city) {
  for (const t of city.tiles) {
    const c = {};
    for (const s of SERVICES) c[s.id] = 0;
    t.coverage = c;
  }
  for (const src of city.tiles) {
    const def = src.structure && STRUCTURES[src.structure.type];
    if (!def?.service) continue;
    const r = def.radius;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const t = city.getTile(src.x + dx, src.y + dy);
        if (!t) continue;
        const d = Math.hypot(dx, dy);
        if (d > r) continue;
        const v = 1 - (d / (r + 1)) ** 2;
        if (v > t.coverage[def.service]) t.coverage[def.service] = v;
      }
    }
  }
}

return { computeCoverage };
})();

const __mod_agents = (() => {
// Agents: cars and pedestrians that make the simulation visible. They read the city and are never
// directly controlled. Positions are in grid units; the renderer decides how they look.

const { CAR_COLORS, SHIRT_COLORS, SKIN_TONES } = __mod_config;

const MAX_CARS = 70;
const MAX_WALKERS = 60;

// How busy commuting is at this time of day: morning and evening rush hours, quiet nights.
function commuteActivity(clock) {
  const peak = (c, w) => Math.exp(-(((clock - c) / w) ** 2));
  return Math.min(1, 0.12 + 0.88 * peak(0.33, 0.05) + 0.88 * peak(0.73, 0.05) + 0.3 * peak(0.52, 0.12));

class AgentSystem {
  constructor(city) {
    this.city = city;
    this.cars = [];
    this.walkers = [];
    this.time = 0;
    this._carTimer = 0;
    this._walkTimer = 0;
    city.on((ev) => {
      if (ev.type === 'reset' || ev.type === 'loaded') this.clear();
    });
  }

  clear() {
    this.cars.length = 0;
    this.walkers.length = 0;

    this._carTimer -= dt;
    this._walkTimer -= dt;
    this.updateCars(dt, daylight);
    this.updateWalkers(dt, daylight);
  }

  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const x = (p[0] - p[1]) * HALF_W;
    const y = (p[0] + p[1]) * HALF_H - (p[2] || 0);
    if (i) ctx.lineTo(x, y);
    else ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function tilePoly(ctx, x, y, inset = 0) {
  poly(ctx, [
    [x + inset, y + inset],
    [x + 1 - inset, y + inset],
    [x + 1 - inset, y + 1 - inset],
    [x + inset, y + 1 - inset],
  ]);
}

function edgeStrip(x, y, e, w0, w1) {
  return [
    [x + e.a[0] + e.n[0] * w0, y + e.a[1] + e.n[1] * w0],
    [x + e.b[0] + e.n[0] * w0, y + e.b[1] + e.n[1] * w0],
    [x + e.b[0] + e.n[0] * w1, y + e.b[1] + e.n[1] * w1],
    [x + e.a[0] + e.n[0] * w1, y + e.a[1] + e.n[1] * w1],
  ];
}

function gridEllipse(ctx, gx, gy, z, r) {
  const p = gridToWorld(gx, gy, z);
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, r * HALF_W * Math.SQRT2, r * HALF_H * Math.SQRT2, 0, 0, Math.PI * 2);
}

function convexHull(points) {
  const pts = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

// A soft round shadow drawn once and stamped under every building.
let contactCanvas = null;
function contactSprite() {
  if (contactCanvas) return contactCanvas;
  contactCanvas = document.createElement('canvas');
  contactCanvas.width = contactCanvas.height = 64;
  const c = contactCanvas.getContext('2d');
  const grad = c.createRadialGradient(32, 32, 9.6, 32, 32, 32);
  grad.addColorStop(0, 'rgba(52,44,96,0.26)');
  grad.addColorStop(1, 'rgba(52,44,96,0)');
  c.fillStyle = grad;
  c.fillRect(0, 0, 64, 64);
  return contactCanvas;
}

// Low → high: blush red, butter yellow, mint green.
function rampColor(v, alpha) {
  const t = Math.max(0, Math.min(1, v));
  const stops = [
    [0, [246, 140, 140]],
    [0.5, [255, 214, 120]],
    [1, [110, 200, 150]],
  ];
  const i = t < 0.5 ? 0 : 1;
  const [a0, c0] = stops[i];
  const [a1, c1] = stops[i + 1];
  const k = (t - a0) / (a1 - a0);
  const c = c0.map((v0, j) => Math.round(v0 + (c1[j] - v0) * k));
  return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}

class Renderer {
  constructor(canvas, city, camera, agents) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.city = city;
    this.camera = camera;
    this.agents = agents;
    this.w = 1;
    this.h = 1;
    this.dpr = 1;
    this.time = 0;
    this.bounces = new Map();
    this.particles = [];
    this.glows = [];
    this.reduceMotion = !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    this.ground = { canvas: null, key: '' };
    city.on((ev) => this.onCityEvent(ev));
  }

  resize(w, h) {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.w = w;
    this.h = h;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
  }

  // ---- Event-driven effects ------------------------------------------------

  onCityEvent(ev) {
    const key = `${ev.x},${ev.y}`;
    switch (ev.type) {
      case 'placed': {
        const t = ev.structure.type;
        if (t === 'road' || t === 'park') this.ring(ev.x, ev.y, '#ffffff');
        if (t !== 'road') this.bounces.set(key, { start: this.time, delay: 0, kind: 'pop' });
        break;
      }
      case 'removed':
        this.bounces.delete(key);
        if (ev.wasWater) this.ring(ev.x, ev.y, '#ffffff');
        else this.dust(ev.x, ev.y, ev.previous?.type === 'tower' ? 16 : 10);
        break;
      case 'watered':
        this.bounces.delete(key);
        if (ev.previous) this.dust(ev.x, ev.y, 8);
        this.ring(ev.x, ev.y, PALETTE.water);
        this.ring(ev.x, ev.y, '#ffffff', 0.15);
        break;
      case 'movedIn':
        if (this.particles.filter((p) => p.kind === 'heart').length < 10) this.heart(ev.x, ev.y);
        break;
      case 'reset':
      case 'loaded':
        this.bounces.clear();
        this.particles.length = 0;
        if (this.reduceMotion) break;
        for (const t of this.city.tiles) {
          if (t.structure && t.structure.type !== 'road') {
            this.bounces.set(`${t.x},${t.y}`, {
              start: this.time,
              delay: (t.x + t.y) * 0.03 + hash2(t.x, t.y, 5) * 0.12,
              kind: 'pop',
            });
          }
        }
        break;
    }
  }

  nudge(x, y) {
    this.bounces.set(`${x},${y}`, { start: this.time, delay: 0, kind: 'wobble' });
  }

  dust(x, y, count) {
    const c = gridToWorld(x + 0.5, y + 0.5);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.5;
      const sp = 14 + Math.random() * 22;
      this.particles.push({
        kind: 'dust',
        x: c.x + Math.cos(a) * 6,
        y: c.y + Math.sin(a) * 3 - 4,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.5 - 12,
        r: 3 + Math.random() * 3.5,
        age: 0,
        life: 0.7 + Math.random() * 0.35,
      });
    }
  }

  ring(x, y, color, delay = 0) {
    this.particles.push({ kind: 'ring', gx: x + 0.5, gy: y + 0.5, color, age: -delay, life: 0.6 });
  }

  heart(x, y) {
    const tile = this.city.getTile(x, y);
    const h = tile?.structure ? STRUCTURES[tile.structure.type].height : 20;
    const p = gridToWorld(x + 0.5, y + 0.5, h * (tile?.structure?.type === 'tower' ? (tile.structure.floors || 5) / 5 : 1) + 6);
    this.particles.push({ kind: 'heart', x: p.x + (Math.random() - 0.5) * 8, y: p.y, age: 0, life: 1.5 });
  }

  bounceFor(x, y) {
    const key = `${x},${y}`;
    const b = this.bounces.get(key);
    if (!b) return { sx: 1, sy: 1, hidden: false };
    const t = (this.time - b.start - b.delay) / (b.kind === 'wobble' ? 0.35 : 0.6);
    if (t < 0) return { sx: 1, sy: 1, hidden: true };
    if (t >= 1) {
      this.bounces.delete(key);
      return { sx: 1, sy: 1, hidden: false };
    }
    if (b.kind === 'wobble') {
      const s = Math.sin(t * 28) * 0.06 * (1 - t);
      return { sx: 1 + s, sy: 1 - s, hidden: false };
    }
    // Squash and stretch: grow from flat, overshoot tall and thin, settle.
    const sy = 1 - Math.exp(-5 * t) * Math.cos(9 * t);
    const sx = clamp(1 + (1 - sy) * 0.5, 0.86, 1.3);
    return { sx, sy: Math.max(0.02, sy), hidden: false };
  }

  // ---- Frame ----------------------------------------------------------------

  render(dt, view) {
    this.time += dt;
    const { ctx, camera: cam, city } = this;
    const L = lightingAt(city.clock);
    this.L = L;
    this.glows.length = 0;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.drawSky(ctx, L);

    const z = cam.zoom;
    ctx.setTransform(this.dpr * z, 0, 0, this.dpr * z, this.dpr * (this.w / 2 - cam.x * z), this.dpr * (this.h / 2 - cam.y * z));
    const rect = {
      left: cam.x - this.w / 2 / z - HALF_W,
      right: cam.x + this.w / 2 / z + HALF_W,
      top: cam.y - this.h / 2 / z - HALF_H,
      bottom: cam.y + this.h / 2 / z + 110,
    };
    const tiles = this.visibleTiles(rect);

    if (this.ensureGround()) {
      this.drawSlabShadow(ctx);
      this.drawCachedGround(ctx, L);
      for (const t of tiles) if (t.terrain === 'water') this.drawWaterMotion(ctx, t, L);
    } else {
      this.drawSlab(ctx, L);
      for (const t of tiles) this.drawGround(ctx, t, L);
    }
    if (view.overlay && view.overlay !== 'none') for (const t of tiles) this.drawOverlay(ctx, t, view.overlay);
    if (view.selected) this.drawSelected(ctx, view.selected);
    if (view.hover) this.drawHover(ctx, view.hover);
    for (const t of tiles) if (t.structure) this.drawShadow(ctx, t, L);

    // Everything with height is depth-sorted together: buildings, props, cars and people.
    const items = [];
    for (const t of tiles) {
      const s = t.structure;
      if (!s) continue;
      if (s.type === 'road') {
        const lamp = this.lampSpot(t);
        if (lamp) items.push({ d: lamp.gx + lamp.gy, kind: 'lamp', t, lamp });
      } else items.push({ d: t.x + t.y + 1, kind: s.type, t });
    }
    for (const c of this.agents.cars) {
      const pose = this.agents.carPose(c);
      items.push({ d: pose.gx + pose.gy + 0.05, kind: 'car', c, pose });
    }
    for (const w of this.agents.walkers) items.push({ d: w.gx + w.gy + 0.05, kind: 'walker', w });
    if (view.ghost) items.push({ d: view.ghost.x + view.ghost.y + 1.01, kind: 'ghost', ghost: view.ghost });
    items.sort((a, b) => a.d - b.d);
    for (const it of items) this.drawItem(ctx, it, L);

    this.drawParticles(ctx, dt, L);
    this.drawGlows(ctx, L);

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.drawVignette(ctx, L);
  }

  // Only walk the slice of the grid that can be on screen, so large maps stay cheap.
  visibleTiles(rect) {
    const city = this.city;
    const corners = [
      worldToGrid(rect.left, rect.top),
      worldToGrid(rect.right, rect.top),
      worldToGrid(rect.left, rect.bottom),
      worldToGrid(rect.right, rect.bottom),
    ];
    const gx0 = Math.max(0, Math.floor(Math.min(...corners.map((c) => c.gx))));
    const gx1 = Math.min(city.width - 1, Math.ceil(Math.max(...corners.map((c) => c.gx))));
    const gy0 = Math.max(0, Math.floor(Math.min(...corners.map((c) => c.gy))));
    const gy1 = Math.min(city.height - 1, Math.ceil(Math.max(...corners.map((c) => c.gy))));
    const out = [];
    for (let y = gy0; y <= gy1; y++) {
      for (let x = gx0; x <= gx1; x++) {
        const c = gridToWorld(x + 0.5, y + 0.5);
        if (c.x < rect.left || c.x > rect.right || c.y < rect.top || c.y > rect.bottom) continue;
        out.push(city.tiles[y * city.width + x]);
      }
    }
    return out;
  }

  // ---- Backdrop ---------------------------------------------------------------

  drawSky(ctx, L) {
    const g = ctx.createLinearGradient(0, 0, 0, this.h);
    g.addColorStop(0, L.skyTop);
    g.addColorStop(1, L.skyBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.w, this.h);

    const starAlpha = clamp(1 - L.daylight / 0.5, 0, 1);
    if (starAlpha > 0) {
      for (let i = 0; i < 60; i++) {
        const sx = hash2(i, 1, 9) * this.w;
        const sy = hash2(i, 2, 9) * this.h * 0.6;
        const tw = 0.6 + 0.4 * Math.sin(this.time * (0.8 + hash2(i, 3, 9)) + i);
        ctx.fillStyle = `rgba(255,248,235,${(starAlpha * tw * (0.35 + hash2(i, 4, 9) * 0.6)).toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(sx, sy, 0.6 + hash2(i, 5, 9) * 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const cloudAlpha = 0.25 + 0.35 * L.daylight;
    for (let i = 0; i < 4; i++) {
      const speed = 6 + i * 2.5;
      const span = this.w + 360;
      const cx = ((hash2(i, 7, 3) * span + this.time * speed) % span) - 180;
      const cy = this.h * (0.07 + 0.11 * i);
      const s = 0.8 + hash2(i, 8, 3) * 0.7;
      ctx.fillStyle = L.daylight > 0.5 ? `rgba(255,255,255,${cloudAlpha})` : `rgba(220,214,245,${cloudAlpha * 0.6})`;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 22 * s, cy + 3, 26 * s, 11 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 18 * s, cy - 8 * s, 24 * s, 15 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Cached ground layer -------------------------------------------------------
  // Terrain, roads and lawns change only when the player edits the map, so they are drawn once
  // into an offscreen canvas at a resolution matched to the zoom. Returns false when the view is
  // zoomed in past what the cache can hold sharply; the caller then draws visible tiles live.
  ensureGround() {
    const city = this.city;
    const W = city.width;
    const H = city.height;
    const worldW = (W + H) * HALF_W;
    const worldH = (W + H) * HALF_H + SLAB_DEPTH + 4;
    const cap = Math.min(MAX_GROUND_PX / worldW, MAX_GROUND_PX / worldH);
    const want = this.camera.zoom * this.dpr;
    if (want > cap * 1.05) return false;
    const scale = Math.min(cap, GROUND_SCALES.find((s) => s >= want * 0.95) || cap);
    const key = `${city.revision}|${W}x${H}|${scale.toFixed(3)}`;
    if (this.ground.key === key) return true;
    const g = this.ground;
    if (!g.canvas) g.canvas = document.createElement('canvas');
    g.canvas.width = Math.ceil(worldW * scale);
    g.canvas.height = Math.ceil(worldH * scale);
    g.left = -H * HALF_W;
    g.top = 0;
    g.scale = scale;
    const c = g.canvas.getContext('2d');
    c.setTransform(scale, 0, 0, scale, -g.left * scale, -g.top * scale);
    c.clearRect(g.left, g.top, worldW, worldH);
    this._caching = true;
    this.drawSlab(c, NEUTRAL_LIGHT, false);
    for (const t of city.tiles) this.drawGround(c, t, NEUTRAL_LIGHT);
    this._caching = false;
    g.key = key;
    return true;
  }

  drawCachedGround(ctx, L) {
    const g = this.ground;
    const W = this.city.width;
    const H = this.city.height;
    ctx.drawImage(g.canvas, g.left, g.top, g.canvas.width / g.scale, g.canvas.height / g.scale);
    const a = L.ambient;
    if (a[0] > 0.995 && a[1] > 0.995 && a[2] > 0.995) return;
    // Apply the frame's light to the whole board in one multiply pass.
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const ch = (v) => Math.round(Math.min(1, v) * 255);
    ctx.fillStyle = `rgb(${ch(a[0])},${ch(a[1])},${ch(a[2])})`;
    poly(ctx, [
      [0, 0, 0],
      [W, 0, 0],
      [W, 0, -SLAB_DEPTH],
      [W, H, -SLAB_DEPTH],
      [0, H, -SLAB_DEPTH],
      [0, H, 0],
    ]);
    ctx.fill();
    ctx.restore();
  }

  // Animated parts of water that can't live in the cache.
  drawWaterMotion(ctx, t, L) {
    if (this.camera.zoom < 0.5) return;
    const { x, y } = t;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 2; i++) {
      const ph = this.time * (0.7 + hash2(x, y, 70 + i) * 0.6) + hash2(x, y, 80 + i) * 6.28;
      const a = (Math.sin(ph) * 0.5 + 0.5) * (L.daylight > 0.3 ? 0.6 : 0.35);
      const p = gridToWorld(x + 0.25 + hash2(x, y, 90 + i) * 0.5, y + 0.25 + hash2(x, y, 95 + i) * 0.5);
      const drift = Math.sin(ph * 0.5) * 2;
      ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(p.x - 4 + drift, p.y);
      ctx.lineTo(p.x + 4 + drift, p.y);
      ctx.stroke();
    }
  }

  drawSlabShadow(ctx) {
    const W = this.city.width;
    const H = this.city.height;
    const D = SLAB_DEPTH;
    for (const [pad, a] of [
      [0.9, 0.05],
      [0.45, 0.07],
    ]) {
      ctx.fillStyle = `rgba(60,48,110,${a})`;
      poly(ctx, [
        [-pad, -pad, -D - 10],
        [W + pad, -pad, -D - 10],
        [W + pad, H + pad, -D - 10],
        [-pad, H + pad, -D - 10],
      ]);
      ctx.fill();
    }
  }

  drawSlab(ctx, L, withShadow = true) {
    const W = this.city.width;
    const H = this.city.height;
    const D = SLAB_DEPTH;
    // Soft drop shadow so the board floats like a diorama.
    if (withShadow) this.drawSlabShadow(ctx);
    const yTop = gridToWorld(W, H).y;
    const left = ctx.createLinearGradient(0, yTop - (W + H) * HALF_H * 0.5, 0, yTop + D);
    left.addColorStop(0, lit(PALETTE.earth, 0.95, L));
    left.addColorStop(1, lit(PALETTE.earthDark, 0.88, L));
    ctx.fillStyle = left;
    poly(ctx, [
      [0, H, 0],
      [W, H, 0],
      [W, H, -D],
      [0, H, -D],
    ]);
    ctx.fill();
    const right = ctx.createLinearGradient(0, yTop - (W + H) * HALF_H * 0.5, 0, yTop + D);
    right.addColorStop(0, lit(PALETTE.earth, 0.8, L));
    right.addColorStop(1, lit(PALETTE.earthDark, 0.72, L));
    ctx.fillStyle = right;
    poly(ctx, [
      [W, H, 0],
      [W, 0, 0],
      [W, 0, -D],
      [W, H, -D],
    ]);
    ctx.fill();
    // Turf lip along the top edge of the slab.
    ctx.fillStyle = lit(PALETTE.grass, 0.78, L);
    poly(ctx, [
      [0, H, 0],
      [W, H, 0],
      [W, H, -4],
      [0, H, -4],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.grass, 0.66, L);
    poly(ctx, [
      [W, H, 0],
      [W, 0, 0],
      [W, 0, -4],
      [W, H, -4],
    ]);
    ctx.fill();
    // Fill the top under the tiles so antialiased seams show grass, not the sky.
    ctx.fillStyle = lit(PALETTE.grass, 0.97, L);
    poly(ctx, [
      [0, 0],
      [W, 0],
      [W, H],
      [0, H],
    ]);
    ctx.fill();
  }

  drawVignette(ctx, L) {
    const r = Math.max(this.w, this.h);
    const g = ctx.createRadialGradient(this.w / 2, this.h / 2, r * 0.3, this.w / 2, this.h / 2, r * 0.78);
    g.addColorStop(0, 'rgba(70,58,120,0)');
    g.addColorStop(1, `rgba(70,58,120,${(0.1 + 0.12 * (1 - L.daylight)).toFixed(3)})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.w, this.h);
  }

  // ---- Ground layer -------------------------------------------------------------

  drawGround(ctx, t, L) {
    const { x, y } = t;
    if (t.terrain === 'water') return this.drawWater(ctx, t, L);
    const s = t.structure;
    if (s?.type === 'road') return this.drawRoad(ctx, t, L);
    ctx.fillStyle = lit(PALETTE.grass, 0.97 + hash2(x, y, 1) * 0.06, L);
    tilePoly(ctx, x, y);
    ctx.fill();
    if (s?.type === 'park') this.drawParkGround(ctx, t, L);
    else if (!s) this.drawMeadow(ctx, t, L);
  }

  drawMeadow(ctx, t, L) {
    const { x, y } = t;
    ctx.strokeStyle = lit(PALETTE.grass, 0.8, L);
    ctx.lineWidth = 0.9;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      if (hash2(x, y, 20 + i) > 0.55) continue;
      const p = gridToWorld(x + 0.15 + hash2(x, y, 30 + i) * 0.7, y + 0.15 + hash2(x, y, 40 + i) * 0.7);
      ctx.beginPath();
      ctx.moveTo(p.x - 2, p.y - 2.5);
      ctx.lineTo(p.x - 0.5, p.y);
      ctx.lineTo(p.x + 0.5, p.y - 3);
      ctx.lineTo(p.x + 1.5, p.y);
      ctx.lineTo(p.x + 3, p.y - 2);
      ctx.stroke();
    }
    if (hash2(x, y, 3) < 0.3) {
      for (let i = 0; i < 4; i++) {
        const p = gridToWorld(x + 0.15 + hash2(x, y, 50 + i) * 0.7, y + 0.15 + hash2(x, y, 60 + i) * 0.7);
        ctx.fillStyle = lit(FLOWER_COLORS[(i + x + y) % FLOWER_COLORS.length], 1, L);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  drawWater(ctx, t, L) {
    const { x, y } = t;
    const city = this.city;
    ctx.fillStyle = lit(PALETTE.water, 1, L);
    tilePoly(ctx, x, y);
    ctx.fill();
    // Slightly deeper centre where the tile is surrounded by water.
    let wet = 0;
    EDGES.forEach((e, i) => {
      const n = city.getTile(x + [0, 1, 0, -1][i], y + [-1, 0, 1, 0][i]);
      if (!n || n.terrain === 'water') wet++;
    });
    if (wet >= 3) {
      ctx.fillStyle = lit(PALETTE.water, 0.93, L);
      gridEllipse(ctx, x + 0.5, y + 0.5, 0, 0.28);
      ctx.fill();
    }
    // Sandy bank and foam on edges that meet land.
    EDGES.forEach((e, i) => {
      const n = city.getTile(x + [0, 1, 0, -1][i], y + [-1, 0, 1, 0][i]);
      if (!n || n.terrain === 'water') return;
      ctx.fillStyle = lit(PALETTE.sand, 1, L);
      poly(ctx, edgeStrip(x, y, e, 0, 0.09));
      ctx.fill();
      ctx.fillStyle = litA('#ffffff', 1, L, 0.55);
      poly(ctx, edgeStrip(x, y, e, 0.09, this._caching ? 0.13 : 0.13 + Math.sin(this.time * 1.6 + x + y) * 0.02));
      ctx.fill();
    });
    // Shimmer.
    if (this._caching || this.camera.zoom < 0.5) return;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 2; i++) {
      const ph = this.time * (0.7 + hash2(x, y, 70 + i) * 0.6) + hash2(x, y, 80 + i) * 6.28;
      const a = (Math.sin(ph) * 0.5 + 0.5) * (L.daylight > 0.3 ? 0.6 : 0.35);
      const p = gridToWorld(x + 0.25 + hash2(x, y, 90 + i) * 0.5, y + 0.25 + hash2(x, y, 95 + i) * 0.5);
      const drift = Math.sin(ph * 0.5) * 2;
      ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(p.x - 4 + drift, p.y);
      ctx.lineTo(p.x + 4 + drift, p.y);
      ctx.stroke();
    }
  }

  drawRoad(ctx, t, L) {
    const { x, y, roadMask: m } = t;
    ctx.fillStyle = lit(PALETTE.road, 0.98 + hash2(x, y, 2) * 0.03, L);
    tilePoly(ctx, x, y);
    ctx.fill();
    EDGES.forEach((e, i) => {
      if (m & (1 << i)) return;
      ctx.fillStyle = lit(PALETTE.sidewalk, 1.02, L);
      poly(ctx, edgeStrip(x, y, e, 0, 0.15));
      ctx.fill();
      ctx.fillStyle = lit(PALETTE.road, 0.86, L);
      poly(ctx, edgeStrip(x, y, e, 0.15, 0.18));
      ctx.fill();
    });
    // Lane markings follow the connections.
    ctx.strokeStyle = lit(PALETTE.marking, 1, L);
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'butt';
    ctx.setLineDash([3.5, 3.5]);
    const c = gridToWorld(x + 0.5, y + 0.5);
    const mids = [
      [x + 0.5, y],
      [x + 1, y + 0.5],
      [x + 0.5, y + 1],
      [x, y + 0.5],
    ];
    ctx.beginPath();
    if (m === 5 || m === 10) {
      const a = gridToWorld(...mids[m === 5 ? 0 : 3]);
      const b = gridToWorld(...mids[m === 5 ? 2 : 1]);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    } else {
      for (let i = 0; i < 4; i++) {
        if (!(m & (1 << i))) continue;
        const p = gridToWorld(...mids[i]);
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(p.x, p.y);
      }
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // Zebra crossing on busy junctions.
    const links = [1, 2, 4, 8].filter((b) => m & b).length;
    if (links >= 3) {
      ctx.fillStyle = litA(PALETTE.marking, 1, L, 0.85);
      for (let k = 0; k < 3; k++) {
        const off = 0.3 + k * 0.2;
        poly(ctx, [
          [x + off - 0.05, y + 0.06],
          [x + off + 0.05, y + 0.06],
          [x + off + 0.05, y + 0.16],
          [x + off - 0.05, y + 0.16],
        ]);
        ctx.fill();
      }
    }
  }

  drawParkGround(ctx, t, L) {
    const { x, y } = t;
    const city = this.city;
    ctx.fillStyle = lit(PALETTE.parkGrass, 1, L);
    tilePoly(ctx, x, y, 0.04);
    ctx.fill();
    // Paths run to the edge where they meet another park or a road.
    const opens = [
      [0, -1],
      [1, 0],
      [0, 1],
      [-1, 0],
    ].map(([dx, dy]) => {
      const n = city.getTile(x + dx, y + dy);
      return !!n && (n.structure?.type === 'park' || n.structure?.type === 'road');
    });
    ctx.fillStyle = lit(PALETTE.path, 1, L);
    const w = 0.07;
    poly(ctx, [
      [x + 0.5 - w, y + (opens[0] ? 0 : 0.2)],
      [x + 0.5 + w, y + (opens[0] ? 0 : 0.2)],
      [x + 0.5 + w, y + (opens[2] ? 1 : 0.8)],
      [x + 0.5 - w, y + (opens[2] ? 1 : 0.8)],
    ]);
    ctx.fill();
    poly(ctx, [
      [x + (opens[3] ? 0 : 0.2), y + 0.5 - w],
      [x + (opens[1] ? 1 : 0.8), y + 0.5 - w],
      [x + (opens[1] ? 1 : 0.8), y + 0.5 + w],
      [x + (opens[3] ? 0 : 0.2), y + 0.5 + w],
    ]);
    ctx.fill();
    gridEllipse(ctx, x + 0.5, y + 0.5, 0, 0.2);
    ctx.fill();
    for (let i = 0; i < 6; i++) {
      const q = i % 4;
      const gx = x + (q === 0 || q === 3 ? 0.22 : 0.78) + (hash2(x, y, 100 + i) - 0.5) * 0.12;
      const gy = y + (q < 2 ? 0.22 : 0.78) + (hash2(x, y, 110 + i) - 0.5) * 0.12;
      const p = gridToWorld(gx, gy);
      ctx.fillStyle = lit(FLOWER_COLORS[(i + x) % FLOWER_COLORS.length], 1, L);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Data views tint the ground so buildings stay readable on top.
  drawOverlay(ctx, t, overlay) {
    let color = null;
    if (overlay === 'desirability') {
      if (t.terrain === 'water' || t.roadMask || t.structure?.type === 'road') return;
      color = rampColor(t.desirability, 0.62);
    } else if (overlay === 'traffic') {
      if (t.structure?.type !== 'road') {
        color = 'rgba(70,60,110,0.28)';
      } else {
        color = t.congestion < 0.02 ? 'rgba(255,255,255,0.35)' : rampColor(1 - t.congestion, 0.8);
      }
    } else if (overlay === 'services') {
      if (t.terrain === 'water') return;
      const c = t.coverage || {};
      const school = c.school || 0;
      const health = c.health || 0;
      if (school < 0.02 && health < 0.02) color = 'rgba(70,60,110,0.22)';
      else {
        // Schools tint lavender, clinics tint mint; both together read as a soft blue-violet.
        const r = Math.round(200 - 60 * health);
        const g = Math.round(180 + 40 * health - 20 * school);
        const b = Math.round(200 + 40 * school);
        color = `rgba(${r},${g},${b},${(0.25 + 0.45 * Math.max(school, health)).toFixed(3)})`;
      }
    }
    if (!color) return;
    ctx.fillStyle = color;
    tilePoly(ctx, t.x, t.y);
    ctx.fill();
  }

  drawSelected(ctx, sel) {
    const z = this.camera.zoom;
    const pulse = 0.6 + 0.4 * Math.sin(this.time * 4);
    ctx.lineWidth = 2.2 / z;
    ctx.setLineDash([5 / z, 4 / z]);
    ctx.lineDashOffset = -this.time * 12;
    ctx.strokeStyle = `rgba(255,255,255,${pulse.toFixed(3)})`;
    tilePoly(ctx, sel.x, sel.y, -0.02);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawHover(ctx, hover) {
    const z = this.camera.zoom;
    ctx.lineWidth = 1.6 / z;
    tilePoly(ctx, hover.x, hover.y, 0.02);
    const warn = hover.tool === 'bulldoze' || (!hover.valid && hover.tool !== 'inspect');
    ctx.fillStyle = warn ? 'rgba(255,143,128,0.22)' : 'rgba(255,255,255,0.28)';
    ctx.strokeStyle = warn ? 'rgba(255,128,112,0.95)' : 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.stroke();
  }

  // ---- Shadows and ambient occlusion ------------------------------------------

  footprint(t) {
    const s = t.structure;
    if (s.type === 'house') return { inset: 0.2, h: 27 };
    if (s.type === 'tower') return { inset: 0.16, h: 6 + (s.floors || 5) * 11 };
    if (s.type === 'tree') return { inset: 0.32, h: 24, round: true };
    if (s.type === 'shop') return { inset: 0.16, h: 22 };
    if (s.type === 'office') return { inset: 0.14, h: 8 + (s.floors || 4) * 12 };
    if (s.type === 'school') return { inset: 0.12, h: 26 };
    if (s.type === 'clinic') return { inset: 0.15, h: 24 };
    return null;
  }

  drawShadow(ctx, t, L) {
    const f = this.footprint(t);
    if (!f) return;
    const b = this.bounceFor(t.x, t.y);
    if (b.hidden) return;
    const { x, y } = t;
    const g = gridToWorld(x + 0.5, y + 0.5);
    // Contact shadow: always present, anchors the object to the ground.
    const r = (1 - f.inset * 2) * HALF_W * 1.25 * b.sx;
    ctx.drawImage(contactSprite(), g.x - r, g.y - r / 2, r * 2, r);

    const sh = L.shadow;
    if (sh.alpha < 0.01) return;
    const h = f.h * b.sy;
    ctx.fillStyle = `rgba(64,58,120,${sh.alpha.toFixed(3)})`;
    if (f.round) {
      gridEllipse(ctx, x + 0.5 + sh.dx * h * 0.75, y + 0.5 + sh.dy * h * 0.75, 0, 0.22);
      ctx.fill();
      return;
    }
    const i0 = f.inset;
    const pts = [];
    for (const [gx, gy] of [
      [x + i0, y + i0],
      [x + 1 - i0, y + i0],
      [x + 1 - i0, y + 1 - i0],
      [x + i0, y + 1 - i0],
    ]) {
      pts.push(gridToWorld(gx, gy));
      pts.push(gridToWorld(gx + sh.dx * h, gy + sh.dy * h));
    }
    const hull = convexHull(pts);
    ctx.beginPath();
    hull.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    ctx.fill();
  }

  // ---- Depth-sorted objects -------------------------------------------------------

  drawItem(ctx, it, L) {
    if (it.kind === 'car') return this.drawCar(ctx, it.c, it.pose, L);
    if (it.kind === 'walker') return this.drawWalker(ctx, it.w, L);
    if (it.kind === 'lamp') return this.drawLamp(ctx, it.lamp, L);
    if (it.kind === 'ghost') {
      ctx.save();
      ctx.globalAlpha = 0.5;
      this.drawStructure(ctx, it.ghost.x, it.ghost.y, it.ghost.structure, L, true);
      ctx.restore();
      return;
    }
    const t = it.t;
    const b = this.bounceFor(t.x, t.y);
    if (b.hidden) return;
    const c = gridToWorld(t.x + 0.5, t.y + 0.5);
    ctx.save();
    if (b.sx !== 1 || b.sy !== 1) {
      ctx.translate(c.x, c.y);
      ctx.scale(b.sx, b.sy);
      ctx.translate(-c.x, -c.y);
    }
    this.drawStructure(ctx, t.x, t.y, t.structure, L, false);
    ctx.restore();
  }

  drawStructure(ctx, x, y, s, L, ghost) {
    switch (s.type) {
      case 'house':
        return this.drawHouse(ctx, x, y, s, L, ghost);
      case 'tower':
        return this.drawTower(ctx, x, y, s, L, ghost);
      case 'shop':
        return this.drawShop(ctx, x, y, s, L, ghost);
      case 'office':
        return this.drawOffice(ctx, x, y, s, L, ghost);
      case 'school':
        return this.drawSchool(ctx, x, y, s, L, ghost);
      case 'clinic':
        return this.drawClinic(ctx, x, y, s, L, ghost);
      case 'tree':
        return this.drawTree(ctx, x + 0.5, y + 0.5, s.shape || 0, L, hash2(x, y, 12) * 6.28, 1);
      case 'park':
        return this.drawParkProps(ctx, x, y, L);
      case 'road':
        if (ghost) {
          ctx.fillStyle = lit(PALETTE.road, 1, L);
          tilePoly(ctx, x, y, 0.04);
          ctx.fill();
        }
        return;
    }
  }

  // A box with soft ambient occlusion toward the ground on both visible faces.
  drawBox(ctx, L, x0, y0, x1, y1, z, h, color, top = true) {
    const ao = Math.min(h, 16);
    const face = (pts, shade, baseY) => {
      const g = ctx.createLinearGradient(0, baseY, 0, baseY - ao);
      g.addColorStop(0, lit(color, shade * 0.8, L));
      g.addColorStop(1, lit(color, shade, L));
      ctx.fillStyle = g;
      poly(ctx, pts);
      ctx.fill();
    };
    face(
      [
        [x0, y1, z],
        [x1, y1, z],
        [x1, y1, z + h],
        [x0, y1, z + h],
      ],
      0.92,
      gridToWorld((x0 + x1) / 2, y1, z).y
    );
    face(
      [
        [x1, y1, z],
        [x1, y0, z],
        [x1, y0, z + h],
        [x1, y1, z + h],
      ],
      0.78,
      gridToWorld(x1, (y0 + y1) / 2, z).y
    );
    if (top) {
      ctx.fillStyle = lit(color, 1.05, L);
      poly(ctx, [
        [x0, y0, z + h],
        [x1, y0, z + h],
        [x1, y1, z + h],
        [x0, y1, z + h],
      ]);
      ctx.fill();
    }
    // Soft highlight on the near edges, like light catching a painted model.
    ctx.strokeStyle = `rgba(255,255,255,${(0.18 + 0.22 * L.daylight).toFixed(3)})`;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    const a = gridToWorld(x0, y1, z + h);
    const b = gridToWorld(x1, y1, z + h);
    const c = gridToWorld(x1, y0, z + h);
    const d = gridToWorld(x1, y1, z);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(d.x, d.y);
    ctx.stroke();
  }

  // Quad on the left (+y) or right (+x) face of a box, in face-relative u (0..1) and height v (px).
  faceQuad(face, x0, y0, x1, y1, u0, u1, v0, v1) {
    if (face === 'L') {
      const gx = (u) => x0 + (x1 - x0) * u;
      return [
        [gx(u0), y1, v0],
        [gx(u1), y1, v0],
        [gx(u1), y1, v1],
        [gx(u0), y1, v1],
      ];
    }
    const gy = (u) => y1 - (y1 - y0) * u;
    return [
      [x1, gy(u0), v0],
      [x1, gy(u1), v0],
      [x1, gy(u1), v1],
      [x1, gy(u0), v1],
    ];
  }

  drawWindow(ctx, L, pts, shade, isLit) {
    poly(ctx, pts);
    if (isLit) {
      ctx.fillStyle = PALETTE.windowLit;
      ctx.fill();
      const p = pts[0];
      const q = pts[2];
      const c = gridToWorld((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (p[2] + q[2]) / 2);
      this.glows.push({ x: c.x, y: c.y, r: 7, a: 0.22, rgb: '255,214,140' });
    } else {
      ctx.fillStyle = lit(PALETTE.glass, shade, L);
      ctx.fill();
    }
  }

  isWindowLit(x, y, i, occupancy, L) {
    if (L.windowLit < 0.02 || occupancy <= 0) return false;
    const chance = L.windowLit * clamp(0.25 + occupancy, 0, 1);
    return hash2(x * 7 + i, y * 13 + (this.city.day % 4), 11) < chance;
  }

  drawHouse(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.peach;
    const x0 = x + 0.2;
    const x1 = x + 0.8;
    const y0 = y + 0.22;
    const y1 = y + 0.78;
    const h = 15;
    const rh = 12;
    const o = 0.05;
    const xm = (x0 + x1) / 2;
    const occ = ghost ? 0 : s.residents / STRUCTURES.house.capacity;
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.wall, false);

    ctx.fillStyle = lit(v.roof, 0.72, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0.6, 0.8, 0, 9));
    ctx.fill();
    this.drawWindow(ctx, L, this.faceQuad('L', x0, y0, x1, y1, 0.16, 0.4, 5, 11), 0.92, this.isWindowLit(x, y, 0, occ, L));
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.16, 0.4, 5, 11), 0.8, this.isWindowLit(x, y, 1, occ, L));
    this.drawWindow(ctx, L, this.faceQuad('R', x0, y0, x1, y1, 0.6, 0.84, 5, 11), 0.8, this.isWindowLit(x, y, 2, occ, L));

    // Gable end, then the two roof slopes with a small overhang.
    ctx.fillStyle = lit(v.wall, 0.92, L);
    poly(ctx, [
      [x0, y1, h],
      [x1, y1, h],
      [xm, y1, h + rh],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 1.05, L);
    poly(ctx, [
      [x0 - o, y0 - o, h],
      [x0 - o, y1 + o, h],
      [xm, y1 + o, h + rh],
      [xm, y0 - o, h + rh],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 0.82, L);
    poly(ctx, [
      [x1 + o, y0 - o, h],
      [x1 + o, y1 + o, h],
      [xm, y1 + o, h + rh],
      [xm, y0 - o, h + rh],
    ]);
    ctx.fill();
    // Chimney sitting on the right slope.
    const cx0 = xm + 0.08;
    const cx1 = xm + 0.16;
    const base = h + rh * (1 - (cx1 - xm) / (x1 + o - xm));
    this.drawBox(ctx, L, cx0, y0 + 0.06, cx1, y0 + 0.14, base - 1, 6 + rh * 0.2, v.trim);
    // Ridge and eave lines.
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = `rgba(255,255,255,${(0.25 + 0.25 * L.daylight).toFixed(3)})`;
    ctx.beginPath();
    const r0 = gridToWorld(xm, y0 - o, h + rh);
    const r1 = gridToWorld(xm, y1 + o, h + rh);
    ctx.moveTo(r0.x, r0.y);
    ctx.lineTo(r1.x, r1.y);
    ctx.stroke();
    ctx.strokeStyle = lit(v.roof, 0.66, L);
    ctx.beginPath();
    const e0 = gridToWorld(x0 - o, y1 + o, h);
    const e1 = gridToWorld(x1 + o, y1 + o, h);
    ctx.moveTo(e0.x, e0.y);
    ctx.lineTo(r1.x, r1.y);
    ctx.lineTo(e1.x, e1.y);
    ctx.stroke();
  }

  drawTower(ctx, x, y, s, L, ghost) {
    const v = BUILDING_VARIANTS[s.variant] || BUILDING_VARIANTS.lavender;
    const floors = s.floors || 5;
    const x0 = x + 0.16;
    const x1 = x + 0.84;
    const y0 = y + 0.16;
    const y1 = y + 0.84;
    const fh = 11;
    const h = 6 + floors * fh;
    const occ = ghost ? 0 : s.residents / STRUCTURES.tower.capacity;
    this.drawBox(ctx, L, x0, y0, x1, y1, 0, h, v.wall, false);

    // Plinth band.
    ctx.fillStyle = lit(v.roof, 0.85, L);
    poly(ctx, this.faceQuad('L', x0, y0, x1, y1, 0, 1, 0, 4));
    ctx.fill();
    ctx.fillStyle = lit(v.roof, 0.72, L);
    poly(ctx, this.faceQuad('R', x0, y0, x1, y1, 0, 1, 0, 4));
    ctx.fill();

    let wi = 0;
    for (let f = 0; f < floors; f++) {
      const v0 = 8 + f * fh;
      for (const face of ['L', 'R']) {
        for (let k = 0; k < 3; k++) {
          const u0 = 0.1 + k * 0.3;
          if (f === 0 && face === 'L' && k === 1) {
            ctx.fillStyle = lit(v.roof, 0.72, L);
            poly(ctx, this.faceQuad('L', x0, y0, x1, y1, u0, u0 + 0.2, 0, 9));
            ctx.fill();
            continue;
          }
          const pts = this.faceQuad(face, x0, y0, x1, y1, u0, u0 + 0.2, v0, v0 + 6);
          this.drawWindow(ctx, L, pts, face === 'L' ? 0.92 : 0.8, this.isWindowLit(x, y, wi++, occ, L));
        }
      }
    }

    // Roof deck with a parapet rim and a small rooftop unit.
    ctx.fillStyle = lit(v.trim, 1, L);
    poly(ctx, [
      [x0, y0, h],
      [x1, y0, h],
      [x1, y1, h],
      [x0, y1, h],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(v.wall, 0.95, L);
    poly(ctx, [
      [x0 + 0.05, y0 + 0.05, h],
      [x1 - 0.05, y0 + 0.05, h],
      [x1 - 0.05, y1 - 0.05, h],
      [x0 + 0.05, y1 - 0.05, h],
    ]);
    ctx.fill();
    this.drawBox(ctx, L, x0 + 0.12, y0 + 0.12, x0 + 0.32, y0 + 0.3, h, 5, v.trim);
    if (floors >= 6) {
      const a = gridToWorld(x1 - 0.15, y1 - 0.15, h);
      ctx.strokeStyle = lit(PALETTE.pole, 1, L);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x, a.y - 12);
      ctx.stroke();
      ctx.fillStyle = L.daylight < 0.5 && Math.sin(this.time * 3) > 0 ? '#ff8f8f' : lit('#f3a5a5', 1, L);
      ctx.beginPath();
      ctx.arc(a.x, a.y - 12, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  workFill(x, y, s, ghost) {
    if (ghost) return 0;
    const t = this.city.getTile(x, y);

  }

  setViewport(w, h) {

    this.viewH = h;
  }

  setBounds(b) {

    this.clampTarget();

  update(dt) {

    this.x += (this.tx - this.x) * k;
    this.y += (this.ty - this.y) * k;
    this.zoom = Math.exp(Math.log(this.zoom) + (Math.log(this.tzoom) - Math.log(this.zoom)) * k);
  }

  screenToWorld(sx, sy) {

      x: (sx - this.viewW / 2) / this.zoom + this.x,
      y: (sy - this.viewH / 2) / this.zoom + this.y,

  panBy(dx, dy) {

    this.y -= dy / this.zoom;

    this.ty = this.y;
    this.clampTarget();
  }

    const oy = sy - this.viewH / 2;
    const wx = ox / this.tzoom + this.tx;
    const wy = oy / this.tzoom + this.ty;
    this.tzoom = nz;
    this.tx = wx - ox / nz;
    this.ty = wy - oy / nz;
    this.clampTarget();
    if (immediate) {
      this.x = this.tx;
      this.y = this.ty;
      this.zoom = this.tzoom;

    const b = rect;

      this.y = this.ty;
      this.zoom = z;
    }
  }

  clampTarget() {
    const b = this.bounds;
    if (!b) return;
    this.tx = clamp(this.tx, b.left, b.right);
    this.ty = clamp(this.ty, b.top, b.bottom);

    this.y = clamp(this.y, b.top - 200, b.bottom + 200);
  }
