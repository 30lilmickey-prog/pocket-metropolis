const __mod_input = (() => {
// Input: turns mouse, touch and pen gestures into camera moves and tile actions.
// Tap/click builds, right-click or long-press bulldozes, drag pans, wheel or pinch zooms.

const LONG_PRESS_MS = 480;

class InputController {
  constructor(canvas, camera, handlers) {
    this.canvas = canvas;
    this.camera = camera;
    this.handlers = handlers; // { onTap, onBulldoze, onHover, onLongPressStart }
    this.pointers = new Map();
    this.gesture = null;
    this.longTimer = 0;

    canvas.addEventListener('pointerdown', (e) => this.onDown(e));
    canvas.addEventListener('pointermove', (e) => this.onMove(e));
    canvas.addEventListener('pointerup', (e) => this.onUp(e));
    canvas.addEventListener('pointercancel', (e) => this.onUp(e, true));
    canvas.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') this.handlers.onHover(null);
    });
    canvas.addEventListener('wheel', (e) => this.onWheel(e), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  local(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  onDown(e) {
    const p = this.local(e);
    try {
      this.canvas.setPointerCapture(e.pointerId);
    } catch {
      /* capture is a nicety */
    }
    this.pointers.set(e.pointerId, { x: p.x, y: p.y });
    if (this.pointers.size === 1) {
      this.gesture = {
        button: e.button,
        type: e.pointerType,
        startX: p.x,
        startY: p.y,
        moved: false,
        pinched: false,
        longPressed: false,
        vx: 0,
        vy: 0,
        lastT: performance.now(),
      };
      if (e.pointerType !== 'mouse') {
        clearTimeout(this.longTimer);
        this.longTimer = setTimeout(() => {
          const g = this.gesture;
          if (g && !g.moved && !g.pinched && this.pointers.size === 1) {
            g.longPressed = true;
            navigator.vibrate?.(12);
            this.handlers.onBulldoze(g.startX, g.startY);
          }
        }, LONG_PRESS_MS);
      }
    } else if (this.pointers.size === 2 && this.gesture) {
      clearTimeout(this.longTimer);
      this.gesture.pinched = true;
      this.gesture.moved = true;
      this.pinch = this.pinchState();
    }
  }

  pinchState() {
    const [a, b] = [...this.pointers.values()];
    return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }

  onMove(e) {
    const p = this.local(e);
    const ptr = this.pointers.get(e.pointerId);
    if (!ptr) {
      if (e.pointerType === 'mouse') this.handlers.onHover(p.x, p.y);
      return;
    }
    const dx = p.x - ptr.x;
    const dy = p.y - ptr.y;
    ptr.x = p.x;
    ptr.y = p.y;
    const g = this.gesture;
    if (!g) return;

    if (this.pointers.size === 1 && !g.pinched) {
      const threshold = g.type === 'mouse' ? 5 : 10;
      if (!g.moved && Math.hypot(p.x - g.startX, p.y - g.startY) > threshold) {
        g.moved = true;
        clearTimeout(this.longTimer);
      }
      if (g.moved && !g.longPressed) {
        this.camera.panBy(dx, dy);
        const now = performance.now();
        const dtm = Math.max(1, now - g.lastT) / 1000;
        g.vx = g.vx * 0.6 + (dx / dtm) * 0.4;
        g.vy = g.vy * 0.6 + (dy / dtm) * 0.4;
        g.lastT = now;
      }
      if (e.pointerType === 'mouse') this.handlers.onHover(g.moved ? null : p.x, p.y);
    } else if (this.pointers.size === 2 && this.pinch) {
      const next = this.pinchState();
      this.camera.zoomAt(next.dist / this.pinch.dist, next.mx, next.my, true);
      this.camera.panBy(next.mx - this.pinch.mx, next.my - this.pinch.my);
      this.pinch = next;
    }
  }

  onUp(e, cancelled = false) {
    const g = this.gesture;
    const p = this.local(e);
    this.pointers.delete(e.pointerId);
    clearTimeout(this.longTimer);
    if (this.pointers.size === 1) {
      this.pinch = null; // lifting one finger of a pinch never counts as a tap
      return;
    }
    if (this.pointers.size > 0 || !g) return;
    this.gesture = null;
    if (cancelled) return;
    if (!g.moved && !g.longPressed && !g.pinched) {
      if (g.button === 2) this.handlers.onBulldoze(p.x, p.y);
      else if (g.button === 0) this.handlers.onTap(p.x, p.y);
    } else if (g.moved && !g.pinched && performance.now() - g.lastT < 80) {
      this.camera.fling(g.vx, g.vy);
    }
  }

  onWheel(e) {
    e.preventDefault();
    const p = this.local(e);
    const scale = e.deltaMode === 1 ? 0.05 : e.ctrlKey ? 0.01 : 0.0015;
    this.camera.zoomAt(Math.exp(-e.deltaY * scale), p.x, p.y);
  }
}

return { InputController };
})();

// ---- persistence.js ----
const __mod_persistence = (() => {
// Persistence: versioned saves in localStorage. Add a migration whenever SAVE_VERSION goes up.

const { SAVE_VERSION } = __mod_config;
const { CityState } = __mod_state;
const KEY = 'pocket-metropolis:save';

// MIGRATIONS[n] upgrades a save from version n to n + 1.
const MIGRATIONS = {
  // v1 → v2: maps grew from 12×12 to 32×32. Old towns keep every tile and move to the middle.
  1: (save) => {
    const c = save.city;
    const size = Math.max(32, c.width | 0, c.height | 0);
    const ox = Math.floor((size - c.width) / 2);
    const oy = Math.floor((size - c.height) / 2);
    const tiles = Array.from({ length: size * size }, () => ({ terrain: 'grass', structure: null }));
    c.tiles.forEach((t, i) => {
      const x = i % c.width;
      const y = Math.floor(i / c.width);
      tiles[(y + oy) * size + x + ox] = t;
    });
    save.city = { ...c, width: size, height: size, tiles };
    return save;
  },
};

function migrate(save) {
  let v = save.version | 0;
  if (v < 1 || v > SAVE_VERSION) throw new Error(`Unsupported save version ${save.version}`);
  while (v < SAVE_VERSION) {
    save = MIGRATIONS[v](save);
    v++;
    save.version = v;
  }
  return save;
}

function saveCity(city) {
  try {
    const save = { version: SAVE_VERSION, savedAt: Date.now(), city: city.toJSON() };
    localStorage.setItem(KEY, JSON.stringify(save));
    return true;
  } catch {
    return false;
  }
}

function loadCity() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return CityState.fromJSON(migrate(JSON.parse(raw)).city);
  } catch {
    return null;
  }
}

// Saves shortly after each edit, every so often while the city lives, and when the page is hidden.
class AutoSaver {
  constructor(city, { delayMs = 800, intervalS = 15 } = {}) {
    this.city = city;
    this.delayMs = delayMs;
    this.intervalS = intervalS;
    this.pending = -1;
    this.since = 0;
    city.on((ev) => {
      if (ev.type === 'placed' || ev.type === 'removed' || ev.type === 'watered' || ev.type === 'reset') {
        this.pending = this.delayMs;
      }
    });
    const flush = () => this.flush();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
    });
    window.addEventListener('pagehide', flush);
  }

  tick(dt) {
    this.since += dt;
    if (this.pending >= 0) {
      this.pending -= dt * 1000;
      if (this.pending < 0) this.flush();
    }
    if (this.since > this.intervalS) this.flush();
  }

  flush() {
    saveCity(this.city);
    this.since = 0;
    this.pending = -1;
  }
}

return { MIGRATIONS, saveCity, loadCity, AutoSaver };
})();

// ---- generator.js ----
const __mod_generator = (() => {
// Random Town: lays out a starter town in the middle of the map with countryside around it,
// using the same state API the player uses.

const { STRUCTURES } = __mod_config;
const { DIRS } = __mod_state;
const { mulberry32 } = __mod_utils;
function generateTown(city, seed = (Math.random() * 2 ** 32) >>> 0) {
  const rand = mulberry32(seed);
  const W = city.width;
  const H = city.height;
  const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
  city.reset();

  const tile = (x, y) => city.getTile(x, y);
  const place = (x, y, type) => {
    const t = tile(x, y);
    if (!t) return;
    t.terrain = 'grass';
    t.structure = city.createStructure(type, rand);
  };
  const isEmpty = (x, y) => {
    const t = tile(x, y);
    return !!t && t.terrain === 'grass' && !t.structure;
  };

  // Town footprint: under half the map, centred, so there is room to grow.
  const cx = Math.floor(W / 2) + ri(-2, 2);
  const cy = Math.floor(H / 2) + ri(-2, 2);
  const half = Math.max(5, Math.floor(Math.min(W, H) * 0.23));
  const inTown = (x, y) => Math.abs(x - cx) <= half && Math.abs(y - cy) <= half;

  // A river winds across one side of the map.
  const vertical = rand() < 0.5;
  const span = vertical ? W : H;
  let pos = rand() < 0.5 ? ri(2, Math.max(3, Math.floor(span * 0.18))) : span - 1 - ri(2, Math.max(3, Math.floor(span * 0.18)));
  for (let i = 0; i < (vertical ? H : W); i++) {
    const width = rand() < 0.3 ? 2 : 1;
    for (let k = 0; k < width; k++) {
      const t = vertical ? tile(pos + k, i) : tile(i, pos + k);
      if (t) t.terrain = 'water';
    }
    if (rand() < 0.35) pos = Math.max(1, Math.min(span - 3, pos + (rand() < 0.5 ? -1 : 1)));
  }
  // A pond on the far side, if it fits.
  if (W >= 20) {
    const px = vertical ? (pos < W / 2 ? W - 4 : 3) : ri(4, W - 5);
    const py = vertical ? ri(4, H - 5) : pos < H / 2 ? H - 4 : 3;
    const r = 1.5 + rand();
    for (const t of city.tiles) if (Math.hypot(t.x - px, t.y - py) + (rand() - 0.5) * 0.8 < r && !inTown(t.x, t.y)) t.terrain = 'water';
  }

  // Streets: two avenues cross downtown and run to the map edge; a grid fills the town.
  for (let i = 0; i < W; i++) place(i, cy, 'road');
  for (let i = 0; i < H; i++) place(cx, i, 'road');
  const step = W >= 24 ? 5 : 4;
  for (let o = step; o <= half; o += step) {
    for (const s of [-1, 1]) {
      const ry = cy + s * o;
      const rx = cx + s * o;
      if (rand() < 0.85) for (let x = cx - half + ri(0, 2); x <= cx + half - ri(0, 2); x++) if (tile(x, ry)) place(x, ry, 'road');
      if (rand() < 0.85) for (let y = cy - half + ri(0, 2); y <= cy + half - ri(0, 2); y++) if (tile(rx, y)) place(rx, y, 'road');
    }
  }

  // Lots along streets. Downtown is dense and busy; the edges of town are leafy houses.
  const nearRoad = (x, y) => DIRS.some((d) => city.isRoad(x + d.dx, y + d.dy));
  const ring = (x, y) => Math.max(Math.abs(x - cx), Math.abs(y - cy));
  const lots = city.tiles.filter((t) => isEmpty(t.x, t.y) && nearRoad(t.x, t.y) && inTown(t.x, t.y));
  for (const t of lots) {
    const d = ring(t.x, t.y);
    const onAvenue = t.x === cx + 1 || t.x === cx - 1 || t.y === cy + 1 || t.y === cy - 1;
    const r = rand();
    if (d <= 3) {
      if (r < 0.32) place(t.x, t.y, 'tower');
      else if (r < 0.6) place(t.x, t.y, 'office');
      else if (r < 0.86) place(t.x, t.y, 'shop');
    } else if (d <= 7) {
      if (onAvenue && r < 0.25) place(t.x, t.y, 'shop');
      else if (r < 0.12) place(t.x, t.y, 'tower');
      else if (r < 0.2) place(t.x, t.y, 'office');
      else if (r < 0.82) place(t.x, t.y, 'house');
    } else if (r < (onAvenue ? 0.12 : 0.03)) place(t.x, t.y, 'shop');
    else if (r < 0.74) place(t.x, t.y, 'house');
  }

  // A school and a clinic on opposite sides of downtown.
  const serviceSpot = (sx, sy) => {
    const spots = lots
      .filter((t) => {
        const s = tile(t.x, t.y).structure?.type;
        return (!s || s === 'house') && ring(t.x, t.y) >= 3 && ring(t.x, t.y) <= 8 && Math.sign(t.x - cx) === sx && Math.sign(t.y - cy) === sy;
      })
      .sort(() => rand() - 0.5);
    return spots[0];
  };
  const corner = rand() < 0.5 ? 1 : -1;
  const school = serviceSpot(corner, corner);
  if (school) place(school.x, school.y, 'school');
  const clinic = serviceSpot(-corner, -corner);
  if (clinic) place(clinic.x, clinic.y, 'clinic');

  // Parks where people live.
  const homesAround = (x, y) => {
    let n = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const s = tile(x + dx, y + dy)?.structure;
      if (s && STRUCTURES[s.type].capacity > 0) n++;
    }
    return n;
  };
  const parkSpots = city.tiles
    .filter((t) => isEmpty(t.x, t.y) && inTown(t.x, t.y))
    .map((t) => ({ t, score: homesAround(t.x, t.y) + rand() * 3 }))
    .sort((a, b) => b.score - a.score);
  const parks = Math.max(2, Math.round((half * half) / 18));
  for (let i = 0; i < Math.min(parks, parkSpots.length); i++) place(parkSpots[i].t.x, parkSpots[i].t.y, 'park');

  // Trees: scattered in town, thick woods in the countryside.
  const forests = Array.from({ length: Math.max(2, Math.round(W / 6)) }, () => ({ x: ri(0, W - 1), y: ri(0, H - 1), r: 2 + rand() * 4 }));
  for (const t of city.tiles) {
    if (!isEmpty(t.x, t.y)) continue;
    const byWater = DIRS.some((d) => tile(t.x + d.dx, t.y + d.dy)?.terrain === 'water');
    let p = inTown(t.x, t.y) ? 0.28 : 0.1;
    if (byWater) p += 0.25;
    for (const f of forests) if (Math.hypot(t.x - f.x, t.y - f.y) < f.r) p += 0.55;
    if (rand() < p) place(t.x, t.y, 'tree');
  }

  // Some people already live here.
  for (const h of city.homes()) {
    h.structure.residents = Math.floor(STRUCTURES[h.structure.type].capacity * (0.3 + rand() * 0.35));
  }

  city.refreshAllRoadMasks();
  city.dirty = true;
  city.emit('reset', { seed, focus: { x: cx, y: cy, radius: half } });
}

return { generateTown };
})();

    this.speedBtn = document.getElementById('btn-speed');

    this.onTool = onTool;
    this.onSpeed = onSpeed;
    this.onView = onView;
    this.tool = 'house';
    this.groupChoice = Object.fromEntries(TOOL_GROUPS.map((g) => [g.id, g.tools[0].id]));
    this.speed = 1;
    this.view = 'none';
    this._last = {};

    for (const g of TOOL_GROUPS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tool';
      b.id = `group-${g.id}`;
      b.dataset.group = g.id;
      b.setAttribute('aria-pressed', 'false');
      if (g.tools.length > 1) b.setAttribute('aria-haspopup', 'true');
      b.addEventListener('click', () => this.pressGroup(g.id));
      this.toolbar.appendChild(b);
    }
    document.getElementById('btn-random').addEventListener('click', onRandom);
    document.getElementById('btn-fit').addEventListener('click', onFit);
    this.speedBtn.addEventListener('click', () => this.setSpeed(this.speed === 0 ? this._resume || 1 : this.speed >= 3 ? 0 : this.speed + 1));
    this.viewBtn.addEventListener('click', () => {
      const i = VIEWS.findIndex((v) => v.id === this.view);
      this.setView(VIEWS[(i + 1) % VIEWS.length].id);
    });
    this.inspectEl.addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) onCloseInspect();
    });
    document.addEventListener('pointerdown', (e) => {
      if (!this.tray.hidden && !e.target.closest('#tray') && !e.target.closest('.tool')) this.closeTray();
    });
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === ' ') {
        e.preventDefault();
        this.speedBtn.click();
        return;
      }
      if (e.key === 'v') return this.viewBtn.click();
      if (e.key === 'Escape') return this.closeTray();
      const t = TOOLS.find((tool) => tool.key === e.key.toLowerCase());
      if (t) this.setTool(t.id);
    });
    this.setTool(this.tool);
    this.renderSpeed();
    this.renderView();
  }

  groupOf(toolId) {
    return TOOL_GROUPS.find((g) => g.tools.some((t) => t.id === toolId));
  }

  pressGroup(groupId) {
    const g = TOOL_GROUPS.find((x) => x.id === groupId);
    if (g.tools.length > 1) {
      if (!this.tray.hidden && this.trayGroup === groupId) return this.closeTray();
      this.setTool(this.groupChoice[groupId]);
      this.openTray(g);
      return;
    }
    this.closeTray();
    this.setTool(this.groupChoice[groupId]);
  }

  openTray(g) {
    this.trayGroup = g.id;
    this.tray.innerHTML = g.tools
      .map(
        (t) =>
          `<button type="button" class="tray-item" data-tool="${t.id}" aria-pressed="${t.id === this.tool}">` +
          `<span class="tool-icon tint-${t.id}">${ICONS[t.id]}</span><span>${t.label}</span><kbd>${t.key.toUpperCase()}</kbd></button>`
      )
      .join('');
    for (const b of this.tray.querySelectorAll('.tray-item')) {
      b.addEventListener('click', () => {
        this.setTool(b.dataset.tool);
        this.closeTray();
      });
    }
    const anchor = document.getElementById(`group-${g.id}`).getBoundingClientRect();
    this.toastEl.classList.remove('show');
    this.tray.hidden = false;
    const w = this.tray.offsetWidth;
    const left = Math.max(12, Math.min(window.innerWidth - w - 12, anchor.left + anchor.width / 2 - w / 2));
    this.tray.style.left = `${left}px`;
  }

  closeTray() {
    this.tray.hidden = true;
  }

  setTool(id) {
    this.tool = id;
    const group = this.groupOf(id);
    this.groupChoice[group.id] = id;
    for (const b of this.toolbar.querySelectorAll('.tool')) {
      const g = TOOL_GROUPS.find((x) => x.id === b.dataset.group);
      const choice = TOOLS.find((t) => t.id === this.groupChoice[g.id]);
      b.setAttribute('aria-pressed', String(g.id === group.id));
      b.title = g.tools.length > 1 ? `${g.label}: ${choice.label} (${choice.key.toUpperCase()})` : `${choice.label} (${choice.key.toUpperCase()})`;
      b.innerHTML =
        `<span class="tool-icon tint-${choice.id}">${ICONS[choice.id]}</span>` +
        `<span class="tool-label">${g.tools.length > 1 ? choice.label : g.label}</span>` +
        (g.tools.length > 1 ? '<span class="more" aria-hidden="true"></span>' : '');
    }
    if (!this.tray.hidden) for (const b of this.tray.querySelectorAll('.tray-item')) b.setAttribute('aria-pressed', String(b.dataset.tool === id));
    this.onTool(id);
  }

  setSpeed(speed) {
    if (speed > 0) this._resume = speed;
    this.speed = speed;
    this.renderSpeed();
    this.onSpeed(speed);
  }

  renderSpeed() {
    const paused = this.speed === 0;
    this.speedBtn.innerHTML = `${paused ? ICONS.play : ICONS.pause}<span class="pill-text">${paused ? 'Paused' : `${this.speed}×`}</span>`;
    this.speedBtn.setAttribute('aria-label', paused ? 'Resume time' : `Speed ${this.speed}×, change speed`);
    this.speedBtn.classList.toggle('is-paused', paused);
  }

  setView(id) {
    this.view = id;
    this.renderView();
    this.onView(id);
  }

  renderView() {
    const v = VIEWS.find((x) => x.id === this.view);
    this.viewBtn.innerHTML = `${ICONS.layers}<span class="pill-text">${v.label}</span>`;
    this.viewBtn.setAttribute('aria-label', `Map view: ${v.label}. Switch view`);
    this.viewBtn.classList.toggle('is-on', this.view !== 'none');
    const legend = LEGENDS[this.view];
    this.legendEl.hidden = !legend;
    if (legend) {
      this.legendEl.innerHTML = `<span class="legend-title">${v.label}</span><span class="legend-sub">${legend[0]}</span><span class="legend-bar ${legend[3]}"></span><span class="legend-ends"><span>${legend[1]}</span><span>${legend[2]}</span></span>`;
    }
  }

  update(city) {
    const s = city.stats;
    const set = (key, el, value, prop = 'textContent') => {
      if (this._last[key] === value) return;
      this._last[key] = value;
      if (prop === 'd') el.setAttribute('d', value);
      else el[prop] = value;
    };
    set('pop', this.popEl, s.population.toLocaleString());
    set('cap', this.capEl, `/${s.capacity.toLocaleString()}`);
    set('happy', this.happyEl, s.homes ? `${s.happiness}%` : '–');
    set('mood', this.moodEl, MOUTHS[s.happiness >= 60 ? 'happy' : s.happiness >= 40 ? 'okay' : 'sad'], 'd');
    if (this._last.meterW !== s.happiness) {
      this._last.meterW = s.happiness;
      this.meterEl.style.width = `${s.homes ? s.happiness : 0}%`;
    }
    const work = s.jobs ? ` · ${pct(s.employment ?? 1)} employed` : '';
    set('clock', this.clockEl, `Day ${city.day} · ${formatClock(city.clock)}${work}`);
  }

  // Inspector: what is on a tile and why people do or don't want to live there.
  inspect(city, sel) {
    if (!sel) {
      this.inspectEl.hidden = true;
      this._inspectKey = null;
      return;
    }
    const t = city.getTile(sel.x, sel.y);
    if (!t) return;
    const s = t.structure;
    const def = s && STRUCTURES[s.type];
    let title = t.terrain === 'water' ? 'Water' : s ? def.label : 'Open land';
    const facts = [];
    if (def?.capacity) {
      facts.push(['Residents', `${s.residents} of ${def.capacity}`]);
      const workers = workersIn(t);
      if (workers) facts.push(['Working', `${Math.round(t.employment * workers)} of ${workers}`]);
    }
    if (def?.jobs) facts.push(['Jobs filled', `${t.workersFilled} of ${def.jobs}`]);
    if (def?.service) facts.push(['Covers', `${def.radius} tiles around it`]);
    if (s?.type === 'road') facts.push(['Traffic', t.congestion < 0.02 ? 'Clear' : `${pct(t.congestion)} busy`]);
    if (!city.accessRoad(t.x, t.y) && def && !def.walkable) facts.push(['Road access', 'None nearby']);
    const showFactors = t.terrain !== 'water' && s?.type !== 'road';
    const factors = showFactors
      ? FACTORS.filter((f) => f.enabled).map((f) => ({ label: f.label, v: t.factors[f.id] || 0 }))
      : [];
    const coverage = SERVICES.map((sv) => `${sv.label.replace(/s$/, '')} ${pct(t.coverage?.[sv.id] || 0)}`).join(' · ');
    const key = JSON.stringify([title, facts, factors.map((f) => f.v.toFixed(3)), t.desirability.toFixed(3), coverage]);
    if (key === this._inspectKey) return;
    this._inspectKey = key;
    this.inspectEl.hidden = false;
    this.inspectEl.innerHTML =
      `<header><div><span class="insp-kicker">Tile ${t.x}, ${t.y}</span><h2>${title}</h2></div>` +
      `<button type="button" class="insp-close" data-close aria-label="Close inspector">${ICONS.close}</button></header>` +
      (facts.length ? `<dl>${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : '') +
      (showFactors
        ? `<div class="insp-score"><span>Desirability</span><strong>${pct(t.desirability)}</strong></div>` +
          `<ul class="factors">${factors
            .map(
              (f) =>
                `<li><span>${f.label}</span><span class="fbar"><span class="${f.v < 0 ? 'neg' : 'pos'}" style="width:${Math.min(100, (Math.abs(f.v) / 0.35) * 100).toFixed(0)}%"></span></span><span class="fval">${f.v >= 0 ? '+' : '−'}${Math.round(Math.abs(f.v) * 100)}</span></li>`
            )
            .join('')}</ul><p class="insp-note">${coverage}</p>`
        : '');
  }

  toast(message, ms = 2600) {
    this.toastEl.textContent = message;
    this.toastEl.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.toastEl.classList.remove('show'), ms);
  }
}

return { Interface };
})();

// ---- main.js ----
const __mod_main = (() => {
// Wiring: creates each system, connects input to state, and runs the frame loop.

const { DEFAULT_MAP_SIZE, STRUCTURES } = __mod_config;
const { CityState } = __mod_state;
const { Simulation } = __mod_simulation;
const { Renderer } = __mod_renderer;
const { Camera } = __mod_camera;
const { InputController } = __mod_input;
const { AutoSaver, loadCity } = __mod_persistence;
const { generateTown } = __mod_generator;
const { Interface } = __mod_ui;
const { worldToGrid, mapBounds, tileRectBounds } = __mod_iso;
function start(hotData = {}) {
  const canvas = document.getElementById('city');
  let city = null;
  try {
    if (hotData.city) city = CityState.fromJSON(hotData.city);
  } catch {
    city = null;
  }
  city = city || loadCity();
  const fresh = !city;
  if (!city) city = new CityState(DEFAULT_MAP_SIZE, DEFAULT_MAP_SIZE);

  const camera = new Camera();
  camera.smooth = !window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const sim = new Simulation(city);
  const renderer = new Renderer(canvas, city, camera, sim.agents);
  const saver = new AutoSaver(city);

  let tool = 'house';
  let hover = null; // { x, y } tile under the mouse
  let selected = null; // { x, y } tile shown in the inspector
  let overlay = 'none';
  let fitted = false;
  let framing = 'town'; // what the recenter button framed last

  const tileAt = (sx, sy) => {
    const w = camera.screenToWorld(sx, sy);
    const g = worldToGrid(w.x, w.y);
    const x = Math.floor(g.gx);
    const y = Math.floor(g.gy);
    return city.inBounds(x, y) ? { x, y } : null;
  };

  const ui = new Interface({
    onTool: (id) => {
      tool = id;
      if (id !== 'inspect') selected = null;
    },
    onRandom: () => {
      generateTown(city);
      sim.refresh();
      selected = null;
      fitView(false);
      ui.toast('A fresh town, with room to grow');
    },
    // First press frames the town; pressing again shows the whole map.
    onFit: () => fitView(false, framing === 'town' ? 'map' : 'town'),
    onSpeed: (speed) => {
      sim.speed = speed;
    },
    onView: (id) => {
      overlay = id;
    },
    onCloseInspect: () => {
      selected = null;
    },
  });

  function uiInsets() {
    const narrow = window.innerWidth < 560;
    return { top: narrow ? 96 : 76, bottom: narrow ? 92 : 100, left: narrow ? 4 : 16, right: narrow ? 4 : 16 };
  }

  // The part of the map that is built up: homes, workplaces and services.
  function townBounds() {
    let x0 = Infinity;
    let y0 = Infinity;
    let x1 = -Infinity;
    let y1 = -Infinity;
    for (const t of city.tiles) {
      const s = t.structure;
      if (!s || s.type === 'tree' || s.type === 'road') continue;
      x0 = Math.min(x0, t.x);
      y0 = Math.min(y0, t.y);
      x1 = Math.max(x1, t.x);
      y1 = Math.max(y1, t.y);
    }
    if (x0 === Infinity) return null;
    // Portrait phones are narrow; frame the town's core so buildings read at a comfortable size.
    if (window.innerWidth < 560) {
      const cx = (x0 + x1) / 2;
      const cy = (y0 + y1) / 2;
      const r = Math.max(3, Math.min(x1 - x0, y1 - y0) * 0.3);
      x0 = Math.round(cx - r);
      x1 = Math.round(cx + r);
      y0 = Math.round(cy - r);
      y1 = Math.round(cy + r);
    }
    const pad = 1;
    return tileRectBounds(Math.max(0, x0 - pad), Math.max(0, y0 - pad), Math.min(city.width - 1, x1 + pad), Math.min(city.height - 1, y1 + pad));
  }

  function fitView(immediate, target = 'town') {
    camera.setBounds(mapBounds(city.width, city.height));
    const rect = target === 'town' ? townBounds() : null;
    camera.fit(uiInsets(), immediate, rect || camera.bounds);
    framing = rect ? 'town' : 'map';
  }

  function resize() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    renderer.resize(w, h);
    camera.setViewport(w, h);
    camera.setBounds(mapBounds(city.width, city.height));
    if (!fitted) {
      fitView(true);
      fitted = true;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  new InputController(canvas, camera, {
    onTap: (sx, sy) => {
      const t = tileAt(sx, sy);
      if (tool === 'inspect') {
        selected = t && !(selected && selected.x === t.x && selected.y === t.y) ? t : null;
        ui.inspect(city, selected);
        return;
      }
      if (!t) return;
      if (!city.apply(tool, t.x, t.y)) renderer.nudge(t.x, t.y);
    },
    onBulldoze: (sx, sy) => {
      const t = tileAt(sx, sy);
      if (t && !city.apply('bulldoze', t.x, t.y)) renderer.nudge(t.x, t.y);
    },
    onHover: (sx, sy) => {
      hover = sx == null ? null : tileAt(sx, sy);
    },
  });

  if (fresh) {
    generateTown(city);
    sim.refresh();
    fitView(true);
    const touch = window.matchMedia?.('(pointer: coarse)').matches;
    ui.toast(touch ? 'Tap to build · long-press to bulldoze' : 'Click to build · right-click to bulldoze', 5200);
  } else {
    sim.refresh();
    city.emit('loaded');
    ui.toast('Welcome back to your town', 2400);
  }

  const hot = window.claude?.hot;
  hot?.snapshot?.(() => ({ city: city.toJSON() }));

  function viewState() {
    if (!hover) return { overlay, selected };
    const t = city.getTile(hover.x, hover.y);
    const valid = tool === 'inspect' || city.canApply(tool, hover.x, hover.y);
    const ghost =
      valid && STRUCTURES[tool] && !t.structure && t.terrain === 'grass'
        ? { x: hover.x, y: hover.y, structure: { type: tool, variant: 'blush', floors: tool === 'office' ? 4 : 5, shape: 0, residents: 0 } }
        : null;
    return { hover: { ...hover, tool, valid }, ghost, overlay, selected };
  }

  let last = performance.now();
  let uiTimer = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    sim.update(dt);
    camera.update(dt);
    renderer.render(dt, viewState());
    saver.tick(dt);
    uiTimer -= dt;
    if (uiTimer <= 0) {
      ui.update(city);
      ui.inspect(city, selected);
      uiTimer = 0.2;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Handy for poking at the simulation from the console.
  window.pocketMetropolis = { city, sim, camera, renderer };
}

const hot = window.claude?.hot;
if (hot?.ready) hot.ready(start);
else start(hot?.data ?? {});

return {  };
})();

})();
</script>
